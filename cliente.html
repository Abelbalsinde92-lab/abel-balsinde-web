<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AB Coach — Área Cliente</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ─── VARIABLES ─────────────────────────────────────────── */
    :root {
      --navy:  #020B18;
      --navy2: #061427;
      --navy3: #0D1E30;
      --navy4: #132236;
      --red:   #E20613;
      --blue:  #5EC5F0;
      --white: #F5F9FF;
      --gray:  #8A9BB0;
      --green: #22c55e;
      --yellow:#f59e0b;
      --orange:#f97316;
      --wa:    #25D366;
      --font-title: 'Bebas Neue', sans-serif;
      --font-body:  'DM Sans', sans-serif;
      --font-mono:  'Space Mono', monospace;
    }

    /* ─── RESET ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--navy);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; outline: none; font-family: var(--font-body); }
    input  { outline: none; font-family: var(--font-body); }

    /* ─── UTILITY ───────────────────────────────────────────── */
    .hidden  { display: none !important; }
    .sr-only { position: absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

    /* ─── LOGIN SCREEN ──────────────────────────────────────── */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(ellipse at 60% 0%, #0d1e3080 0%, transparent 60%),
                  var(--navy);
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      background: var(--navy2);
      border: 1px solid #1a2e44;
      border-radius: 16px;
      padding: 40px 32px 36px;
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .login-logo .logo-badge {
      width: 44px; height: 44px;
      background: var(--red);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-title);
      font-size: 20px;
      color: var(--white);
      letter-spacing: 1px;
    }
    .login-logo .logo-text {
      font-family: var(--font-title);
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--white);
    }
    .login-logo .logo-text span { color: var(--red); }
    .login-title {
      font-family: var(--font-title);
      font-size: 30px;
      letter-spacing: 2px;
      color: var(--white);
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 28px;
    }

    /* Form fields */
    .field-group { margin-bottom: 16px; }
    .field-group label {
      display: block;
      font-size: 11px;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      color: var(--gray);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .field-group input {
      width: 100%;
      background: var(--navy3);
      border: 1px solid #1e3450;
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--white);
      font-size: 15px;
      transition: border-color .2s;
    }
    .field-group input:focus { border-color: var(--blue); }
    .field-group input::placeholder { color: #3a5068; }

    /* Buttons */
    .btn-primary {
      width: 100%;
      background: var(--red);
      color: var(--white);
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .5px;
      transition: opacity .2s, transform .1s;
      margin-top: 4px;
    }
    .btn-primary:hover  { opacity: .88; }
    .btn-primary:active { transform: scale(.98); }

    .btn-wa-login {
      width: 100%;
      background: transparent;
      border: 1px solid #1e3450;
      color: var(--gray);
      border-radius: 8px;
      padding: 11px;
      font-size: 13px;
      margin-top: 12px;
      transition: border-color .2s, color .2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-wa-login:hover { border-color: var(--wa); color: var(--wa); }

    .login-error {
      background: #2a0608;
      border: 1px solid var(--red);
      color: #f87171;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* ─── LOADING OVERLAY ───────────────────────────────────── */
    #loadingOverlay {
      position: fixed; inset: 0;
      background: var(--navy);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      z-index: 999;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #1a2e44;
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingOverlay p { color: var(--gray); font-size: 13px; }

    /* ─── DASHBOARD ─────────────────────────────────────────── */
    #dashboardScreen { min-height: 100vh; }

    /* Header */
    .dash-header {
      background: var(--navy2);
      border-bottom: 1px solid #1a2e44;
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .dash-header-logo {
      display: flex; align-items: center; gap: 9px;
    }
    .dash-header-logo .logo-badge {
      width: 32px; height: 32px;
      background: var(--red);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-title);
      font-size: 15px; color: var(--white);
    }
    .dash-header-logo .logo-text {
      font-family: var(--font-title);
      font-size: 17px; letter-spacing: 2px;
    }
    .dash-header-logo .logo-text span { color: var(--red); }

    .dash-header-actions {
      display: flex; align-items: center; gap: 8px;
    }
    .btn-icon {
      background: transparent;
      border: 1px solid #1e3450;
      color: var(--gray);
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 12px;
      display: flex; align-items: center; gap: 6px;
      transition: border-color .2s, color .2s, background .2s;
    }
    .btn-icon:hover { border-color: var(--blue); color: var(--blue); }
    .btn-icon.red:hover { border-color: var(--red); color: var(--red); }

    #btnHeaderWA {
      border-color: var(--wa);
      color: var(--wa);
      background: rgba(37, 211, 102, .07);
    }
    #btnHeaderWA:hover {
      border-color: var(--wa);
      color: #fff;
      background: var(--wa);
    }

    /* ─── CLIENT NAV (tabs) ─────────────────────────────────── */
    .client-nav {
      background: var(--navy2);
      border-bottom: 1px solid #1a2e44;
      position: sticky;
      top: 56px;
      z-index: 90;
      display: flex;
      overflow-x: auto;
      gap: 4px;
      padding: 8px 14px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .client-nav::-webkit-scrollbar { display: none; }

    .client-nav button {
      flex: 0 0 auto;
      background: transparent;
      color: var(--gray);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .8px;
      text-transform: uppercase;
      white-space: nowrap;
      transition: color .15s, border-color .15s, background .15s;
    }
    .client-nav button:hover {
      color: var(--blue);
    }
    .client-nav button.active {
      color: var(--blue);
      border-color: rgba(94,197,240,.35);
      background: rgba(94,197,240,.07);
    }

    /* ─── MAIN ──────────────────────────────────────────────── */
    .dash-main {
      max-width: 740px;
      margin: 0 auto;
      padding: 22px 16px 80px;
    }

    /* ─── SECTION ───────────────────────────────────────────── */
    .section {
      background: var(--navy2);
      border: 1px solid #1a2e44;
      border-radius: 14px;
      overflow: hidden;
    }
    .section-hidden { display: none !important; }

    .section {
      animation: sectionFade .18s ease;
    }
    @keyframes sectionFade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      padding: 16px 20px;
      border-bottom: 1px solid #1a2e44;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-header h2 {
      font-family: var(--font-title);
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--white);
    }
    .section-header .sec-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      background: var(--navy3);
      border: 1px solid #1e3450;
      color: var(--gray);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .section-body { padding: 18px 20px; }

    /* ─── EMPTY STATE ───────────────────────────────────────── */
    .empty-state {
      color: var(--gray);
      font-size: 13px;
      font-style: italic;
      padding: 8px 0;
      line-height: 1.7;
    }

    /* ─── DATA CARDS ────────────────────────────────────────── */
    .data-card {
      background: var(--navy3);
      border: 1px solid #1e3450;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .data-card:last-child { margin-bottom: 0; }
    .data-card.next-session {
      border-color: var(--blue);
      background: rgba(94,197,240,.05);
    }

    .data-card .dc-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-bottom: 4px;
    }
    .data-card .dc-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--white);
    }
    .data-card .dc-sub {
      font-size: 12px;
      color: var(--gray);
      font-family: var(--font-mono);
    }
    .data-card .dc-note {
      font-size: 12px;
      color: var(--gray);
      margin-top: 6px;
      font-style: italic;
    }
    .data-card .dc-meta {
      font-size: 12px;
      color: var(--gray);
    }
    .next-label {
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 8px;
    }
    
    .action-box {
  margin-top: 16px;
  display: grid;
  gap: 10px;
}

.client-action-btn {
  width: 100%;
  background: rgba(94,197,240,.07);
  border: 1px solid rgba(94,197,240,.35);
  color: var(--blue);
  border-radius: 10px;
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .8px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.client-action-btn:hover {
  background: rgba(94,197,240,.12);
}

.client-action-btn.wa {
  border-color: var(--wa);
  color: var(--wa);
  background: rgba(37,211,102,.07);
}

.client-action-btn.wa:hover {
  background: rgba(37,211,102,.14);
}

    /* Badges */
    .badge {
      display: inline-block;
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: .5px;
      font-weight: 700;
    }
    .badge-green  { background: #052512; color: var(--green); border: 1px solid var(--green); }
    .badge-yellow { background: #1f1400; color: var(--yellow); border: 1px solid var(--yellow); }
    .badge-red    { background: #2a0608; color: #f87171; border: 1px solid var(--red); }
    .badge-blue   { background: #031b2a; color: var(--blue); border: 1px solid var(--blue); }
    .badge-gray   { background: #0d1e30; color: var(--gray); border: 1px solid #2a3e52; }

    /* ─── PLAN SECTION ──────────────────────────────────────── */
    .plan-grid {
      display: grid;
      gap: 14px 16px;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 480px) {
      .plan-grid { grid-template-columns: 1fr; gap: 12px; }
    }
    .plan-item .pi-label {
      font-size: 10px; font-family: var(--font-mono);
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--gray); margin-bottom: 3px;
    }
    .plan-item .pi-value {
      font-size: 14px; color: var(--white); font-weight: 500;
    }
    .plan-item.full { grid-column: 1 / -1; }
    .plan-item.full .pi-value {
      font-size: 14px;
      color: var(--white);
      line-height: 1.65;
    }
    .plan-divider {
      grid-column: 1 / -1;
      border: none;
      border-top: 1px solid #1e3450;
      margin: 4px 0;
    }
    .plan-no-program {
      background: var(--navy3);
      border: 1px dashed #1e3450;
      border-radius: 10px;
      padding: 16px;
      color: var(--gray);
      font-size: 13px;
      font-style: italic;
      line-height: 1.6;
      margin-top: 4px;
    }

    /* ─── PROGRESS CIRCLES ─────────────────────────────────── */
    .progress-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .progress-circle-card {
      background: var(--navy3);
      border: 1px solid #1e3450;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }
    .progress-ring {
      width: 88px; height: 88px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--blue) calc(var(--p) * 1%), #17283b 0);
      position: relative;
    }
    .progress-ring::before {
      content: '';
      position: absolute;
      width: 66px; height: 66px;
      background: var(--navy3);
      border-radius: 50%;
    }
    .progress-ring span {
      position: relative;
      z-index: 1;
      font-family: var(--font-title);
      font-size: 22px;
      color: var(--white);
      letter-spacing: 1px;
    }
    .progress-circle-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 3px;
    }
    .progress-circle-value {
      font-size: 13px;
      color: var(--white);
      font-weight: 700;
    }
    .progress-circle-note {
      font-size: 11px;
      color: var(--gray);
      margin-top: 3px;
    }

    /* ─── NOTES ─────────────────────────────────────────────── */
    .note-item {
      background: var(--navy3);
      border-left: 3px solid var(--blue);
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--white);
      margin-bottom: 8px;
      line-height: 1.6;
    }
    .note-item:last-child { margin-bottom: 0; }

    /* ─── ACCORDION (Mis datos) ─────────────────────────────── */
    .accordion-block {
      background: var(--navy3);
      border: 1px solid #1e3450;
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .accordion-block:last-child { margin-bottom: 0; }
    .accordion-title {
      width: 100%;
      background: transparent;
      color: var(--white);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .accordion-title span:first-child { color: var(--blue); }
    .accordion-symbol {
      color: var(--gray);
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
    }
    .accordion-content {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .accordion-block.open .accordion-content { display: block; }
    .accordion-block.open .accordion-title { background: rgba(94,197,240,.05); }

    /* ─── RESPONSIVE ────────────────────────────────────────── */
    @media (max-width: 480px) {
      .login-box { padding: 28px 20px 28px; }
      .dash-header { padding: 0 12px; height: 52px; }
      .dash-header-logo .logo-text { font-size: 14px; }
      .btn-icon .btn-label { display: none; }
      .dash-main { padding: 16px 12px 70px; }
      .section-header h2 { font-size: 17px; }
      .client-nav { top: 52px; padding: 8px 10px; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════
     LOADING OVERLAY
════════════════════════════════════════════════════════════ -->
<div id="loadingOverlay" class="hidden">
  <div class="spinner"></div>
  <p>Cargando...</p>
</div>

<!-- ════════════════════════════════════════════════════════════
     LOGIN SCREEN
════════════════════════════════════════════════════════════ -->
<div id="loginScreen">
  <div class="login-box">

    <div class="login-logo">
      <div class="logo-badge">AB</div>
      <div class="logo-text">ABEL <span>BALSINDE</span></div>
    </div>

    <h1 class="login-title">ÁREA CLIENTE</h1>
    <p class="login-sub">Accede a tu seguimiento personal.</p>

    <div id="loginError" class="login-error hidden">
      Teléfono o código incorrecto. Revisa los datos e inténtalo de nuevo.
    </div>

    <div class="field-group">
      <label for="inputPhone">Teléfono</label>
      <input type="tel" id="inputPhone" placeholder="Ej. +34 627 493 593" autocomplete="tel" />
    </div>

    <div class="field-group">
      <label for="inputCode">Código de acceso</label>
      <input type="text" id="inputCode" placeholder="Ej. AB1234" autocomplete="off" />
    </div>

    <button class="btn-primary" id="btnLogin">Entrar</button>

      ¿Necesitas ayuda? Contacta a Abel
    </button>

  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     DASHBOARD SCREEN
════════════════════════════════════════════════════════════ -->
<div id="dashboardScreen" class="hidden">

  <!-- Header -->
  <header class="dash-header">
    <div class="dash-header-logo">
      <div class="logo-badge">AB</div>
      <div class="logo-text">ABEL <span>BALSINDE</span></div>
    </div>
    <div class="dash-header-actions">
      <button class="btn-icon" id="btnHeaderWA">

/* ════════════════════════════════════════════════════════════

function normalizePhone(phone) {
  return String(phone).replace(/[\s\-\(\)\+]/g, '');
}

function buildWAUrl(phone, message) {
  return `https://wa.me/${normalizePhone(phone)}?text=${encodeURIComponent(message)}`;
}

function openWA(message) {
  window.open(buildWAUrl(WA_NUMBER, message), '_blank');
}

function clientWA(text) {
  const name = clientData?.name || 'cliente';
  openWA(`Hola Abel, soy ${name}. ${text}`);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  try {
    const [year, month, day] = String(dateStr).slice(0, 10).split('-');
    return `${day}/${month}/${year}`;
  } catch { return dateStr; }
}

function formatTime(timeStr) {
  if (!timeStr) return '';
  return String(timeStr).slice(0, 5);
}

function formatMoney(amount, currency) {
  if (amount == null) return '—';
  const cur = (currency || 'EUR').toUpperCase();
  try {
    return new Intl.NumberFormat('es-ES', { style:'currency', currency: cur }).format(amount);
  } catch { return `${amount} ${cur}`; }
}

function showError(msg) {
  const el = document.getElementById('loginError');
  if (!el) return;
  el.textContent = msg || 'Teléfono o código incorrecto.';
  el.classList.remove('hidden');
}

function hideError() {
  const el = document.getElementById('loginError');
  if (el) el.classList.add('hidden');
}

function showLoading(visible) {
  const el = document.getElementById('loadingOverlay');
  if (el) el.classList.toggle('hidden', !visible);
}

function paymentBadge(status) {
  if (!status) return '';
  const s = status.toLowerCase();
  if (['pagado','paid'].includes(s))           return `<span class="badge badge-green">${status}</span>`;
  if (['pendiente','pending'].includes(s))     return `<span class="badge badge-yellow">${status}</span>`;
  if (['vencido','overdue'].includes(s))       return `<span class="badge badge-red">${status}</span>`;
  return `<span class="badge badge-gray">${status}</span>`;
}

function genericBadge(status) {
  if (!status) return '';
  const s = status.toLowerCase();
  if (['activo','active','confirmada','confirmado','realizada','completado'].includes(s))
    return `<span class="badge badge-green">${status}</span>`;
  if (['pendiente','pending','reservada'].includes(s))
    return `<span class="badge badge-yellow">${status}</span>`;
  if (['cancelada','cancelado','vencido','inactivo'].includes(s))
    return `<span class="badge badge-red">${status}</span>`;
  if (['reprogramada','revisión'].includes(s))
    return `<span class="badge badge-blue">${status}</span>`;
  return `<span class="badge badge-gray">${status}</span>`;
}

/* ════════════════════════════════════════════════════════════
   AUTH
════════════════════════════════════════════════════════════ */

async function loginClient() {
  hideError();
  const phone = document.getElementById('inputPhone').value.trim();
  const code  = document.getElementById('inputCode').value.trim().toUpperCase();

  if (!phone || !code) { showError('Completa los dos campos.'); return; }

  showLoading(true);
  try {
    const { data: clients, error } = await db.from('clients').select('*');
    if (error) throw error;

    const normalInput = normalizePhone(phone);
    const found = (clients || []).find(c =>
      normalizePhone(c.phone) === normalInput &&
      (c.access_code || '').trim().toUpperCase() === code
    );

    if (!found) {
      showLoading(false);
      showError('Teléfono o código incorrecto.');
      return;
    }

    localStorage.setItem(LS_CLIENT_ID, found.id);
    localStorage.setItem(LS_CLIENT_PHONE, normalizePhone(found.phone || phone));

    await loadClientDashboard(found.id);
  } catch (err) {
    showLoading(false);
    showError('Error: ' + (err.message || JSON.stringify(err)));
    console.error('Login error:', err);
  }
}

function logoutClient() {
  localStorage.removeItem(LS_CLIENT_ID);
  localStorage.removeItem(LS_CLIENT_PHONE);

  clientData = null;
  clientReservations = [];
  clientPayments = [];
  clientMetrics = [];
  clientAlerts = [];
  clientPrograms = [];

  const dash  = document.getElementById('dashboardScreen');
  const login = document.getElementById('loginScreen');
  if (dash)  dash.classList.add('hidden');
  if (login) login.classList.remove('hidden');

  const ip = document.getElementById('inputPhone');
  const ic = document.getElementById('inputCode');
  if (ip) ip.value = '';
  if (ic) ic.value = '';

  hideError();
}

/* ════════════════════════════════════════════════════════════
   DATA LOADING
════════════════════════════════════════════════════════════ */

async function loadClientDashboard(clientId) {
  showLoading(true);

  try {
    const { data: client, error: cErr } = await db
      .from('clients').select('*').eq('id', clientId).single();

    if (cErr || !client) {
      localStorage.removeItem(LS_CLIENT_ID);
      showLoading(false);
      const login = document.getElementById('loginScreen');
      const dash  = document.getElementById('dashboardScreen');
      if (login) login.classList.remove('hidden');
      if (dash)  dash.classList.add('hidden');
      showError('Sesión expirada. Vuelve a iniciar sesión.');
      return;
    }

    clientData = client;

    const [resR, payR, metR, halR, proR] = await Promise.all([
      db.from('reservations').select('*').eq('client_id', clientId).order('date', { ascending: true }),
      db.from('payments').select('*').eq('client_id', clientId).order('due_date', { ascending: false }),
      db.from('metrics').select('*').eq('client_id', clientId).order('date', { ascending: false }),
      db.from('health_alerts').select('*').eq('client_id', clientId).order('date', { ascending: false }),
      db.from('programs').select('*').eq('client_id', clientId).order('created_at', { ascending: false }),
    ]);

    clientReservations = resR.data || [];
    clientPayments     = payR.data || [];
    clientMetrics      = metR.data || [];
    clientAlerts       = halR.data || [];
    clientPrograms     = proR.data || [];

    renderDashboard();

    const login = document.getElementById('loginScreen');
    const dash  = document.getElementById('dashboardScreen');
    if (login) login.classList.add('hidden');
    if (dash)  dash.classList.remove('hidden');
    showLoading(false);

  } catch (err) {
    showLoading(false);
    console.error('Load error:', err);
    const loginVisible = !document.getElementById('loginScreen')?.classList.contains('hidden');
    if (loginVisible) {
      showError('Error de conexión. Inténtalo de nuevo.');
    } else {
      alert('Error al cargar los datos. Comprueba tu conexión e inténtalo de nuevo.');
    }
  }
}

function renderReservations() {
  const el    = document.getElementById('sectionReservations');
  const badge = document.getElementById('reservationsBadge');
  if (!el) return;
  if (badge) badge.textContent = clientReservations.length;

  if (!clientReservations.length) {
   el.innerHTML = `

    <button class="client-action-btn wa" onclick="clientWA('Quiero solicitar una nueva reserva de entrenamiento.')">

    </button>

`;

  }

  const today = todayISO();
  const upcoming = clientReservations.filter(r =>
    String(r.date).slice(0, 10) >= today &&
    !['cancelada','cancelado'].includes((r.status || '').toLowerCase())
  );
  const past = clientReservations.filter(r =>
    String(r.date).slice(0, 10) < today ||
    ['cancelada','cancelado'].includes((r.status || '').toLowerCase())
  );

  let html = '';

  if (upcoming.length) {
    const next = upcoming[0];
    html += `
      <div class="data-card next-session">

  html += `

/* ── Notas del coach ─────────────────────────────────────── */
function renderNotes() {
  const el  = document.getElementById('sectionNotes');
  if (!el) return;
  const raw = clientData.notes;

  if (!raw || raw === '' || raw === '[]' || raw === 'null') {
    el.innerHTML = '<p class="empty-state">Todavía no hay notas del coach.</p>';
    return;
  }

  let notes = [];
  if (Array.isArray(raw)) {
    notes = raw;
  } else if (typeof raw === 'string') {
    try {
      const parsed = JSON.parse(raw);
      notes = Array.isArray(parsed) ? parsed : [raw];
    } catch { notes = [raw]; }
  }

  notes = notes
    .map(n => {
      if (typeof n === 'string') return n.trim();
      if (typeof n === 'object' && n !== null)
        return String(n.text || n.note || n.message || '').trim();
      return '';
    })
    .filter(Boolean);

  if (!notes.length) {
    el.innerHTML = '<p class="empty-state">Todavía no hay notas del coach.</p>';
    return;
  }

  el.innerHTML = notes.map(n => `<div class="note-item">${n}</div>`).join('');
}

/* ── Progreso visual ─────────────────────────────────────── */
function renderProgressCircles() {
  const el    = document.getElementById('sectionProgressCircles');
  const badge = document.getElementById('progressCircleBadge');
  if (!el) return;

  if (!clientMetrics.length) {
    if (badge) badge.textContent = '0';
    el.innerHTML = '<p class="empty-state">Todavía no hay métricas suficientes para mostrar progreso visual.</p>';
    return;
  }

  const grouped = {};
  clientMetrics.forEach(m => {
    const key = String(m.type || 'Métrica').trim();
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push({
      ...m,
      numericValue: Number(m.value || 0),
      dateKey: String(m.date || '').slice(0, 10)
    });
  });

  const circles = Object.entries(grouped).map(([type, list]) => {
    list.sort((a, b) => String(b.dateKey).localeCompare(String(a.dateKey)));
    const latest  = list[0];
    const first   = list[list.length - 1];
    const current = Number(latest.numericValue || 0);
    const start   = Number(first.numericValue  || 0);
    let percent = 0, note = '';
    const t = type.toLowerCase();

    if (t.includes('peso')) {
      const diff = start - current;
      const baseGoal = Math.max(Math.abs(start * 0.05), 1);
      percent = Math.round(Math.min(100, Math.max(0, (diff / baseGoal) * 100)));
      if (diff > 0)      note = `Bajó ${Math.abs(diff).toFixed(1)} ${latest.unit || 'kg'}`;
      else if (diff < 0) note = `Subió ${Math.abs(diff).toFixed(1)} ${latest.unit || 'kg'}`;
      else               note = 'Sin cambio todavía';
    } else if (t.includes('asistencia') || t.includes('adherencia') || t.includes('%')) {
      percent = Math.round(Math.min(100, Math.max(0, current)));
      note = `${percent}% registrado`;
    } else if (['fuerza','movilidad','resistencia','energía','dolor','sueño'].some(k => t.includes(k))) {
      percent = Math.round(Math.min(100, Math.max(0, (current / 10) * 100)));
      note = `${current}/10`;
    } else {
      if (start > 0) {
        const diff = current - start;
        percent = Math.round(Math.min(100, Math.max(0, (current / start) * 100)));
        note = diff >= 0 ? `+${diff.toFixed(1)} desde inicio` : `${diff.toFixed(1)} desde inicio`;
      } else {
        percent = Math.round(Math.min(100, Math.max(0, current)));
        note = 'Último registro';
      }
    }

    return { type, current, unit: latest.unit || '', percent, note };
  });

  if (badge) badge.textContent = circles.length;

  el.innerHTML = `
    <div class="progress-grid">
      ${circles.map(c => `
        <div class="progress-circle-card">
          <div class="progress-ring" style="--p:${c.percent}">
            <span>${c.percent}%</span>
          </div>
          <div class="progress-circle-label">${c.type}</div>
          <div class="progress-circle-value">${c.current}${c.unit ? ' ' + c.unit : ''}</div>
          <div class="progress-circle-note">${c.note}</div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ════════════════════════════════════════════════════════════
   NAVIGATION
════════════════════════════════════════════════════════════ */

function goClientSection(sectionId) {
  // Hide all sections
  document.querySelectorAll('.dash-main .section').forEach(s => {
    s.classList.add('section-hidden');
  });

  // Show target
  const target = document.getElementById(sectionId);
  if (!target) return;

  target.classList.remove('section-hidden');

  // Update active nav button
  document.querySelectorAll('.client-nav button').forEach(btn => {
    btn.classList.remove('active');
  });

  const activeBtn = Array.from(document.querySelectorAll('.client-nav button')).find(b =>
    b.getAttribute('onclick')?.includes(sectionId)
  );

  if (activeBtn) {
    activeBtn.classList.add('active');
    activeBtn.scrollIntoView({
      behavior: 'smooth',
      block: 'nearest',
      inline: 'center'
    });
  }

  const headerHeight = document.querySelector('.dash-header')?.offsetHeight || 56;
  const navHeight = document.querySelector('.client-nav')?.offsetHeight || 48;
  const mainTop = document.querySelector('.dash-main')?.offsetTop || 0;

  window.scrollTo({
    top: mainTop - headerHeight - navHeight - 8,
    behavior: 'smooth'
  });
}

function toggleAccordion(button) {
  const block = button.closest('.accordion-block');
  if (!block) return;
  const symbol = block.querySelector('.accordion-symbol');
  const isOpen = block.classList.contains('open');
  block.classList.toggle('open', !isOpen);
  if (symbol) symbol.textContent = isOpen ? '+' : '−';
}
