<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AB Coach — Área Cliente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ─── VARIABLES ─────────────────────────────────────────── */
    :root {
      --navy:  #020B18;
      --navy2: #061427;
      --navy3: #0D1E30;
      --navy4: #132236;
      --red:   #E20613;
      --blue:  #5EC5F0;
      --white: #F5F9FF;
      --gray:  #8A9BB0;
      --green: #22c55e;
      --yellow:#f59e0b;
      --orange:#f97316;
      --wa:    #25D366;
      --font-title: 'Bebas Neue', sans-serif;
      --font-body:  'DM Sans', sans-serif;
      --font-mono:  'Space Mono', monospace;
    }

    /* ─── RESET ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--navy); color: var(--white); font-family: var(--font-body); font-size: 15px; line-height: 1.6; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; outline: none; font-family: var(--font-body); }
    input  { outline: none; font-family: var(--font-body); }

    /* ─── UTILITY ───────────────────────────────────────────── */
    .hidden  { display: none !important; }
    .sr-only { position: absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

    /* ─── LOGIN ─────────────────────────────────────────────── */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(ellipse at 60% 0%, #0d1e3080 0%, transparent 60%), var(--navy);
    }
    .login-box { width: 100%; max-width: 400px; background: var(--navy2); border: 1px solid #1a2e44; border-radius: 16px; padding: 40px 32px 36px; }
    .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .login-logo .logo-badge { width: 44px; height: 44px; background: var(--red); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 20px; color: var(--white); }
    .login-logo .logo-text { font-family: var(--font-title); font-size: 22px; letter-spacing: 2px; }
    .login-logo .logo-text span { color: var(--red); }
    .login-title { font-family: var(--font-title); font-size: 30px; letter-spacing: 2px; margin-bottom: 6px; }
    .login-sub   { font-size: 13px; color: var(--gray); margin-bottom: 28px; }

    .field-group { margin-bottom: 16px; }
    .field-group label { display: block; font-size: 11px; font-family: var(--font-mono); letter-spacing: 1px; color: var(--gray); text-transform: uppercase; margin-bottom: 6px; }
    .field-group input { width: 100%; background: var(--navy3); border: 1px solid #1e3450; border-radius: 8px; padding: 12px 14px; color: var(--white); font-size: 15px; transition: border-color .2s; }
    .field-group input:focus { border-color: var(--blue); }
    .field-group input::placeholder { color: #3a5068; }

    .btn-primary { width: 100%; background: var(--red); color: var(--white); border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 700; letter-spacing: .5px; transition: opacity .2s, transform .1s; margin-top: 4px; }
    .btn-primary:hover  { opacity: .88; }
    .btn-primary:active { transform: scale(.98); }

    .btn-wa-login { width: 100%; background: transparent; border: 1px solid #1e3450; color: var(--gray); border-radius: 8px; padding: 11px; font-size: 13px; margin-top: 12px; transition: border-color .2s, color .2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-wa-login:hover { border-color: var(--wa); color: var(--wa); }

    .login-error { background: #2a0608; border: 1px solid var(--red); color: #f87171; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }

    /* ─── LOADING ───────────────────────────────────────────── */
    #loadingOverlay { position: fixed; inset: 0; background: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 999; }
    .spinner { width: 40px; height: 40px; border: 3px solid #1a2e44; border-top-color: var(--red); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingOverlay p { color: var(--gray); font-size: 13px; }

    /* ─── DASHBOARD ─────────────────────────────────────────── */
    #dashboardScreen { min-height: 100vh; }

    .dash-header { background: var(--navy2); border-bottom: 1px solid #1a2e44; padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .dash-header-logo { display: flex; align-items: center; gap: 9px; }
    .dash-header-logo .logo-badge { width: 32px; height: 32px; background: var(--red); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 15px; color: var(--white); }
    .dash-header-logo .logo-text { font-family: var(--font-title); font-size: 17px; letter-spacing: 2px; }
    .dash-header-logo .logo-text span { color: var(--red); }
    .dash-header-actions { display: flex; align-items: center; gap: 8px; }

    .btn-icon { background: transparent; border: 1px solid #1e3450; color: var(--gray); border-radius: 7px; padding: 7px 12px; font-size: 12px; display: flex; align-items: center; gap: 6px; transition: border-color .2s, color .2s, background .2s; }
    .btn-icon:hover     { border-color: var(--blue); color: var(--blue); }
    .btn-icon.red:hover { border-color: var(--red);  color: var(--red);  }
    #btnHeaderWA       { border-color: var(--wa); color: var(--wa); background: rgba(37,211,102,.07); }
    #btnHeaderWA:hover { color: #fff; background: var(--wa); }

    /* ─── NAV TABS ──────────────────────────────────────────── */
    .client-nav { background: var(--navy2); border-bottom: 1px solid #1a2e44; position: sticky; top: 56px; z-index: 90; display: flex; overflow-x: auto; gap: 4px; padding: 8px 14px; scrollbar-width: none; -ms-overflow-style: none; }
    .client-nav::-webkit-scrollbar { display: none; }
    .client-nav button { flex: 0 0 auto; background: transparent; color: var(--gray); border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; white-space: nowrap; transition: color .15s, border-color .15s, background .15s; }
    .client-nav button:hover  { color: var(--blue); }
    .client-nav button.active { color: var(--blue); border-color: rgba(94,197,240,.35); background: rgba(94,197,240,.07); }

    /* ─── MAIN ──────────────────────────────────────────────── */
    .dash-main { max-width: 740px; margin: 0 auto; padding: 22px 16px calc(150px + env(safe-area-inset-bottom)); }

    /* ─── SECTIONS ──────────────────────────────────────────── */
    .section { background: var(--navy2); border: 1px solid #1a2e44; border-radius: 14px; overflow: hidden; animation: sectionFade .18s ease; }
    @keyframes sectionFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .section-hidden { display: none !important; }
    .section-header { padding: 16px 20px; border-bottom: 1px solid #1a2e44; display: flex; align-items: center; justify-content: space-between; }
    .section-header h2 { font-family: var(--font-title); font-size: 20px; letter-spacing: 2px; }
    .section-header .sec-badge { font-size: 10px; font-family: var(--font-mono); background: var(--navy3); border: 1px solid #1e3450; color: var(--gray); padding: 3px 8px; border-radius: 4px; }
    .section-body { padding: 18px 20px; }

    .empty-state { color: var(--gray); font-size: 13px; font-style: italic; padding: 8px 0; line-height: 1.7; }

    /* ─── DATA CARDS (reservas, pagos, salud) ───────────────── */
    .data-card { background: var(--navy3); border: 1px solid #1e3450; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .data-card:last-child { margin-bottom: 0; }
    .data-card.next-session { border-color: var(--blue); background: rgba(94,197,240,.05); }
    .data-card .dc-row { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 4px; }
    .data-card .dc-title { font-weight: 700; font-size: 14px; color: var(--white); }
    .data-card .dc-sub   { font-size: 12px; color: var(--gray); font-family: var(--font-mono); }
    .data-card .dc-note  { font-size: 12px; color: var(--gray); margin-top: 6px; font-style: italic; }
    .data-card .dc-meta  { font-size: 12px; color: var(--gray); }
    .next-label { font-size: 10px; font-family: var(--font-mono); letter-spacing: 1px; text-transform: uppercase; color: var(--blue); margin-bottom: 8px; }

    .action-box { margin-top: 16px; display: grid; gap: 10px; }
    .client-action-btn { width: 100%; background: rgba(94,197,240,.07); border: 1px solid rgba(94,197,240,.35); color: var(--blue); border-radius: 10px; padding: 12px 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .8px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .client-action-btn:hover { background: rgba(94,197,240,.12); }
    .client-action-btn.wa { border-color: rgba(37,211,102,.45); color: var(--wa); background: rgba(37,211,102,.07); }
    .client-action-btn.wa:hover { background: rgba(37,211,102,.14); }

    /* ─── BADGES ────────────────────────────────────────────── */
    .badge { display: inline-block; font-size: 10px; font-family: var(--font-mono); padding: 2px 8px; border-radius: 4px; letter-spacing: .5px; font-weight: 700; }
    .badge-green  { background: #052512; color: var(--green); border: 1px solid var(--green); }
    .badge-yellow { background: #1f1400; color: var(--yellow); border: 1px solid var(--yellow); }
    .badge-red    { background: #2a0608; color: #f87171; border: 1px solid var(--red); }
    .badge-blue   { background: #031b2a; color: var(--blue); border: 1px solid var(--blue); }
    .badge-gray   { background: #0d1e30; color: var(--gray); border: 1px solid #2a3e52; }

    /* ─── PLAN GRID ─────────────────────────────────────────── */
    .plan-grid { display: grid; gap: 14px 16px; grid-template-columns: 1fr 1fr; }
    .plan-item .pi-label { font-size: 10px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 1px; color: var(--gray); margin-bottom: 3px; }
    .plan-item .pi-value { font-size: 14px; color: var(--white); font-weight: 500; }
    .plan-item.full { grid-column: 1 / -1; }
    .plan-item.full .pi-value { font-size: 14px; line-height: 1.65; }
    .plan-divider { grid-column: 1 / -1; border: none; border-top: 1px solid #1e3450; margin: 4px 0; }
    .plan-no-program { background: var(--navy3); border: 1px dashed #1e3450; border-radius: 10px; padding: 16px; color: var(--gray); font-size: 13px; font-style: italic; line-height: 1.6; margin-top: 4px; }

    /* ─── PROGRESS CIRCLES ─────────────────────────────────── */
    .progress-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .progress-circle-card { background: var(--navy3); border: 1px solid #1e3450; border-radius: 12px; padding: 16px 12px; text-align: center; }
    .progress-ring { width: 88px; height: 88px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--blue) calc(var(--p) * 1%), #17283b 0); position: relative; }
    .progress-ring::before { content: ''; position: absolute; width: 66px; height: 66px; background: var(--navy3); border-radius: 50%; }
    .progress-ring span { position: relative; z-index: 1; font-family: var(--font-title); font-size: 22px; color: var(--white); }
    .progress-circle-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--gray); margin-bottom: 3px; }
    .progress-circle-value { font-size: 13px; color: var(--white); font-weight: 700; }
    .progress-circle-note  { font-size: 11px; color: var(--gray); margin-top: 3px; }

    /* ─── NOTES ─────────────────────────────────────────────── */
    .note-item { background: var(--navy3); border-left: 3px solid var(--blue); border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 14px; color: var(--white); margin-bottom: 8px; line-height: 1.6; }
    .note-item:last-child { margin-bottom: 0; }

    /* ─── ACCORDION (Mis datos) ─────────────────────────────── */
    .accordion-block { background: var(--navy3); border: 1px solid #1e3450; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .accordion-block:last-child { margin-bottom: 0; }
    .accordion-title { width: 100%; background: transparent; color: var(--white); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
    .accordion-title span:first-child { color: var(--blue); }
    .accordion-symbol { color: var(--gray); font-size: 18px; line-height: 1; flex-shrink: 0; }
    .accordion-content { display: none; padding: 0 16px 16px; border-top: 1px solid rgba(255,255,255,.06); }
    .accordion-block.open .accordion-content { display: block; }
    .accordion-block.open .accordion-title   { background: rgba(94,197,240,.05); }

    /* ═══════════════════════════════════════════════════════════
       TRAINING GUIDE
    ═══════════════════════════════════════════════════════════ */

    /* Summary header — compact */
    .training-guide-summary {
      background: var(--navy3);
      border-left: 3px solid var(--red);
      border-radius: 0 10px 10px 0;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .training-guide-title {
      font-family: var(--font-title);
      font-size: 22px; letter-spacing: 1px;
      color: var(--white); margin-bottom: 3px;
    }
    .training-guide-meta {
      font-family: var(--font-mono);
      font-size: 10px; color: var(--gray);
      letter-spacing: .8px; margin-bottom: 6px;
    }
    .training-week-objective {
      font-size: 13px; color: var(--gray);
      line-height: 1.6;
      border-top: 1px solid rgba(255,255,255,.06);
      padding-top: 8px; margin-top: 6px;
    }

    /* Session separator (discrete) */
    .training-session-separator {
      font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      color: var(--blue);
      padding: 12px 2px 4px;
    }

    /* Step list */
    .training-step-list { display: flex; flex-direction: column; gap: 8px; }

    /* Step card */
    .training-step-card {
      background: var(--navy3);
      border: 1px solid #1e3450;
      border-radius: 12px; overflow: hidden;
      transition: border-color .2s;
    }
    .training-step-card.open      { border-color: rgba(94,197,240,.4); }
    .training-step-card.completed { border-color: rgba(34,197,94,.3); }

    /* Step header button */
    .training-step-header {
      width: 100%; background: transparent;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      text-align: left; transition: background .15s;
    }
    .training-step-card.open      .training-step-header { background: rgba(94,197,240,.05); }
    .training-step-card.completed .training-step-header { background: rgba(34,197,94,.04); }

    /* Step number badge */
    .training-step-number {
      flex-shrink: 0;
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--navy2); border: 1px solid #1e3450;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-title); font-size: 20px; color: var(--white);
      transition: background .2s, color .2s, border-color .2s;
    }
    .training-step-card.open      .training-step-number { border-color: var(--blue); color: var(--blue); }
    .training-step-card.completed .training-step-number { background: rgba(34,197,94,.12); border-color: var(--green); color: var(--green); font-size: 15px; }

    .training-step-info { flex: 1; min-width: 0; }
    .training-step-title { font-size: 15px; font-weight: 700; color: var(--white); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .training-step-meta  { font-family: var(--font-mono); font-size: 10px; color: var(--gray); margin-top: 3px; letter-spacing: .5px; }

    .training-step-status {
      flex-shrink: 0;
      font-family: var(--font-mono); font-size: 10px;
      letter-spacing: .8px; text-transform: uppercase;
      color: var(--gray); padding: 3px 8px;
      border: 1px solid #1e3450; border-radius: 4px;
      white-space: nowrap;
    }
    .training-step-status.done { color: var(--green); border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.08); }

    /* Step body */
    .training-step-body {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .training-step-card.open .training-step-body { display: block; }

    .training-step-objective {
      font-size: 13px; color: var(--gray); line-height: 1.6;
      padding: 12px 0 12px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      margin-bottom: 12px;
    }

    /* Exercise card */
    .training-exercise-card {
      background: var(--navy2);
      border: 1px solid #1e3450;
      border-left: 2px solid var(--blue);
      border-radius: 0 10px 10px 0;
      padding: 12px 14px; margin-bottom: 8px;
    }
    .training-exercise-card:last-of-type { margin-bottom: 0; }

    .training-exercise-title {
      font-size: 15px; font-weight: 700;
      color: var(--white); margin-bottom: 10px; line-height: 1.3;
    }
    .training-ex-num {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--blue); margin-right: 4px;
    }

    .training-exercise-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 6px; margin-bottom: 10px;
    }
    .training-mini-stat { background: var(--navy3); border: 1px solid #1e3450; border-radius: 8px; padding: 8px 6px; text-align: center; }
    .training-mini-label { font-family: var(--font-mono); font-size: 9px; color: var(--gray); text-transform: uppercase; letter-spacing: .6px; display: block; margin-bottom: 3px; }
    .training-mini-value { font-family: var(--font-title); font-size: 20px; color: var(--white); letter-spacing: .5px; line-height: 1; }

    .training-level-tag { display: inline-block; font-family: var(--font-mono); font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid #2a3e52; color: var(--gray); margin-bottom: 8px; }

    .training-instruction { font-size: 14px; color: var(--white); line-height: 1.7; margin-top: 8px; }
    .training-instruction strong { display: block; color: var(--blue); font-family: var(--font-mono); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; font-weight: 400; margin-bottom: 4px; }

    .training-coach-note { font-size: 13px; color: var(--gray); font-style: italic; line-height: 1.6; margin-top: 6px; }

    .training-video-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 7px 12px; background: rgba(94,197,240,.08); border: 1px solid rgba(94,197,240,.3); border-radius: 8px; color: var(--blue); font-family: var(--font-mono); font-size: 10px; letter-spacing: .8px; text-transform: uppercase; transition: background .15s; }
    .training-video-btn:hover { background: rgba(94,197,240,.16); }

    /* Complete block button */
    .training-complete-block-btn {
      width: 100%;
      background: var(--green); color: #fff;
      border-radius: 12px; padding: 16px;
      font-size: 16px; font-weight: 700; letter-spacing: .3px;
      margin-top: 16px;
      transition: opacity .2s;
    }
    .training-complete-block-btn:hover   { opacity: .88; }
    .training-complete-block-btn:disabled { opacity: .5; cursor: default; }

    .training-step-done-msg {
      text-align: center; color: var(--green);
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 1px; text-transform: uppercase;
      padding: 12px 0 0;
    }

    /* Finish card */
    .training-finish-card {
      background: var(--navy3);
      border: 1px solid rgba(34,197,94,.45);
      border-radius: 14px; padding: 28px 20px;
      margin-top: 16px; text-align: center;
    }
    .training-finish-icon  { font-size: 40px; margin-bottom: 10px; }
    .training-finish-title { font-family: var(--font-title); font-size: 28px; letter-spacing: 2px; color: var(--white); margin-bottom: 6px; }
    .training-finish-sub   { font-size: 13px; color: var(--gray); line-height: 1.6; margin-bottom: 16px; }

    /* Notes box */
    .training-notes-box { background: var(--navy3); border: 1px solid #1e3450; border-radius: 14px; padding: 20px; margin-top: 12px; }
    .training-notes-title { font-family: var(--font-title); font-size: 20px; letter-spacing: 1px; color: var(--white); margin-bottom: 6px; }
    .training-notes-sub   { font-size: 13px; color: var(--gray); margin-bottom: 12px; line-height: 1.6; }
    .training-notes-textarea {
      width: 100%; background: var(--navy2); border: 1px solid #1e3450;
      border-radius: 8px; padding: 12px 14px; color: var(--white);
      font-size: 14px; font-family: var(--font-body); line-height: 1.6;
      resize: vertical; min-height: 100px; margin-bottom: 10px; display: block;
    }
    .training-notes-textarea:focus { border-color: var(--blue); outline: none; }
    .training-note-saved { color: var(--green); font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 8px 0; }

    /* ─── RESPONSIVE ────────────────────────────────────────── */
    @media (max-width: 480px) {
      .login-box { padding: 28px 20px; }
      .dash-header { padding: 0 12px; height: 52px; }
      .dash-header-logo .logo-text { font-size: 14px; }
      .btn-icon .btn-label { display: none; }
      .client-nav { top: 52px; padding: 8px 10px; }
      .section-body { padding: 14px; }

function getTrainingStorageKey() {
  if (!clientData || !clientTrainingAssignment) return null;

  return [
    'ab_training_progress',
    clientData.id,
    clientTrainingAssignment.id,
    todayISO()
  ].join('_');
}

function loadTrainingProgressLocal() {
  const key = getTrainingStorageKey();
  if (!key) return null;

  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (error) {
    console.error('Error leyendo progreso local:', error);
    return null;
  }
}

function saveTrainingProgressLocal(extraData) {
  const key = getTrainingStorageKey();
  if (!key) return;

  const previous = loadTrainingProgressLocal() || {};

  const payload = {
    ...previous,
    completed_block_ids: Array.from(completedTrainingBlocks),
    is_finished: previous.is_finished || false,
    client_note: previous.client_note || '',
    updated_at: new Date().toISOString(),
    ...(extraData || {})
  };

  localStorage.setItem(key, JSON.stringify(payload));
}

/* ── UTILITY ─────────────────────────────────────────────── */
function normalizePhone(p) { return String(p).replace(/[\s\-\(\)\+]/g, ''); }
function openWA(msg)        { window.open(`https://wa.me/${normalizePhone(WA_NUMBER)}?text=${encodeURIComponent(msg)}`, '_blank'); }
function clientWA(text)     { openWA(`Hola Abel, soy ${clientData?.name || 'cliente'}. ${text}`); }

function todayISO() { return new Date().toISOString().slice(0, 10); }

function formatDate(d) {
  if (!d) return '—';
  try { const [y,m,day] = String(d).slice(0,10).split('-'); return `${day}/${m}/${y}`; } catch { return d; }
}
function formatTime(t)  { return t ? String(t).slice(0,5) : ''; }
function formatMoney(amount, currency) {
  if (amount == null) return '—';
  const cur = (currency || 'EUR').toUpperCase();
  try { return new Intl.NumberFormat('es-ES', { style:'currency', currency: cur }).format(amount); }
  catch { return `${amount} ${cur}`; }
}

function showError(msg) {
  const el = document.getElementById('loginError');

  if (!s) return '';

}

/* ── AUTH ────────────────────────────────────────────────── */
async function loginClient() {
  hideError();
  const phone = document.getElementById('inputPhone').value.trim();
  const code  = document.getElementById('inputCode').value.trim().toUpperCase();
  if (!phone || !code) { showError('Completa los dos campos.'); return; }

  showLoading(true);
  try {
    const { data: clients, error } = await db.from('clients').select('*');
    if (error) throw error;
    const found = (clients || []).find(c =>
      normalizePhone(c.phone) === normalizePhone(phone) &&
      (c.access_code || '').trim().toUpperCase() === code
    );
    if (!found) { showLoading(false); showError('Teléfono o código incorrecto.'); return; }
    localStorage.setItem(LS_CLIENT_ID, found.id);
    localStorage.setItem(LS_CLIENT_PHONE, normalizePhone(found.phone || phone));
    await loadClientDashboard(found.id);
  } catch (err) {
    showLoading(false);
    showError('Error: ' + (err.message || JSON.stringify(err)));
    console.error('Login error:', err);
  }
}

function logoutClient() {
  localStorage.removeItem(LS_CLIENT_ID);
  localStorage.removeItem(LS_CLIENT_PHONE);
  clientData = null; clientReservations = []; clientPayments = [];
  clientMetrics = []; clientAlerts = []; clientPrograms = [];
  clientTrainingAssignment = null; clientTrainingProgram = null;
  clientTrainingWeeks = []; clientTrainingSessions = [];
  clientTrainingBlocks = []; clientTrainingExercises = [];
  completedTrainingBlocks = new Set(); activeTrainingBlockKey = null;

  document.getElementById('dashboardScreen')?.classList.add('hidden');
  document.getElementById('loginScreen')?.classList.remove('hidden');
  document.getElementById('inputPhone').value = '';
  document.getElementById('inputCode').value  = '';
  hideError();
}

/* ── DATA LOADING ────────────────────────────────────────── */
async function loadClientDashboard(clientId) {
  showLoading(true);
  try {
    const { data: client, error: cErr } = await db.from('clients').select('*').eq('id', clientId).single();
    if (cErr || !client) {
      localStorage.removeItem(LS_CLIENT_ID);
      showLoading(false);
      document.getElementById('loginScreen')?.classList.remove('hidden');
      document.getElementById('dashboardScreen')?.classList.add('hidden');
      showError('Sesión expirada. Vuelve a iniciar sesión.');
      return;
    }
    clientData = client;

    const [resR, payR, metR, halR, proR, assignR] = await Promise.all([
      db.from('reservations').select('*').eq('client_id', clientId).order('date', { ascending: true }),
      db.from('payments').select('*').eq('client_id', clientId).order('due_date', { ascending: false }),
      db.from('metrics').select('*').eq('client_id', clientId).order('date', { ascending: false }),
      db.from('health_alerts').select('*').eq('client_id', clientId).order('date', { ascending: false }),
      db.from('programs').select('*').eq('client_id', clientId).order('created_at', { ascending: false }),
      db.from('client_program_assignments').select('*').eq('client_id', clientId).eq('status', 'activo').order('start_date', { ascending: false }).limit(1),
    ]);

    clientReservations       = resR.data    || [];
    clientPayments           = payR.data    || [];
    clientMetrics            = metR.data    || [];
    clientAlerts             = halR.data    || [];
    clientPrograms           = proR.data    || [];
    clientTrainingAssignment = assignR.data?.[0] || null;

    clientTrainingProgram = null; clientTrainingWeeks = [];
    clientTrainingSessions = []; clientTrainingBlocks = []; clientTrainingExercises = [];

    if (clientTrainingAssignment?.program_id) {
      const programId   = clientTrainingAssignment.program_id;
      const currentWeek = Number(clientTrainingAssignment.current_week || 1);

      const [programR, weeksR] = await Promise.all([
        db.from('training_programs').select('*').eq('id', programId).single(),
        db.from('training_weeks').select('*').eq('program_id', programId).order('week_number', { ascending: true }),
      ]);
      clientTrainingProgram = programR.data || null;
      clientTrainingWeeks   = weeksR.data   || [];

      const activeWeek = clientTrainingWeeks.find(w => Number(w.week_number) === currentWeek) || clientTrainingWeeks[0] || null;
      if (activeWeek) {
        const sessR = await db.from('training_sessions').select('*').eq('week_id', activeWeek.id).order('session_number', { ascending: true });
        clientTrainingSessions = sessR.data || [];
        const sessionIds = clientTrainingSessions.map(s => s.id);
        if (sessionIds.length) {
          const blocksR = await db.from('training_blocks').select('*').in('session_id', sessionIds).order('block_order', { ascending: true });
          clientTrainingBlocks = blocksR.data || [];
          const blockIds = clientTrainingBlocks.map(b => b.id);
          if (blockIds.length) {
            const exR = await db.from('training_exercises').select('*').in('block_id', blockIds).order('exercise_order', { ascending: true });
            clientTrainingExercises = exR.data || [];
          }
        }
      }
    }

    await renderDashboard();
    document.getElementById('loginScreen')?.classList.add('hidden');
    document.getElementById('dashboardScreen')?.classList.remove('hidden');
    showLoading(false);

  } catch (err) {
    showLoading(false);
    console.error('Load error:', err);
    if (!document.getElementById('loginScreen')?.classList.contains('hidden')) {
      showError('Error de conexión. Inténtalo de nuevo.');
    } else {
      alert('Error al cargar los datos. Comprueba tu conexión e inténtalo de nuevo.');
    }
  }
}

/* ════════════════════════════════════════════════════════════
   TRAINING GUIDE
════════════════════════════════════════════════════════════ */

/**
 * Builds a flat list of steps (one per block) from the loaded training data.
 * Each step carries a reference to its block, its exercises, and an optional
 * session-separator label (shown only for the first block of each session
 * when there are multiple sessions in the week).
 */
function buildTrainingSteps() {
  const steps = [];
  const multiSession = clientTrainingSessions.length > 1;

  clientTrainingSessions.forEach(function(session, sIdx) {
    const sessionBlocks = clientTrainingBlocks
      .filter(function(b) { return b.session_id === session.id; })
      .slice()
      .sort(function(a, b) { return Number(a.block_order || 0) - Number(b.block_order || 0); });

    sessionBlocks.forEach(function(block, bIdx) {
      const exercises = clientTrainingExercises
        .filter(function(e) { return e.block_id === block.id; })
        .slice()
        .sort(function(a, b) { return Number(a.exercise_order || 0) - Number(b.exercise_order || 0); });

      steps.push({
        blockId:          String(block.id),
        block:            block,
        exercises:        exercises,
        sessionSeparator: (multiSession && bIdx === 0)
          ? 'Sesión ' + (session.session_number || (sIdx + 1)) + (session.title ? ' · ' + session.title : '') + (session.duration ? ' · ' + session.duration : '')
          : null
      });
    });
  });

  return steps;
}

function getActiveTrainingWeek() {
  if (!clientTrainingAssignment) return null;

  var currentWeekNum = Number(clientTrainingAssignment.current_week || 1);

  return clientTrainingWeeks.find(function(w) {
    return Number(w.week_number) === currentWeekNum;
  }) || clientTrainingWeeks[0] || null;
}

async function loadOrCreateTrainingLog() {
  if (!clientData || !clientTrainingAssignment || !clientTrainingProgram) return null;

  const localProgress = loadTrainingProgressLocal();

  if (localProgress) {
    completedTrainingBlocks = new Set(localProgress.completed_block_ids || []);
    currentTrainingLog = {
      ...(currentTrainingLog || {}),
      ...localProgress
    };
  }

  var activeWeek = getActiveTrainingWeek();

  var payload = {
    client_id: clientData.id,
    assignment_id: clientTrainingAssignment.id,
    program_id: clientTrainingProgram.id,
    week_id: activeWeek ? activeWeek.id : null,
    training_date: todayISO()
  };

  try {
    var existing = await db
      .from('client_training_logs')
      .select('*')
      .eq('client_id', payload.client_id)
      .eq('assignment_id', payload.assignment_id)
      .eq('training_date', payload.training_date)
      .maybeSingle();

    if (existing.error) {
      console.error('Error cargando progreso desde Supabase:', existing.error);
      return currentTrainingLog;
    }

    if (existing.data) {
      const supabaseBlocks = existing.data.completed_block_ids || [];
      const localBlocks = localProgress?.completed_block_ids || [];

      completedTrainingBlocks = new Set([
        ...supabaseBlocks,
        ...localBlocks
      ]);

      currentTrainingLog = {
        ...existing.data,
        completed_block_ids: Array.from(completedTrainingBlocks),
        is_finished: existing.data.is_finished || localProgress?.is_finished || false,
        client_note: existing.data.client_note || localProgress?.client_note || ''
      };

      saveTrainingProgressLocal(currentTrainingLog);

      return currentTrainingLog;
    }

    var created = await db
      .from('client_training_logs')
      .insert({
        ...payload,
        completed_block_ids: Array.from(completedTrainingBlocks),
        is_finished: localProgress?.is_finished || false,
        client_note: localProgress?.client_note || '',
        started_at: new Date().toISOString()
      })
      .select()
      .single();

    if (created.error) {
      console.error('Error creando progreso en Supabase:', created.error);
      return currentTrainingLog;
    }

    currentTrainingLog = created.data;
    saveTrainingProgressLocal(currentTrainingLog);

    return currentTrainingLog;

  } catch (error) {
    console.error('Error general cargando progreso:', error);
    return currentTrainingLog;
  }
}

async function saveTrainingProgress(extraData) {
  saveTrainingProgressLocal(extraData);

  if (!currentTrainingLog || !currentTrainingLog.id) {
    await loadOrCreateTrainingLog();
  }

  if (!currentTrainingLog || !currentTrainingLog.id) {
    console.warn('No hay currentTrainingLog con id. Progreso guardado solo localmente.');
    return;
  }

  const localProgress = loadTrainingProgressLocal() || {};

  var payload = {
    completed_block_ids: Array.from(completedTrainingBlocks),
    is_finished: localProgress.is_finished || false,
    client_note: localProgress.client_note || null,
    updated_at: new Date().toISOString(),
    ...(extraData || {})
  };

  try {
    var saved = await db
      .from('client_training_logs')
      .update(payload)
      .eq('id', currentTrainingLog.id)
      .select()
      .single();

    if (saved.error) {
      console.error('Error guardando progreso en Supabase:', saved.error);
      return;
    }

    currentTrainingLog = saved.data;
    saveTrainingProgressLocal(currentTrainingLog);

  } catch (error) {
    console.error('Error general guardando progreso:', error);
  }
}

/** Renders the full training guide into sectionTrainingClient */
async function renderClientTraining() {
  const el    = document.getElementById('sectionTrainingClient');
  const badge = document.getElementById('trainingClientBadge');
  if (!el) return;

  completedTrainingBlocks = new Set();
  activeTrainingBlockKey  = null;
  currentTrainingLog      = null;

  if (!clientTrainingAssignment || !clientTrainingProgram) {
    if (badge) badge.textContent = 'Sin asignar';
    el.innerHTML = '<p class="empty-state">Todavía no tienes un programa de entrenamiento asignado. Cuando Abel active tu plan, aparecerá aquí.</p>';
    return;
  }

  await loadOrCreateTrainingLog();

  const currentWeekNum = Number(clientTrainingAssignment.current_week || 1);
  const activeWeek     = getActiveTrainingWeek();

  if (badge) badge.textContent = 'Semana ' + currentWeekNum;

  const levelStr = clientTrainingAssignment.assigned_level || clientTrainingProgram.level || '';
  const weekName = activeWeek ? activeWeek.name : '';

  const metaParts = [
    'Semana ' + currentWeekNum + (weekName ? ' · ' + weekName : ''),
    levelStr
  ].filter(Boolean);

  const objective = (activeWeek && activeWeek.objective)
    ? activeWeek.objective
    : (clientTrainingProgram.objective || '');

  let html = '<div class="training-guide-summary">'
    + '<div class="training-guide-title">' + (clientTrainingProgram.name || 'Programa de entrenamiento') + '</div>'
    + '<div class="training-guide-meta">' + metaParts.join(' · ') + '</div>'
    + (objective ? '<div class="training-week-objective">' + objective + '</div>' : '')
    + '</div>';

  const steps = buildTrainingSteps();

  if (!steps.length) {
    html += '<p class="empty-state">Este programa todavía no tiene bloques cargados.</p>';
    el.innerHTML = html;
    return;
  }

  html += '<div class="training-step-list" id="trainingStepList">';
  steps.forEach(function(step, index) {
    html += buildTrainingStepHTML(step, index);
  });
  html += '</div>';
  html += '<div id="trainingCompletionArea"></div>';

  el.innerHTML = html;

  applySavedTrainingState();

  if (currentTrainingLog && currentTrainingLog.is_finished) {
    renderTrainingCompletedState();
    return;
  }

  const firstPending = steps.find(function(step) {
    return !completedTrainingBlocks.has(step.blockId);
  });

  if (firstPending) {
    activeTrainingBlockKey = firstPending.blockId;
    var card = document.getElementById('step-' + firstPending.blockId);
    if (card) card.classList.add('open');
  } else {
    renderTrainingCompletionBox(false);
  }
}

/** Returns the HTML string for one training step card */
function buildTrainingStepHTML(step, index) {
  var blockId   = step.blockId;
  var block     = step.block;
  var exercises = step.exercises;
  var blockNum  = block.block_order || (index + 1);

  var metaParts = [block.duration, block.type].filter(Boolean);

  var html = '';

  /* Session separator */
  if (step.sessionSeparator) {
    html += '<div class="training-session-separator">' + step.sessionSeparator + '</div>';
  }

  html += '<div class="training-step-card" id="step-' + blockId + '">'
    /* Header */
    + '<button class="training-step-header" onclick="toggleTrainingStep(\'' + blockId + '\')">'
    +   '<div class="training-step-number">' + blockNum + '</div>'
    +   '<div class="training-step-info">'
    +     '<div class="training-step-title">' + (block.title || block.name || 'Bloque') + '</div>'
    +     (metaParts.length ? '<div class="training-step-meta">' + metaParts.join(' · ') + '</div>' : '')
    +   '</div>'
    +   '<div class="training-step-status" id="status-' + blockId + '">Pendiente</div>'
    + '</button>'
    /* Body */
    + '<div class="training-step-body">'
    + (block.objective ? '<div class="training-step-objective">' + block.objective + '</div>' : '');

  /* Exercises */
  exercises.forEach(function(ex) {
    html += buildExerciseHTML(ex);
  });

  if (!exercises.length) {
    html += '<p class="empty-state" style="margin-top:12px;">Este bloque todavía no tiene ejercicios registrados.</p>';
  }

  /* Complete button */
  html += '<button class="training-complete-block-btn" id="completeBtn-' + blockId + '" onclick="completeTrainingStep(\'' + blockId + '\')">'
    +   'Marcar bloque terminado'
    + '</button>'
    + '</div>'
    + '</div>';

  return html;
}

function applySavedTrainingState() {
  completedTrainingBlocks.forEach(function(blockId) {
    markStepVisualAsCompleted(blockId);
  });
}

function markStepVisualAsCompleted(blockId) {
  var card = document.getElementById('step-' + blockId);
  if (!card) return;

  card.classList.remove('open');
  card.classList.add('completed');

  var numEl = card.querySelector('.training-step-number');
  if (numEl) numEl.textContent = '✓';

  var statusEl = document.getElementById('status-' + blockId);
  if (statusEl) {
    statusEl.textContent = 'Completado';
    statusEl.classList.add('done');
  }

  var btn = document.getElementById('completeBtn-' + blockId);
  if (btn) {
    var doneMsg = document.createElement('div');
    doneMsg.className = 'training-step-done-msg';
    doneMsg.textContent = '✓ Bloque completado';
    btn.replaceWith(doneMsg);
  }
}

/** Returns the HTML string for one exercise */
function buildExerciseHTML(ex) {
  var stats = [
    ex.sets ? { label: 'Series',   value: ex.sets } : null,
    ex.reps ? { label: 'Reps',     value: ex.reps } : null,
    ex.time ? { label: 'Tiempo',   value: ex.time } : null,
    ex.rest ? { label: 'Descanso', value: ex.rest } : null
  ].filter(Boolean);

  var html = '<div class="training-exercise-card">'
    + '<div class="training-exercise-title">'
    + (ex.exercise_order ? '<span class="training-ex-num">' + ex.exercise_order + '.</span>' : '')
    + (ex.name || ex.title || 'Ejercicio')
    + '</div>';

  if (stats.length) {
    html += '<div class="training-exercise-grid">';
    stats.forEach(function(s) {
      html += '<div class="training-mini-stat">'
        + '<span class="training-mini-label">' + s.label + '</span>'
        + '<div class="training-mini-value">' + s.value + '</div>'
        + '</div>';
    });
    html += '</div>';
  }

  if (ex.level)       html += '<div class="training-level-tag">Variante: ' + ex.level + '</div>';
  if (ex.description) html += '<div class="training-instruction"><strong>Cómo hacerlo</strong>' + ex.description + '</div>';
  if (ex.coach_notes) html += '<div class="training-coach-note">Coach: ' + ex.coach_notes + '</div>';
  if (ex.video_url)   html += '<a href="' + ex.video_url + '" target="_blank" class="training-video-btn">&#9654; Ver referencia</a>';

  html += '</div>';
  return html;
}

/** Toggle open/close a step. Only one step open at a time. */
function toggleTrainingStep(blockId) {
  var card = document.getElementById('step-' + blockId);
  if (!card) return;

  if (activeTrainingBlockKey === blockId) {
    /* Close */
    card.classList.remove('open');
    activeTrainingBlockKey = null;
  } else {
    /* Close previous */
    if (activeTrainingBlockKey) {
      var prev = document.getElementById('step-' + activeTrainingBlockKey);
      if (prev) prev.classList.remove('open');
    }
    /* Open this */
    activeTrainingBlockKey = blockId;
    card.classList.add('open');
  }
}

/** Marks a step as completed, closes it and opens the next pending step. */
async function completeTrainingStep(blockId) {
  completedTrainingBlocks.add(blockId);

  saveTrainingProgressLocal();

  markStepVisualAsCompleted(blockId);

  await saveTrainingProgress();

  activeTrainingBlockKey = null;

  if (isTrainingComplete()) {
    renderTrainingCompletionBox(false);
    return;
  }

  var steps = buildTrainingSteps();
  var nextStep = null;

  for (var i = 0; i < steps.length; i++) {
    if (!completedTrainingBlocks.has(steps[i].blockId)) {
      nextStep = steps[i];
      break;
    }
  }

  if (nextStep) {
    activeTrainingBlockKey = nextStep.blockId;
    var nextCard = document.getElementById('step-' + nextStep.blockId);
    if (nextCard) {
      nextCard.classList.add('open');
      setTimeout(function() {
        nextCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 180);
    }
  }
}

/** Returns true when every step has been completed. */
function isTrainingComplete() {
  var steps = buildTrainingSteps();
  if (!steps.length) return false;
  return steps.every(function(s) { return completedTrainingBlocks.has(s.blockId); });
}

    btn.disabled = true;
    btn.textContent = 'Guardando...';

    client_note: note

  });

 if (saved) saved.classList.remove('hidden');

if (btn) {

renderTrainingCompletedState();
}

function renderNotes() {
  var el = document.getElementById('sectionNotes');

  var raw = clientData.notes;
  if (!raw || raw === '' || raw === '[]' || raw === 'null') {
    el.innerHTML = '<p class="empty-state">Todavía no hay notas del coach.</p>'; return;
  }
  var notes = [];
  if (Array.isArray(raw)) { notes = raw; }
  else if (typeof raw === 'string') {
    try { var p = JSON.parse(raw); notes = Array.isArray(p) ? p : [raw]; } catch { notes = [raw]; }
  }
  notes = notes.map(function(n) {
    if (typeof n === 'string') return n.trim();
    if (typeof n === 'object' && n) return String(n.text || n.note || n.message || '').trim();
    return '';
  }).filter(Boolean);
  el.innerHTML = notes.length
    ? notes.map(function(n) { return '<div class="note-item">' + n + '</div>'; }).join('')
    : '<p class="empty-state">Todavía no hay notas del coach.</p>';
}

function renderProgressCircles() {
  var el    = document.getElementById('sectionProgressCircles');
  var badge = document.getElementById('progressCircleBadge');
  if (!el) return;
  if (!clientMetrics.length) {
    if (badge) badge.textContent = '0';
    el.innerHTML = '<p class="empty-state">Todavía no hay métricas suficientes para mostrar progreso visual.</p>';
    return;
  }

  var grouped = {};
  clientMetrics.forEach(function(m) {
    var key = String(m.type || 'Métrica').trim();
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push({ value: m.value, unit: m.unit, note: m.note, numericValue: Number(m.value||0), dateKey: String(m.date||'').slice(0,10) });
  });

  var circles = Object.keys(grouped).map(function(type) {
    var list = grouped[type].slice().sort(function(a,b) { return String(b.dateKey).localeCompare(String(a.dateKey)); });
    var latest = list[0], first = list[list.length-1];
    var current = Number(latest.numericValue||0), start = Number(first.numericValue||0);
    var percent = 0, note = '';
    var t = type.toLowerCase();

    if (t.includes('peso')) {
      var diff = start - current;
      percent = Math.round(Math.min(100, Math.max(0, (diff / Math.max(Math.abs(start*.05),1)) * 100)));
      note = diff > 0 ? 'Bajó ' + Math.abs(diff).toFixed(1) + ' ' + (latest.unit||'kg')
           : diff < 0 ? 'Subió ' + Math.abs(diff).toFixed(1) + ' ' + (latest.unit||'kg')
           : 'Sin cambio todavía';
    } else if (t.includes('asistencia')||t.includes('adherencia')||t.includes('%')) {
      percent = Math.round(Math.min(100, Math.max(0, current))); note = percent + '% registrado';
    } else if (['fuerza','movilidad','resistencia','energía','dolor','sueño'].some(function(k){ return t.includes(k); })) {
      percent = Math.round(Math.min(100, Math.max(0, (current/10)*100))); note = current + '/10';
    } else {
      if (start > 0) {
        var d2 = current - start;
        percent = Math.round(Math.min(100, Math.max(0, (current/start)*100)));
        note = d2 >= 0 ? '+' + d2.toFixed(1) + ' desde inicio' : d2.toFixed(1) + ' desde inicio';
      } else {
        percent = Math.round(Math.min(100, Math.max(0, current))); note = 'Último registro';
      }
    }
    return { type: type, current: current, unit: latest.unit||'', percent: percent, note: note };
  });

  if (badge) badge.textContent = circles.length;
  el.innerHTML = '<div class="progress-grid">'
    + circles.map(function(c) {
        return '<div class="progress-circle-card">'
          + '<div class="progress-ring" style="--p:' + c.percent + '"><span>' + c.percent + '%</span></div>'
          + '<div class="progress-circle-label">' + c.type + '</div>'
          + '<div class="progress-circle-value">' + c.current + (c.unit ? ' ' + c.unit : '') + '</div>'
          + '<div class="progress-circle-note">' + c.note + '</div>'
          + '</div>';
      }).join('')
    + '</div>';
}

function renderClientData() {

  var badge = document.getElementById('clientDataBadge');
  if (!el || !clientData) return;

  var totalRes     = clientReservations.length;
  var completedRes = clientReservations.filter(function(r) { return ['realizada','completada','confirmada'].includes((r.status||'').toLowerCase()); }).length;
  var pendingPay   = clientPayments.filter(function(p) { return ['pendiente','vencido'].includes((p.status||'').toLowerCase()); }).length;

    + '<button class="accordion-title" onclick="toggleAccordion(this)">'

    +     '<div class="plan-item"><div class="pi-label">Teléfono</div><div class="pi-value">' + (clientData.phone||'—') + '</div></div>'
    +     '<div class="plan-item"><div class="pi-label">Email</div><div class="pi-value">'    + (clientData.email||'—') + '</div></div>'
    +     '<div class="plan-item"><div class="pi-label">Ciudad</div><div class="pi-value">'   + (clientData.city ||'—') + '</div></div>'
    +   '</div>'
    + '</div>'
    + '</div>'
    + '<div class="accordion-block">'
    + '<button class="accordion-title" onclick="toggleAccordion(this)">'
    +   '<span>Entrenamiento</span><span class="accordion-symbol">+</span>'
    + '</button>'
    + '<div class="accordion-content">'
    +   '<div class="plan-grid" style="margin-top:12px;">'
    +     '<div class="plan-item"><div class="pi-label">Estado</div><div class="pi-value">' + (clientData.status||'—') + '</div></div>'
    +     '<div class="plan-item"><div class="pi-label">Plan</div><div class="pi-value">'   + (clientData.plan||'—')   + '</div></div>'
    +     '<div class="plan-item full"><div class="pi-label">Objetivo principal</div><div class="pi-value">' + (clientData.objective||'Sin objetivo registrado') + '</div></div>'
    +     '<div class="plan-item full"><div class="pi-label">Objetivo nutricional</div><div class="pi-value">' + (clientData.nutrition_objective||'Sin objetivo nutricional registrado') + '</div></div>'
    +   '</div>'
    + '</div>'
    + '</div>'
    + '<div class="accordion-block">'
    + '<button class="accordion-title" onclick="toggleAccordion(this)">'
    +   '<span>Resumen del proceso</span><span class="accordion-symbol">+</span>'
    + '</button>'
    + '<div class="accordion-content">'
    +   '<div class="plan-grid" style="margin-top:12px;">'
    +     '<div class="plan-item"><div class="pi-label">Reservas registradas</div><div class="pi-value">' + totalRes     + '</div></div>'
    +     '<div class="plan-item"><div class="pi-label">Sesiones realizadas</div><div class="pi-value">'  + completedRes + '</div></div>'
    +     '<div class="plan-item"><div class="pi-label">Pagos pendientes</div><div class="pi-value">'     + pendingPay   + '</div></div>'
    +     '<div class="plan-item"><div class="pi-label">Última métrica</div><div class="pi-value">'
    +       (lastMetric ? (lastMetric.type||'Métrica') + ': ' + lastMetric.value + (lastMetric.unit ? ' ' + lastMetric.unit : '') : 'Sin métricas registradas')
    +     '</div></div>'
    +   '</div>'
    + '</div>'
    + '</div>';
}

/* ── NAVIGATION ──────────────────────────────────────────── */
function goClientSection(sectionId) {
  document.querySelectorAll('.dash-main .section').forEach(function(s) { s.classList.add('section-hidden'); });
  var target = document.getElementById(sectionId);
  if (!target) return;
  target.classList.remove('section-hidden');

  document.querySelectorAll('.client-nav button').forEach(function(b) { b.classList.remove('active'); });
  var activeBtn = Array.from(document.querySelectorAll('.client-nav button'))
    .find(function(b) { return b.getAttribute('onclick')?.includes(sectionId); });
  if (activeBtn) {
    activeBtn.classList.add('active');
    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleAccordion(button) {
  var block = button.closest('.accordion-block');
  if (!block) return;
  var symbol = block.querySelector('.accordion-symbol');
  var isOpen = block.classList.contains('open');
  block.classList.toggle('open', !isOpen);
  if (symbol) symbol.textContent = isOpen ? '+' : '−';
}

/* ── EVENTS ──────────────────────────────────────────────── */
document.getElementById('btnLogin') ?.addEventListener('click', loginClient);
document.getElementById('btnLogout')?.addEventListener('click', logoutClient);
['inputPhone','inputCode'].forEach(function(id) {
  document.getElementById(id)?.addEventListener('keydown', function(e) { if (e.key === 'Enter') loginClient(); });
});

/* ── INIT ────────────────────────────────────────────────── */
(async function init() {
  var savedId = localStorage.getItem(LS_CLIENT_ID);
  if (savedId) {
    document.getElementById('loginScreen')?.classList.add('hidden');
    await loadClientDashboard(savedId);
  }
})();
</script>
