<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AB SYSTEM — Nueva contraseña</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #f4f4f2;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #101214;
      border: 1px solid rgba(0,200,232,.35);
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 0 40px rgba(0,200,232,.12);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      letter-spacing: .04em;
    }
    p {
      color: #9ca3af;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 14px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #2b3035;
      background: #050607;
      color: #fff;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: #00c8e8;
      color: #000;
      font-weight: 800;
      letter-spacing: .06em;
      cursor: pointer;
    }
    .msg {
      margin-top: 16px;
      font-size: 14px;
      color: #9ca3af;
    }
    .ok { color: #22c55e; }
    .err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AB SYSTEM</h1>
    <p>Introduce tu nueva contraseña para recuperar el acceso al panel.</p>

    <label for="password">Nueva contraseña</label>
    <input id="password" type="password" placeholder="Nueva contraseña" autocomplete="new-password" />

    <label for="confirm">Confirmar contraseña</label>
    <input id="confirm" type="password" placeholder="Repetir contraseña" autocomplete="new-password" />

    <button id="btn">ACTUALIZAR CONTRASEÑA</button>

    <div id="msg" class="msg">Esperando enlace de recuperación...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "TU_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "TU_SUPABASE_ANON_KEY";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        msg.textContent = "Enlace validado. Ya puedes cambiar la contraseña.";
        msg.className = "msg ok";
      }
    });

    btn.addEventListener("click", async () => {
      const password = document.getElementById("password").value.trim();
      const confirm = document.getElementById("confirm").value.trim();

      if (!password || password.length < 8) {
        msg.textContent = "La contraseña debe tener al menos 8 caracteres.";
        msg.className = "msg err";
        return;
      }

      if (password !== confirm) {
        msg.textContent = "Las contraseñas no coinciden.";
        msg.className = "msg err";
        return;
      }

      btn.disabled = true;
      btn.textContent = "ACTUALIZANDO...";

      const { error } = await supabase.auth.updateUser({
        password
      });

      if (error) {
        msg.textContent = "Error: " + error.message;
        msg.className = "msg err";
        btn.disabled = false;
        btn.textContent = "ACTUALIZAR CONTRASEÑA";
        return;
      }

      msg.textContent = "Contraseña actualizada correctamente. Redirigiendo al admin...";
      msg.className = "msg ok";

      setTimeout(() => {
        window.location.href = "/admin";
      }, 1200);
    });
  </script>
</body>
</html>
