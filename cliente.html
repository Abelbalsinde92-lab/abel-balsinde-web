    .filter(c=>c.event_date<today)
    .sort((a,b)=>b.event_date.localeCompare(a.event_date));

  const activeInjuries=clientInjuryHistory.filter(i=>!i.recovery_date||i.recovery_date>=today);
  const recentLoads=clientSessionLoadHistory.slice(0,4);

  if(badge) badge.textContent=ap.sport||'—';

  /* ─── PANEL 1: RESUMEN ─────────────────────────────── */
  let resumenHTML='';

  resumenHTML+=
    '<div class="data-card next-session">'+
      '<div class="next-label">'+(ap.sport||'Atleta combate')+'</div>'+
      '<div class="dc-row">'+
        '<span class="dc-title">'+escHTML(clientData.name||'')+'</span>'+
        '<span class="badge badge-blue">'+escHTML(ap.weight_class||'—')+'</span>'+
      '</div>'+
      '<div class="dc-row">'+
        '<span class="dc-sub">'+escHTML(ap.competitive_level||'—')+'</span>'+
        '<span class="dc-sub" style="font-family:var(--font-mono);font-weight:700;color:var(--text-primary);">'+record+'</span>'+
      '</div>'+
      '<div class="summary-grid" style="margin:10px 0 0">'+
        (ap.height_cm?'<div class="summary-card"><div class="summary-label">Altura</div><div class="summary-value">'+ap.height_cm+' cm</div></div>':'')+
        (ap.walk_around_weight_kg?'<div class="summary-card"><div class="summary-label">Peso habitual</div><div class="summary-value">'+ap.walk_around_weight_kg+' kg</div></div>':'')+
        (ap.team?'<div class="summary-card full"><div class="summary-label">Equipo</div><div class="summary-value">'+escHTML(ap.team)+'</div></div>':'')+
      '</div>'+
    '</div>';

  if(activePhase){
    const dLeft=activePhase.end_date?daysBetweenISO(today,activePhase.end_date):null;
    resumenHTML+=
      '<div class="data-card" style="border-color:rgba(0,229,255,.25)">'+
        '<div class="next-label">Fase activa</div>'+
        '<div class="dc-row">'+
          '<span class="dc-title">'+escHTML(activePhase.phase_name||activePhase.phase_type||'Fase')+'</span>'+
          '<span class="badge badge-blue">'+escHTML(activePhase.phase_type||'—')+'</span>'+
        '</div>'+
        (activePhase.priority_capacity?'<div class="dc-row"><span class="dc-sub">Prioridad: '+escHTML(activePhase.priority_capacity)+'</span></div>':'')+
        (activePhase.intensity_target?'<div class="dc-row"><span class="dc-sub">Intensidad objetivo: '+activePhase.intensity_target+'/10</span></div>':'')+
        (dLeft!==null?'<div class="dc-note">'+dLeft+' días restantes · hasta '+formatDate(activePhase.end_date)+'</div>':'')+
      '</div>';
  }

  if(nextComp){
    const dComp=daysBetweenISO(today,nextComp.event_date);
    const urgColor=dComp<=3?'var(--medical)':dComp<=14?'var(--warn)':dComp<=30?'var(--sport)':'var(--streak)';
    resumenHTML+=
      '<div class="data-card" style="border-color:rgba(255,179,64,.3)">'+
        '<div class="next-label">Próxima competición</div>'+
        '<div class="dc-row">'+
          '<span class="dc-title">'+escHTML(nextComp.event_name||'Competición')+'</span>'+
          '<span style="font-family:var(--font-display);font-size:24px;color:'+urgColor+'">'+dComp+
            '<span style="font-size:10px;font-family:var(--font-mono);margin-left:3px;opacity:.6"> días</span>'+
          '</span>'+
        '</div>'+
        '<div class="dc-row">'+
          '<span class="dc-sub">'+formatDate(nextComp.event_date)+(nextComp.opponent?' · vs '+escHTML(nextComp.opponent):'')+'</span>'+
          (nextComp.weight_class?'<span class="dc-sub">'+escHTML(nextComp.weight_class)+'</span>':'')+
        '</div>'+
        (nextComp.location?'<div class="dc-note">'+escHTML(nextComp.location)+'</div>':'')+
        (nextComp.attending===false
          ? '<div style="margin-top:10px;"><span class="comp-skip-badge">No asistiré</span></div>'+
            (nextComp.skip_reason?'<div class="dc-note">Motivo: '+escHTML(nextComp.skip_reason)+'</div>':'')+
            '<button class="comp-skip-btn" style="border-color:rgba(0,229,255,.2);color:var(--sport);margin-top:6px;" onclick="restoreCompetition(\''+nextComp.id+'\')">↩ Restaurar</button>'
          : '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">'+
              '<button class="comp-skip-btn" onclick="skipCompetition(\''+nextComp.id+'\')">✕ No asistiré</button>'+
              '<button class="comp-skip-btn" style="border-color:rgba(0,229,255,.2);color:var(--sport);" onclick="showAtletaTab(\'comps\')">Ver todas →</button>'+
            '</div>'
        )+
      '</div>';
  }

  if(activeInjuries.length){
    resumenHTML+='<div style="margin:14px 0 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--medical);">Lesiones activas · '+activeInjuries.length+'</div>';
    resumenHTML+=activeInjuries.map(i=>{
      const col=i.severity==='alta'?'medical':i.severity==='media'?'warn':'streak';
      const bcol=i.severity==='alta'?'red':i.severity==='media'?'yellow':'green';
      return '<div class="data-card" style="border-left:3px solid var(--'+col+');margin-bottom:8px;">'+
        '<div class="dc-row"><span class="dc-title" style="font-size:14px;">'+escHTML(i.body_part||'—')+'</span>'+
        '<span class="badge badge-'+bcol+'">'+escHTML(i.severity||'—')+'</span></div>'+
        '<div class="dc-row"><span class="dc-sub">'+escHTML(i.injury_type||'—')+' · '+escHTML(i.training_impact||'—')+'</span></div>'+
        (i.notes?'<div class="dc-note">'+escHTML(i.notes)+'</div>':'')+
      '</div>';
    }).join('');
  }

  if(!ap.sport&&!nextComp&&!activePhase&&!recentLoads.length){
    resumenHTML+=
      '<div class="data-card">'+
        '<div class="dc-row"><span class="dc-title">Perfil atleta pendiente</span>'+
        '<span class="badge badge-yellow">Por completar</span></div>'+
        '<div class="dc-note">Contacta con Abel para completar tu perfil deportivo.</div>'+
      '</div>';
  }

  /* ─── PANEL 2: COMPETICIONES (Timeline) ────────────── */
  let compsHTML='';

  if(!futureComps.length&&!pastComps.length){
    compsHTML='<div class="data-card"><div class="dc-note">No hay competiciones registradas en el calendario todavía.</div></div>';
  } else {

    if(futureComps.length){
      compsHTML+='<div style="margin:0 0 12px;font-family:var(--font-mono);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-secondary);">Próximas · '+futureComps.length+'</div>';
      compsHTML+='<div class="comp-timeline">';

      futureComps.forEach(comp=>{
        const dComp=daysBetweenISO(today,comp.event_date);
        const urgColor=dComp<=3?'var(--medical)':dComp<=14?'var(--warn)':dComp<=30?'var(--sport)':'var(--streak)';
        const isSkipped=comp.attending===false;

        compsHTML+=
          '<div class="comp-tl-item">'+
            '<div class="comp-tl-dot" style="background:'+( isSkipped?'var(--divider)':urgColor)+';border-color:'+( isSkipped?'var(--card-border)':urgColor)+'"></div>'+
            '<div class="comp-tl-card" style="border-color:'+( isSkipped?'var(--card-border)':'rgba(255,179,64,.2)')+';opacity:'+(isSkipped?'.5':'1')+'">'+
              '<div class="dc-row">'+
                '<span class="dc-title" style="font-size:15px;">'+escHTML(comp.event_name||'Competición')+'</span>'+
                (isSkipped
                  ? '<span class="comp-skip-badge">No asistiré</span>'
                  : '<span style="font-family:var(--font-display);font-size:22px;color:'+urgColor+'">'+dComp+
                      '<span style="font-size:9px;font-family:var(--font-mono);opacity:.6;margin-left:2px">d</span></span>'
                )+
              '</div>'+
              '<div class="dc-row" style="margin-bottom:6px;">'+
                '<span class="dc-sub">'+formatDate(comp.event_date)+(comp.opponent?' · vs '+escHTML(comp.opponent):'')+'</span>'+
                (comp.weight_class?'<span class="dc-sub">'+escHTML(comp.weight_class)+'</span>':'')+
              '</div>'+
              (comp.location?'<div class="dc-note" style="margin-bottom:8px;">'+escHTML(comp.location)+'</div>':'')+
              (isSkipped&&comp.skip_reason?'<div class="dc-note" style="margin-bottom:8px;">Motivo: '+escHTML(comp.skip_reason)+'</div>':'')+
              (isSkipped
                ? '<button class="comp-skip-btn" style="border-color:rgba(0,229,255,.2);color:var(--sport);" onclick="restoreCompetition(\''+comp.id+'\')">↩ Restaurar al calendario</button>'
                : '<button class="comp-skip-btn" onclick="skipCompetition(\''+comp.id+'\')">✕ No asistiré a esta competición</button>'
              )+
            '</div>'+
          '</div>';
      });

      compsHTML+='</div>';
    }

    if(pastComps.length){
      compsHTML+='<div style="margin:20px 0 12px;font-family:var(--font-mono);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-secondary);">Historial · '+pastComps.length+'</div>';
      compsHTML+=pastComps.map(c=>{
        const bc=c.result==='victoria'?'green':c.result==='derrota'?'red':'gray';
        const isSkipped=c.attending===false;
        return '<div class="data-card" style="margin-bottom:8px;">'+
          '<div class="dc-row">'+
            '<span class="dc-title" style="font-size:14px;">'+escHTML(c.event_name||'Competición')+'</span>'+
            (isSkipped
              ? '<span class="comp-skip-badge">No asistió</span>'
              : '<span class="badge badge-'+bc+'">'+escHTML(c.result||'—')+'</span>'
            )+
          '</div>'+
          (isSkipped&&c.skip_reason?'<div class="dc-note">Motivo: '+escHTML(c.skip_reason)+'</div>':'')+
          '<div class="dc-row">'+
            '<span class="dc-sub">'+formatDate(c.event_date)+(c.opponent?' · vs '+escHTML(c.opponent):'')+'</span>'+
            (c.method?'<span class="dc-sub">'+escHTML(c.method)+'</span>':'')+
          '</div>'+
          (isSkipped
            ? '<button class="comp-skip-btn" style="border-color:rgba(0,229,255,.2);color:var(--sport);margin-top:8px;" onclick="restoreCompetition(\''+c.id+'\')">↩ Restaurar al calendario</button>'
            : ''
          )+
        '</div>';
      }).join('');
    }
  }

  /* ─── PANEL 3: CARGA ───────────────────────────────── */
  let cargaHTML='';

  if(recentLoads.length){
    cargaHTML+='<div style="margin:0 0 12px;font-family:var(--font-mono);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-secondary);">Carga reciente</div>';
    cargaHTML+='<div class="summary-grid">';
    recentLoads.forEach(sl=>{
      const ac=sl.ac_ratio?Number(sl.ac_ratio).toFixed(2):null;
      const acCol=!ac?'var(--text-secondary)':ac<0.8?'var(--sport)':ac<=1.3?'var(--streak)':'var(--medical)';
      cargaHTML+=
        '<div class="summary-card">'+
          '<div class="summary-label">'+formatDate(sl.session_date||String(sl.created_at||'').slice(0,10))+'</div>'+
          '<div class="summary-value" style="font-size:13px;">RPE '+(sl.rpe||'—')+' · '+(sl.duration_minutes||'—')+' min</div>'+
          (ac?'<div style="font-family:var(--font-mono);font-size:10px;color:'+acCol+';margin-top:4px;">AC '+ac+'</div>':'')+
        '</div>';
    });
    cargaHTML+='</div>';
  }

  if(clientCapacityEvaluations.length){
    cargaHTML+='<div style="margin:14px 0 12px;font-family:var(--font-mono);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-secondary);">Capacidades evaluadas</div>';
    cargaHTML+='<div class="summary-grid">';
    clientCapacityEvaluations.slice(0,6).forEach(ev=>{
      const chg=ev.change_pct?Number(ev.change_pct):null;
      const chgCol=!chg?'var(--text-secondary)':chg>0?'var(--streak)':'var(--medical)';
      cargaHTML+=
        '<div class="summary-card">'+
          '<div class="summary-label">'+escHTML(ev.capacity||ev.test_name||'—')+'</div>'+
          '<div class="summary-value">'+escHTML(String(ev.value||'—'))+(ev.unit?' '+escHTML(ev.unit):'')+'</div>'+
          (chg!==null?'<div style="font-family:var(--font-mono);font-size:10px;color:'+chgCol+';margin-top:4px;">'+(chg>0?'+':'')+chg+'%</div>':'')+
        '</div>';
    });
    cargaHTML+='</div>';
  }

  if(!recentLoads.length&&!clientCapacityEvaluations.length){
    cargaHTML='<div class="data-card"><div class="dc-note">No hay datos de carga o capacidades registrados todavía.</div></div>';
  }

  /* ─── ENSAMBLADO FINAL ─────────────────────────────── */
  const hasUrgentComp=futureComps.some(c=>daysBetweenISO(today,c.event_date)<=14&&c.attending!==false);

  let html=
    '<div class="health-tabs">'+
      '<button class="health-tab active" id="atletaTab1" onclick="showAtletaTab(\'resumen\')">'+
        'Resumen'+
      '</button>'+
      '<button class="health-tab" id="atletaTab2" onclick="showAtletaTab(\'comps\')">'+
        'Competiciones'+
        (futureComps.length?'<span class="health-tab-dot" style="background:'+(hasUrgentComp?'var(--warn)':'var(--sport)')+'"></span>':'')+
      '</button>'+
      '<button class="health-tab" id="atletaTab3" onclick="showAtletaTab(\'carga\')">'+
        'Carga'+
      '</button>'+
    '</div>'+
    '<div class="health-panel active" id="atleta-panel-resumen">'+resumenHTML+'</div>'+
    '<div class="health-panel" id="atleta-panel-comps">'+compsHTML+'</div>'+
    '<div class="health-panel" id="atleta-panel-carga">'+cargaHTML+'</div>';

  el.innerHTML=html;
}

function showAtletaTab(tab) {
  const tabs = ['resumen','comps','carga'];
  document.querySelectorAll('#sectionAtleta .health-tab').forEach((b,i)=>{
    b.classList.toggle('active', tabs[i]===tab);
  });
  tabs.forEach(t=>{
    const panel=document.getElementById('atleta-panel-'+t);
    if(panel) panel.classList.toggle('active', t===tab);
  });
}
</script>

</body>
</html>
