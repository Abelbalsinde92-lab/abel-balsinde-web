<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AB SYSTEM — Área Cliente</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="/manifest.json?v=20260522-01">
<link rel="icon" href="/favicon-32.png?v=20260522-01" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260522-01">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AB SYSTEM">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ═══════════════════════════════════════════════════════
   AB SYSTEM — DARK v2.1 + MÉTRICAS COMBATE
═══════════════════════════════════════════════════════ */

:root {
  --bg:          #000000;
  --card:        #121214;
  --card-border: #1F1F24;
  --divider:     #16161A;
  --text-primary:   #FFFFFF;
  --text-secondary: #8E8E93;
  --sport:   #00E5FF;
  --medical: #FF5A5A;
  --streak:  #00E676;
  --warn:    #FFB340;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body:    'Syne', sans-serif;
  --font-mono:    'DM Mono', monospace;
  --tab-indicator: var(--sport);
 --top-h: 68px;
--safe-t: env(safe-area-inset-top, 0px);
--bot-h: 62px;
--safe-b: env(safe-area-inset-bottom, 0px);
--r: 12px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; border: none; outline: none; font-family: var(--font-body); background: transparent; }
input, textarea { outline: none; font-family: var(--font-body); }
.hidden { display: none !important; }

/* ═══ LOADING ═══════════════════════════════════════ */
#loadingOverlay {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; z-index: 999;
}
.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--divider);
  border-top-color: var(--sport);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loadingOverlay p {
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
}

/* ═══ LOGIN ══════════════════════════════════════════ */
#loginScreen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px; background: var(--bg);
}
.login-box {
  width: 100%; max-width: 380px;
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 16px; padding: 40px 32px 36px;
}
.login-logo {
  display: flex; align-items: center;
  justify-content: center; margin-bottom: 32px;
}
.brand-logo { display: block; object-fit: contain; flex-shrink: 0; }
.brand-logo-login  { width: 56px; height: 56px; border-radius: 14px; }
.brand-logo-header { width: 36px; height: 36px; border-radius: 10px; }
.logo-badge, .logo-text { display: none !important; }
.login-title {
  font-family: var(--font-display);
  color: var(--text-primary); font-size: 28px;
  letter-spacing: 3px; margin-bottom: 4px; text-align: center;
}
.login-sub {
  font-size: 12px; color: var(--text-secondary);
  font-family: var(--font-mono); letter-spacing: 0.4px;
  margin-bottom: 32px; text-align: center;
}
.field-group { margin-bottom: 14px; }
.field-group label {
  display: block; font-size: 10px; font-family: var(--font-mono);
  letter-spacing: 1.4px; color: var(--text-secondary);
  text-transform: uppercase; margin-bottom: 8px;
}
.field-group input {
  width: 100%; background: var(--bg); border: 1px solid var(--card-border);
  border-radius: 8px; padding: 12px 14px;
  color: var(--text-primary); font-size: 15px; font-family: var(--font-body);
  transition: border-color .2s;
}
.field-group input:focus { border-color: var(--sport); }
.field-group input::placeholder { color: var(--text-secondary); opacity: .5; }
.btn-login {
  width: 100%; background: var(--text-primary); color: var(--bg);
  border-radius: 8px; padding: 13px;
  font-size: 13px; font-weight: 700; font-family: var(--font-mono);
  letter-spacing: 1.2px; text-transform: uppercase; margin-top: 4px;
  transition: opacity .2s, transform .1s;
}
.btn-login:hover { opacity: .9; }
.btn-login:active { transform: scale(.98); }
.btn-wa-login {
  width: 100%; background: transparent; border: 1px solid var(--card-border);
  color: var(--text-secondary); border-radius: 8px; padding: 11px;
  font-size: 12px; font-family: var(--font-mono); letter-spacing: 0.6px;
  margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: border-color .2s, color .2s;
}
.btn-wa-login:hover { border-color: var(--streak); color: var(--streak); }
.login-error {
  background: rgba(255,90,90,.08); border: 1px solid rgba(255,90,90,.3);
  color: var(--medical); border-radius: 8px; padding: 10px 14px;
  font-size: 12px; font-family: var(--font-mono); margin-bottom: 14px;
}
.login-info {
  background: rgba(0,229,255,.08); border: 1px solid rgba(0,229,255,.25);
  color: var(--sport); border-radius: 8px; padding: 10px 14px;
  font-size: 12px; font-family: var(--font-mono); margin-bottom: 14px;
}

/* ═══ HEADER ═════════════════════════════════════════ */

#dashboardScreen {
  min-height: 100vh;
}

.dash-header {
  height: 60px;
  padding: 0 20px;
  background: rgba(0,0,0,.96);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.dash-header-left {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
  flex-shrink: 0;
}

.brand-logo {
  display: block;
  object-fit: contain;
  flex-shrink: 0;
}

.brand-logo-login {
  width: 86px;
  height: auto;
  border-radius: 0;
  object-fit: contain;
}

.brand-logo-header {
  width: 52px;
  height: auto;
  border-radius: 0;
  object-fit: contain;
}

#headerAvatarSlot {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.client-avatar,
.client-avatar-initials {
  width: 44px;
  height: 44px;
  border-radius: 50%;
}

.client-avatar {
  object-fit: cover;
}

.client-avatar-initials {
  background: var(--sport);
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.dash-header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.btn-icon {
  width: 50px;
  height: 42px;
  padding: 0;
  border-radius: 10px;
  background: transparent;
  border: 1px solid var(--card-border);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0;
  line-height: 1;
  transition: border-color .2s, color .2s, background .2s;
}

.btn-wa-icon {
  color: var(--streak);
  border-color: rgba(0,230,118,.28);
}

.btn-wa-icon:hover {
  border-color: var(--streak);
  background: rgba(0,230,118,.06);
}

.btn-exit-icon:hover {
  color: var(--medical);
  border-color: rgba(255,90,90,.45);
  background: rgba(255,90,90,.06);
}

/* ═══ NAV ════════════════════════════════════════════ */

.client-nav {
  height: 56px;
  background: rgba(0,0,0,.95);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 70px;
  z-index: 90;
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.client-nav::-webkit-scrollbar {
  display: none;
}

.client-nav button {
  flex: 0 0 auto;
  min-width: max-content;
  background: transparent;
  color: var(--text-secondary);
  border: none;
  border-bottom: 3px solid transparent;
  padding: 16px 34px 13px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 1.7px;
  text-transform: uppercase;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
}

.client-nav button:hover {
  color: var(--text-primary);
}

.client-nav button.active {
  color: var(--text-primary);
  border-bottom-color: var(--tab-indicator);
}

@media (max-width: 480px) {
  .dash-header {
    height: 60px;
    padding: 0 20px;
  }

  .dash-header-left {
    gap: 16px;
  }

  .brand-logo-header {
    width: 38px;
    height: 38px;
  }

  .client-avatar,
  .client-avatar-initials {
    width: 44px;
    height: 44px;
  }

  .btn-icon {
    width: 50px;
    height: 42px;
  }

  .client-nav {
    top: 60px;
  }
}

/* ═══ LAYOUT ══════════════════════════════════════════ */
.dash-main {
  max-width: 720px; margin: 0 auto;
  padding: 20px 16px calc(120px + env(safe-area-inset-bottom));
}
.section { animation: fadein .16s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.section-hidden { display: none !important; }
.section-header {
  padding: 0 0 16px; display: flex;
  align-items: center; justify-content: space-between;
}
.section-header h2 {
  font-family: var(--font-display); color: var(--text-primary);
  font-size: 22px; letter-spacing: 3px;
}
.section-header .sec-badge {
  font-size: 10px; font-family: var(--font-mono);
  color: var(--text-secondary); letter-spacing: 0.6px;
}
.empty-state {
  color: var(--text-secondary); font-size: 13px;
  font-family: var(--font-mono); letter-spacing: 0.3px; line-height: 1.8;
}

/* ═══ CARD BASE ════════════════════════════════════════ */
.data-card, .summary-card, .progress-circle-card, .assessment-card, .accordion-block {
  background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
}
.data-card { padding: 18px; margin-bottom: 10px; }
.data-card:last-child { margin-bottom: 0; }
.data-card.next-session { border-color: rgba(0,229,255,.25); }
.data-card .dc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 4px; }
.data-card .dc-title {
  font-weight: 800;
  font-size: 17px;
  line-height: 1.3;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}
.data-card .dc-sub { font-size: 12px; color: var(--text-secondary); font-family: var(--font-mono); }
.data-card .dc-note { margin-top: 8px; font-size: 13px; color: var(--text-secondary); font-style: italic; }
.next-label {
  font-size: 10px; font-family: var(--font-mono);
  letter-spacing: 1.6px; text-transform: uppercase;
  font-weight: 500; color: var(--sport); margin-bottom: 10px;
}

/* ═══ BOTONES ══════════════════════════════════════════ */
.action-box { margin-top: 16px; display: grid; gap: 8px; }
.client-action-btn, .copy-summary-btn {
  width: 100%; min-height: 46px;
  background: var(--text-primary); border: none; color: var(--bg);
  border-radius: 8px; padding: 12px 16px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 1.2px; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity .15s, transform .1s;
}
.client-action-btn:hover, .copy-summary-btn:hover { opacity: .88; }
.client-action-btn:active { transform: scale(.98); }
.client-action-btn.wa {
  background: transparent; border: 1px solid rgba(0,230,118,.25); color: var(--streak);
}
.client-action-btn.wa:hover { border-color: var(--streak); background: rgba(0,230,118,.05); }

/* ═══ BADGES ═══════════════════════════════════════════ */
.badge {
  display: inline-block; font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.8px; font-weight: 500; padding: 3px 0;
}
.badge-green  { color: var(--streak); }
.badge-yellow { color: var(--warn); }
.badge-red    { color: var(--medical); }
.badge-blue   { color: var(--sport); }
.badge-gray   { color: var(--text-secondary); }
.badge-green::before,  .badge-green::after  { content: '['; }
.badge-green::after,   .badge-yellow::after { content: ']'; }
.badge-yellow::before, .badge-red::before   { content: '['; }
.badge-red::after,     .badge-blue::after   { content: ']'; }
.badge-blue::before,   .badge-gray::before  { content: '['; }
.badge-gray::after     { content: ']'; }

/* ═══ MÉTRICAS COMBATE — ESTADOS VISUALES ═══════════════
   Sistema de alertas fisiológicas para luchadores
═══════════════════════════════════════════════════════ */
#dashboard-atleta-combate {
  margin-bottom: 16px;
}

#dashboard-atleta-combate .combate-header {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--sport); margin-bottom: 12px;
}

#dashboard-atleta-combate .combate-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.card-metrica {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 16px;
  transition: border-color .25s, background .25s;
  position: relative;
  overflow: hidden;
}

.card-metrica span {
  font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--text-secondary); font-family: var(--font-mono);
  display: block; margin-bottom: 8px;
}

.card-metrica strong {
  font-family: var(--font-display);
  font-size: 32px; letter-spacing: 1px;
  color: var(--text-primary); line-height: 1; display: block;
}

.card-metrica .metrica-unit {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-secondary); letter-spacing: 0.6px;
  display: block; margin-top: 4px;
}

#display-fc-drop {
  color: var(--text-primary);
  margin-top: 6px;
}

#display-fc-calc {
  opacity: .85;
}

.estado-tag {
  display: inline-block; font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase;
  margin-top: 8px; padding: 3px 8px;
  border-radius: 4px; border: 1px solid currentColor;
  opacity: .9;
}

/* Indicador de barra lateral */
.card-metrica::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 12px 0 0 12px;
  background: var(--card-border);
  transition: background .25s;
}

/* ── Óptimo ── */
.status-ok {
  border-color: rgba(0, 230, 118, .3);
  background: rgba(0, 230, 118, .04);
}
.status-ok::before     { background: var(--streak); }
.status-ok strong      { color: var(--streak); }
.status-ok .estado-tag { color: var(--streak); }

/* ── Precaución ── */
.status-warning {
  border-color: rgba(255, 179, 64, .35);
  background: rgba(255, 179, 64, .04);
}
.status-warning::before     { background: var(--warn); }
.status-warning strong      { color: var(--warn); }
.status-warning .estado-tag { color: var(--warn); }

/* ── Peligro ── */
.status-danger {
  border-color: rgba(255, 90, 90, .35);
  background: rgba(255, 90, 90, .04);
}
.status-danger::before     { background: var(--medical); }
.status-danger strong      { color: var(--medical); }
.status-danger .estado-tag { color: var(--medical); }

/* Fecha de última actualización */
.combate-update {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-secondary); letter-spacing: 0.4px;
  margin-top: 10px; text-align: right;
}

/* ═══ HOME RINGS ════════════════════════════════════════ */
.home-rings-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 10px; margin: 18px 0;
}
.home-ring-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 16px 12px 14px; text-align: center;
  cursor: pointer; transition: border-color .2s; min-width: 0;
}
.home-ring-card:hover { border-color: rgba(255,255,255,.15); }
.home-ring-label {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px;
}
.home-ring-value {
  font-family: var(--font-display); font-size: 24px;
  letter-spacing: 0.5px; line-height: 1; margin-bottom: 2px;
}
.home-ring-note {
  font-size: 10px; color: var(--text-secondary);
  font-family: var(--font-mono); letter-spacing: 0.4px; margin-top: 6px;
}
.home-ring-card-constancia {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.home-ring-value-constancia {
  margin-top: 18px;
  margin-bottom: 22px;
  font-size: 28px;
  line-height: 1.1;
}

.home-ring-note-constancia {
  margin-top: 10px;
  line-height: 1.5;
  text-align: center;
  width: 100%;
}

/* CONSTANCIA — BARRAS DE SESIONES */
.constancia-segments {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin: 18px auto 12px;
  width: 100%;
}

.constancia-segment {
  width: 28px;
  height: 6px;
  border-radius: 999px;
  background: var(--divider);
  opacity: .65;
}

.constancia-segment.done {
  background: var(--sport);
  opacity: 1;
  box-shadow: 0 0 8px rgba(0,229,255,.45);
}

.home-ring-card-constancia .home-ring-value {
  display: none;
}

.home-ring-card-constancia .home-ring-note-constancia {
  margin-top: 0;
  line-height: 1.8;
}

.home-ring-card-constancia {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.home-ring-svg-wrap {
  width: 100%; height: 40px;
  display: flex; align-items: flex-end; justify-content: center;
  margin: 8px 0 4px; overflow: visible;
}
.home-ring-svg-wrap svg { width: 100%; height: 40px; overflow: visible; }
.home-ring, .home-ring-svg, .home-ring-track, .home-ring-progress, .home-ring-percent { display: none !important; }

/* ═══ PLAN GRID ═════════════════════════════════════════ */
.plan-grid { display: grid; gap: 14px 16px; grid-template-columns: 1fr 1fr; }
.plan-item .pi-label {
  font-size: 10px; font-family: var(--font-mono); text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--text-secondary); margin-bottom: 4px;
}
.plan-item .pi-value { font-size: 14px; color: var(--text-primary); font-weight: 600; }
.plan-item.full { grid-column: 1 / -1; }
.plan-divider { grid-column: 1/-1; border: none; border-top: 1px solid var(--divider); margin: 4px 0; }
.plan-no-program {
  background: var(--card); border: 1px dashed var(--card-border);
  border-radius: 10px; padding: 16px;
  color: var(--text-secondary); font-size: 13px; line-height: 1.7; margin-top: 4px;
}

/* ═══ SUMMARY GRID ══════════════════════════════════════ */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.summary-card { padding: 16px; border-radius: 12px; }
.summary-card.full { grid-column: 1/-1; }
.summary-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px;
}
.summary-value { font-size: 15px; color: var(--text-primary); font-weight: 700; }
.summary-value.big { font-family: var(--font-display); font-size: 24px; letter-spacing: 1px; }

/* ═══ QUICK CARDS ════════════════════════════════════════ */
.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.quick-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 14px; text-align: left;
  transition: border-color .15s;
}
.quick-card:hover { border-color: rgba(0,229,255,.3); }
.quick-card-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px;
}
.quick-card-title {
  font-size: 14px; font-weight: 700; color: var(--text-primary);
  display: flex; align-items: center; justify-content: space-between;
}
.quick-card-arrow { color: var(--sport); font-size: 16px; }

/* ═══ ENTRENAMIENTO ══════════════════════════════════════ */
#section-training { background: transparent; border: none; box-shadow: none; }
#section-training .section-header { background: transparent; border-bottom: none; padding: 0 0 16px; }
#sectionTrainingClient { padding: 0; }
#section-training .training-guide-summary {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 20px; margin: 0 0 14px;
}
#section-training .training-guide-title {
  font-family: var(--font-display); color: var(--text-primary);
  font-size: 28px; letter-spacing: 2px; margin-bottom: 6px;
}
#section-training .training-guide-meta {
  font-family: var(--font-mono); color: var(--text-secondary);
  font-size: 11px; letter-spacing: 1px;
}
#section-training .training-week-objective {
  border-top: 1px solid var(--divider); color: var(--text-secondary);
  font-size: 13px; line-height: 1.6; padding-top: 12px; margin-top: 12px;
}
.training-mini-hero {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 18px; margin: 0 0 14px;
}
.training-mini-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.training-mini-week {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-secondary);
  white-space: nowrap;
}
.training-mini-day { font-family: var(--font-display); font-size: 28px; line-height: 1; color: var(--text-primary); letter-spacing: 2px; }
.training-mini-meta { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); letter-spacing: 0.6px; }
.training-mini-title { color: var(--text-secondary); font-size: 13px; line-height: 1.4; }

.training-day-tabs {
  display: flex; gap: 0; overflow-x: auto; margin: 0 0 14px;
  border-bottom: 1px solid var(--divider); scrollbar-width: none;
}
.training-day-tabs::-webkit-scrollbar { display: none; }
.training-day-tab {
  flex: 0 0 auto; background: transparent; color: var(--text-secondary);
  border: none; border-bottom: 2px solid transparent;
  padding: 10px 16px 8px; font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
  white-space: nowrap; transition: color .15s, border-color .15s; margin-bottom: -1px;
}
.training-day-tab:hover { color: var(--text-primary); }
.training-day-tab.active { color: var(--text-primary); border-bottom-color: var(--sport); }

.training-day-panel, .training-session-panel, .training-week-panel { display: none; }
.training-day-panel.active, .training-session-panel.active, .training-week-panel.active { display: block; }
.training-session-separator { display: none; }

.training-step-list { display: flex; flex-direction: column; gap: 10px; }
.training-step-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; overflow: hidden; transition: border-color .2s;
}
.training-step-card.open     { border-color: rgba(0,229,255,.3); }
.training-step-card.completed{ border-color: rgba(0,230,118,.25); }
.training-step-header {
  width: 100%; background: transparent; padding: 16px;
  display: flex; align-items: center; gap: 14px;
  text-align: left; transition: background .15s;
}
.training-step-card.open .training-step-header      { background: rgba(0,229,255,.04); }
.training-step-card.completed .training-step-header { background: rgba(0,230,118,.04); }
.training-step-number {
  flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--card-border);
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-weight: 500; font-size: 18px;
}
.training-step-card.open .training-step-number      { border-color: var(--sport); color: var(--sport); background: rgba(0,229,255,.08); }
.training-step-card.completed .training-step-number { border-color: var(--streak); color: var(--streak); background: rgba(0,230,118,.08); font-size: 16px; }
.training-step-info { flex: 1; min-width: 0; }
.training-step-title {
  color: var(--text-primary); font-size: 16px; font-weight: 700; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.training-step-meta { color: var(--text-secondary); font-size: 12px; margin-top: 3px; font-family: var(--font-mono); }
.training-step-status {
  flex-shrink: 0; font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase;
  color: var(--text-secondary); white-space: nowrap;
}
.training-step-status::before { content: '['; }
.training-step-status::after  { content: ']'; }
.training-step-status.done { color: var(--streak); }
.training-step-body { display: none; border-top: 1px solid var(--divider); padding: 0 16px 16px; }
.training-step-card.open .training-step-body { display: block; }
.training-step-objective {
  color: var(--text-secondary); font-size: 13px; line-height: 1.7;
  border-bottom: 1px solid var(--divider); padding: 14px 0; margin-bottom: 14px;
}
.training-exercise-card {
  background: var(--bg); border: 1px solid var(--card-border);
  border-radius: 10px; padding: 14px; margin-bottom: 10px;
}
.training-exercise-card:last-of-type { margin-bottom: 0; }
.training-exercise-title { color: var(--text-primary); font-size: 15px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
.training-ex-num { font-family: var(--font-mono); font-size: 11px; color: var(--sport); margin-right: 4px; }
.training-exercise-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 12px; }
.training-mini-stat { background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px 6px; text-align: center; }
.training-mini-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-bottom: 4px; }
.training-mini-value { font-family: var(--font-display); font-size: 20px; color: var(--text-primary); letter-spacing: 0.5px; line-height: 1; }
.training-level-tag {
  display: inline-block; background: transparent; color: var(--text-secondary);
  border: 1px solid var(--card-border); border-radius: 4px; padding: 3px 10px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.8px;
  text-transform: uppercase; margin-bottom: 10px;
}
.training-instruction { color: var(--text-primary); font-size: 14px; line-height: 1.6; margin-top: 8px; }
.training-instruction strong {
  display: block; color: var(--sport); font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 1px; text-transform: uppercase; font-weight: 500; margin-bottom: 4px;
}
.training-coach-note { color: var(--text-secondary); font-size: 13px; font-style: italic; line-height: 1.6; margin-top: 8px; }
.training-video-btn {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 7px 12px;
  background: transparent; border: 1px solid rgba(0,229,255,.3); border-radius: 6px;
  color: var(--sport); font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.8px; text-transform: uppercase; transition: border-color .2s;
}
.training-video-btn:hover { border-color: var(--sport); }
.training-complete-block-btn {
  width: 100%; background: var(--text-primary); color: var(--bg); border-radius: 8px;
  padding: 13px 18px; font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 1.2px; text-transform: uppercase; margin-top: 16px; transition: opacity .15s;
}
.training-complete-block-btn:hover { opacity: .88; }
.training-complete-block-btn:disabled { opacity: .3; cursor: default; }
.training-step-done-msg {
  text-align: center; color: var(--streak); font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; padding: 12px; margin-top: 16px;
}
.training-step-done-msg::before { content: '['; }
.training-step-done-msg::after  { content: ']'; }
.training-finish-card, .training-session-completed-card {
  background: var(--card); border: 1px solid rgba(0,230,118,.2);
  border-radius: 12px; padding: 20px; margin-top: 16px;
}
.training-finish-card.compact { padding: 18px 16px; margin-top: 12px; text-align: left; }
.training-finish-icon { font-size: 28px; margin-bottom: 8px; }
.training-finish-title, .training-notes-title, .training-session-completed-title {
  font-family: var(--font-display); color: var(--text-primary);
  font-size: 22px; letter-spacing: 1px; margin-bottom: 6px;
}
.training-finish-sub, .training-notes-sub, .training-session-completed-sub {
  color: var(--text-secondary); font-size: 13px; line-height: 1.7;
}
.training-notes-box {
  background: var(--bg); border: 1px solid var(--card-border);
  border-radius: 10px; padding: 16px; margin-top: 14px;
}
.training-notes-textarea {
  width: 100%; background: var(--card); border: 1px solid var(--card-border);
  color: var(--text-primary); border-radius: 8px; padding: 12px 14px;
  font-size: 14px; line-height: 1.6; resize: vertical; min-height: 90px;
  margin-bottom: 10px; display: block; font-family: var(--font-body);
  transition: border-color .2s;
}
.training-notes-textarea:focus { border-color: var(--sport); }
.training-notes-textarea::placeholder { color: var(--text-secondary); opacity: .5; }
.training-note-saved {
  color: var(--streak); font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 1px; text-transform: uppercase; padding: 8px 0;
}
.training-session-completed-row { display: flex; align-items: center; gap: 12px; }
.training-session-completed-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(0,230,118,.1); border: 1px solid rgba(0,230,118,.25);
  color: var(--streak); display: flex; align-items: center; justify-content: center;
  font-weight: 700; flex-shrink: 0;
}
.training-feedback-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg); border: 1px solid var(--card-border);
  border-radius: 8px; padding: 10px 12px; color: var(--text-primary);
  font-size: 13px; transition: border-color .15s;
}
.training-feedback-row:hover { border-color: var(--sport); }
.training-feedback-check { width: 16px; height: 16px; accent-color: var(--sport); }

/* ═══ ENTRENAMIENTO ADAPTADO CLIENTE ═════════════════════ */
.training-adapted-card {
  background: rgba(0,229,255,.06);
  border: 1px solid rgba(0,229,255,.28);
  border-radius: 12px;
  padding: 18px;
  margin: 0 0 14px;
}

.training-adapted-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--sport);
  margin-bottom: 8px;
}

.training-adapted-title {
  font-family: var(--font-display);
  font-size: 26px;
  letter-spacing: 1.5px;
  line-height: 1;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.training-adapted-message {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.7;
  margin-bottom: 10px;
}

.training-adapted-summary {
  font-size: 12px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  line-height: 1.7;
}

.training-client-status {
  display: inline-block;
  margin-bottom: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .8px;
  color: var(--warn);
}

.training-client-note {
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.6;
}

.training-client-note strong {
  display: block;
  color: var(--sport);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* ═══ MOVILIDAD ACTIVA PLEGABLE ═════════════════════ */

.mobility-card {
  overflow: hidden;
}

.mobility-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: transparent;
  color: var(--text-primary);
  text-align: left;
}

.mobility-toggle-symbol {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid rgba(0,230,118,.28);
  color: var(--streak);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 18px;
  flex-shrink: 0;
}

.mobility-card-body {
  display: none;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(0,230,118,.18);
}

.mobility-card.open .mobility-card-body {
  display: block;
}

/* ═══ EVALUACIONES ══════════════════════════════════════ */
.assessment-card { margin-bottom: 10px; overflow: hidden; }
.assessment-card-header {
  padding: 14px 16px; border-bottom: 1px solid var(--divider);
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; cursor: pointer; transition: background .15s;
}
.assessment-card-header:hover { background: rgba(255,255,255,.02); }
.assessment-card-title { font-family: var(--font-display); font-size: 18px; letter-spacing: 1px; color: var(--text-primary); margin-bottom: 3px; }
.assessment-card-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); letter-spacing: 0.6px; }
.assessment-card-body { display: none; padding: 14px 16px; }
.assessment-card.open .assessment-card-body { display: block; }
.assessment-result-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--divider);
}
.assessment-result-row:last-child { border-bottom: none; }
.assessment-ex-name { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.assessment-ex-meta, .assessment-result-unit { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); letter-spacing: 0.5px; }
.assessment-ex-note { font-size: 12px; margin-top: 4px; font-style: italic; color: var(--text-secondary); }
.assessment-result-val { font-family: var(--font-display); font-size: 26px; line-height: 1; color: var(--text-primary); text-align: right; }
.mini-chart-wrap { background: var(--bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
.mini-chart-title { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--sport); margin-bottom: 8px; }
.mini-chart-labels { display: flex; justify-content: space-between; gap: 4px; margin-top: 4px; }
.mini-chart-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-secondary); text-align: center; flex: 1; }

/* ═══ NOTAS / ACORDEÓN ═══════════════════════════════════ */
.note-item {
  background: var(--card); border-left: 3px solid var(--sport);
  border-radius: 10px; padding: 14px 16px; font-size: 14px;
  color: var(--text-primary); margin-bottom: 8px; line-height: 1.7;
}
.note-item:last-child { margin-bottom: 0; }
.accordion-block { margin-bottom: 8px; overflow: hidden; border-radius: 12px; }
.accordion-block:last-child { margin-bottom: 0; }
.accordion-title {
  width: 100%; background: transparent; color: var(--text-primary);
  padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
}
.accordion-title span:first-child { color: var(--sport); }
.accordion-symbol { color: var(--text-secondary); font-size: 18px; flex-shrink: 0; }
.accordion-content { display: none; padding: 0 16px 16px; border-top: 1px solid var(--divider); }
.accordion-block.open .accordion-content { display: block; }
.accordion-block.open .accordion-title { background: rgba(0,229,255,.04); }

/* ═══ PROGRESO ════════════════════════════════════════════ */
.progress-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 10px; }
.progress-circle-card { padding: 16px; text-align: center; }
.progress-ring {
  width: 80px; height: 80px; margin: 0 auto 10px; border-radius: 50%;
  display: grid; place-items: center;
  background: conic-gradient(var(--sport) calc(var(--p)*1%),var(--divider) 0);
  position: relative;
}
.progress-ring::before { content: ''; position: absolute; width: 60px; height: 60px; background: var(--card); border-radius: 50%; }
.progress-ring span { position: relative; z-index: 1; font-family: var(--font-display); font-size: 20px; color: var(--text-primary); }
.progress-circle-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 3px; }
.progress-circle-value { font-size: 13px; color: var(--text-primary); font-weight: 700; }
.progress-circle-note  { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }

/* ═══ RESPONSIVE ══════════════════════════════════════════ */
@media (max-width: 480px) {
  .dash-header { height: 54px; padding: 0 14px; }
  .btn-icon .btn-label { display: none; }
  .client-nav { top: 54px; }
  .dash-main { padding: 16px 14px calc(120px + env(safe-area-inset-bottom)); }
  .plan-grid { grid-template-columns: 1fr; gap: 12px; }
  .summary-grid { grid-template-columns: 1fr; }
  #dashboard-atleta-combate .combate-grid { grid-template-columns: 1fr; }
  .home-rings-grid { gap: 8px; }
  .training-exercise-grid { grid-template-columns: repeat(2,1fr); }
  .training-mini-value { font-size: 18px; }
  .login-box { padding: 28px 20px; }
  .section-header h2 { font-size: 20px; }
  .card-metrica strong { font-size: 26px; }
}

.client-avatar-lg {
  width: 72px; height: 72px; border-radius: 50%;
  object-fit: cover; flex-shrink: 0;
}
.client-avatar-initials-lg {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--sport); color: #000;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 26px; font-weight: 500;
  flex-shrink: 0;
}
.avatar-upload-btn {
  background: transparent; border: 1px solid var(--card-border);
  color: var(--text-secondary); border-radius: 8px; padding: 8px 14px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase; cursor: pointer; transition: border-color .2s, color .2s;
  margin-top: 10px;
}
.avatar-upload-btn:hover { border-color: var(--sport); color: var(--sport); }
#avatarFileInput { display: none; }

/* ═══ CALENDARIO RESERVAS ══════════════════════════════ */
.cal-wrapper { margin-bottom: 20px; }
.cal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.cal-month {
  font-family: var(--font-display); font-size: 22px;
  letter-spacing: 2px; color: var(--text-primary);
}
.cal-nav-btn {
  background: transparent; border: 1px solid var(--card-border);
  color: var(--text-secondary); border-radius: 6px;
  width: 34px; height: 34px; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .2s, color .2s;
}
.cal-nav-btn:hover { border-color: var(--sport); color: var(--sport); }
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-day-label {
  text-align: center; font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 1px; color: var(--text-secondary);
  text-transform: uppercase; padding: 4px 0 8px;
}
.cal-day {
  aspect-ratio: 1; border-radius: 8px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 13px;
  cursor: pointer; position: relative;
  border: 1px solid transparent;
  transition: border-color .15s, background .15s;
  gap: 2px;
}
.cal-day.empty { cursor: default; }
.cal-day.past { color: var(--text-secondary); opacity: .35; cursor: default; }
.cal-day.today { border-color: var(--sport); color: var(--sport); }
.cal-day.free { color: var(--text-primary); }
.cal-day.free:hover { border-color: var(--sport); background: rgba(0,229,255,.06); }
.cal-day.grupal-open {
  border-color: rgba(0,230,118,.3);
  background: rgba(0,230,118,.04);
  color: var(--streak);
}
.cal-day.grupal-open:hover { background: rgba(0,230,118,.1); }
.cal-day.grupal-full { color: var(--text-secondary); opacity: .5; cursor: default; }
.cal-day.personal-own {
  background: rgba(0,229,255,.1);
  border-color: rgba(0,229,255,.4);
  color: var(--sport);
}
.cal-day.occupied { color: var(--text-secondary); opacity: .4; cursor: default; }
.cal-day.selected {
  background: var(--sport) !important;
  border-color: var(--sport) !important;
  color: #000 !important;
}
.cal-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: currentColor; flex-shrink: 0;
}
.cal-legend {
  display: flex; flex-wrap: wrap; gap: 8px 14px;
  margin-top: 14px;
}
.cal-legend-item {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: .8px; text-transform: uppercase;
  color: var(--text-secondary);
}
.cal-legend-dot {

  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .6px;
  text-transform: uppercase;
  background: rgba(255,255,255,.025);
}

.exercise-knowledge-row {
  border-top: 1px solid var(--divider);
  padding-top: 10px;
  margin-top: 10px;
}

.exercise-knowledge-row:first-of-type {
  border-top: none;
  padding-top: 0;
  margin-top: 0;
}

.exercise-knowledge-label {
  color: var(--sport);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.exercise-knowledge-text {
  color: var(--text-secondary);
  font-size: 12px;
  line-height: 1.65;
}

/* ═══ HEADER + NAV — FUENTE ÚNICA DE VERDAD ═══════════════
   Sin !important. Sin conflictos. Una sola definición.
══════════════════════════════════════════════════════════ */

.dash-header {
  height: 68px;
  min-height: 68px;
  padding: 0 20px;
  background: rgba(0,0,0,.96);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand-logo-header {
  width: 80px;
  height: auto;
  max-height: 44px;
  object-fit: contain;
  display: block;
  border-radius: 0;
}

.brand-logo-login {
  width: 110px;
  height: auto;
  max-height: 80px;
  object-fit: contain;
  display: block;
  border-radius: 0;
}

.client-nav {
  top: 68px;
}

@media (max-width: 480px) {
  .dash-header {
    height: 72px;
    min-height: 72px;
    padding: 0 16px;
  }

  .brand-logo-header {
    width: 72px;
    max-height: 40px;
  }

  .client-nav {
    top: 72px;
  }
}

/* ═══ CRONÓMETRO ═════════════════════════════════════════ */
.wt-timer {
  background: rgba(18,18,20,.96);
  border: 1px solid var(--card-border);
  border-top: 2px solid var(--sport);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 14px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.wt-clock {
  font-family: var(--font-display);
  font-size: 2.2rem;
  line-height: 1;
  letter-spacing: .04em;
  text-align: center;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.wt-timer-actions { display: flex; gap: 8px; }
.wt-timer-actions .client-action-btn { flex: 1; min-height: 44px; }
.wt-mode-row { display: flex; gap: 6px; margin-bottom: 10px; }
.wt-mode-pill {
  flex: 1; padding: 8px 10px;
  font-family: var(--font-mono); font-size: .58rem;
  letter-spacing: .08em; text-transform: uppercase;
  background: var(--bg); border: 1px solid var(--card-border);
  color: var(--text-secondary); border-radius: 999px;
  text-align: center; font-weight: 700;
}
.wt-mode-pill.on {
  background: rgba(0,229,255,.12); color: var(--sport);
  border-color: rgba(0,229,255,.35);
}
.wt-phase {
  text-align: center; font-family: var(--font-mono);
  font-size: .62rem; letter-spacing: .18em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 6px; margin-bottom: 8px; font-weight: 800;
}
.wt-phase.work  { background: rgba(0,230,118,.15); color: var(--streak); }
.wt-phase.rest  { background: rgba(255,179,64,.15); color: var(--warn); }
.wt-phase.done  { background: rgba(0,229,255,.15); color: var(--sport); }
.wt-round {
  text-align: center; font-family: var(--font-mono); font-size: .62rem;
  color: var(--text-secondary); margin-top: 6px; letter-spacing: .08em; text-transform: uppercase;
}
.wt-iv-config { border-top: 1px solid var(--divider); margin-top: 10px; padding-top: 10px; }
.wt-iv-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.wt-iv-field { display: flex; flex-direction: column; gap: 3px; }
.wt-iv-field label {
  font-family: var(--font-mono); font-size: .5rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-secondary); text-align: center;
}
.wt-iv-input {
  background: var(--bg); border: 1px solid var(--card-border);
  color: var(--text-primary); border-radius: 8px; padding: 8px;
  font-family: var(--font-display); font-size: 1.2rem; text-align: center; outline: none; width: 100%;
}
.wt-iv-input:focus { border-color: var(--sport); }
.wt-iv-presets { display: flex; gap: 6px; flex-wrap: wrap; }
.wt-iv-preset {
  flex: 1; min-width: 80px; padding: 7px 8px;
  background: var(--bg); border: 1px solid var(--card-border);
  color: var(--text-secondary); border-radius: 8px;
  font-family: var(--font-mono); font-size: .55rem; letter-spacing: .06em;
  text-transform: uppercase; font-weight: 700;
}
.wt-iv-preset:active { background: rgba(0,229,255,.08); color: var(--sport); }
#section-home .section-header { display: none !important; }

/* ═══ CLIENTE · OVERRIDES POST-FIELD-SYNC ═══ */

/* Header cliente: sin top-session ni top-refresh */
.dash-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  height: calc(var(--top-h) + var(--safe-t));
  padding-top: var(--safe-t);
  background: rgba(0,0,0,.92);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  padding-left: 16px;
  padding-right: 12px;
  gap: 10px;
}

/* Nav cliente: 4 tabs igual que field */
.dash-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 50;
  height: calc(var(--bot-h) + var(--safe-b));
  background: var(--card);
  border-top: 1px solid var(--divider);
  display: flex;
  align-items: flex-start;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* Scroll wrapper cliente */
.dash-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-top: calc(var(--top-h) + var(--safe-t));
  padding-bottom: calc(var(--bot-h) + var(--safe-b) + 12px);
  -webkit-overflow-scrolling: touch;
}

/* Secciones cliente */
.dash-section { display: none; padding: 16px 16px 0; }
.dash-section.active { display: block; animation: fadein .15s ease; }

/* Acordeones perfil */
.accordion-block { margin-bottom: 10px; }
.accordion-block.open .accordion-body { display: block; }
.accordion-title {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--r);
  font-family: var(--font-m);
  font-size: .6rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--sport);
  font-weight: 700;
}
.accordion-body {
  display: none;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-top: none;
  border-radius: 0 0 var(--r) var(--r);
}

/* Sección home: ocultar section-header */
#section-home .section-header { display: none !important; }

/* ═══ SALUD — SUB-TABS ══════════════════════════════════ */
.health-tabs {
  display: flex;
  margin: 0 0 16px;
  border-bottom: 1px solid var(--divider);
}
.health-tab {
  flex: 1;
  background: transparent;
  color: var(--text-secondary);
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 8px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  transition: color .15s, border-color .15s;
  margin-bottom: -1px;
  cursor: pointer;
}
.health-tab.active {
  color: var(--text-primary);
  border-bottom-color: var(--sport);
}
.health-tab .health-tab-dot {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--warn);
  margin-left: 5px;
  vertical-align: middle;
  position: relative; top: -1px;
}
.health-panel { display: none; }
.health-panel.active { display: block; }

/* ═══ CHECK-IN SCALE — NÚMERO BEBAS SANS EMOJI ══════════
   Diseño on-brand: número como focal, etiqueta mono debajo.
   Sin emojis de color que rompan el dark system.
══════════════════════════════════════════════════════════ */

/* Ocultar emoji y value duplicados del HTML legacy */
.emoji-scale-emoji { display: none !important; }
.emoji-scale-value { display: none !important; }

/* Botón base */
.emoji-scale-btn {
  background: var(--bg);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  padding: 10px 4px 8px;
  text-align: center;
  transition: border-color .15s, background .15s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.emoji-scale-btn:hover {
  border-color: rgba(0,229,255,.3);
}
.emoji-scale-btn.active {
  border-color: var(--sport);
  background: rgba(0,229,255,.07);
}

/* Número Bebas Neue como focal */
.emoji-scale-num {
  display: block;
  font-family: var(--font-display);
  font-size: 24px;
  letter-spacing: 1px;
  line-height: 1;
  color: var(--text-secondary);
  transition: color .15s;
}
.emoji-scale-btn.active .emoji-scale-num {
  color: var(--sport);
}

/* Etiqueta DM Mono pequeña */
.emoji-scale-text {
  display: block;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-secondary);
  line-height: 1.2;
  opacity: .7;
  transition: color .15s, opacity .15s;
}
.emoji-scale-btn.active .emoji-scale-text {
  color: var(--sport);
  opacity: 1;
}

/* ═══ CALENDARIO — COMPACTO MOBILE ═══════════════════════
   Problema: aspect-ratio:1 hace cada día ~46×46px.
   Con 5 filas el calendario ocupa ~360px (75% de pantalla).
   Fix: altura fija 38px + reducir gap vertical.
══════════════════════════════════════════════════════════ */
.cal-day {
  aspect-ratio: unset;
  height: 38px;
  min-height: 38px;
}
.cal-grid {
  gap: 3px 4px;
}
.cal-day-label {
  padding: 2px 0 5px;
  font-size: 8px;
}
.cal-month {
  font-size: 19px;
  letter-spacing: 1.5px;
}
.cal-nav-btn {
  width: 30px;
  height: 30px;
}

/* ═══ ENTRENAR — TIMER COLAPSABLE ══════════════════════ */
.timer-toggle-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 12px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  margin-bottom: 14px;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.timer-toggle-btn:hover {
  border-color: rgba(0,229,255,.3);
  color: var(--sport);
}
.timer-toggle-btn.open {
  border-color: rgba(0,229,255,.3);
  color: var(--sport);
  background: rgba(0,229,255,.05);
}
.timer-toggle-left {
  display: flex;
  align-items: center;
  gap: 7px;
}
.timer-toggle-sym {
  font-size: 18px;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.timer-toggle-btn.open .timer-toggle-sym {
  color: var(--sport);
}
.timer-wrap-inner {
  display: none;
}
.timer-wrap-inner.open {
  display: block;
}

/* ═══ FIX padding-top — compensa header fixed + nav sticky ══════
   header fixed (~68px) + nav sticky (56px) = 124px visual total
   nav está en el flow (empuja dash-main 56px) → solo compensar header
   68px header + 16px respiro = 84px
══════════════════════════════════════════════════════════════════ */
.dash-main {
  padding-top: 84px;
}
@media (max-width: 480px) {
  .dash-main {
    padding-top: 88px; /* header 72px en mobile + 16px */
  }
}

/* Ocultar section-header de ENTRENAR (igual que HOME) */
#section-training > .section-header { display: none !important; }

/* ═══ NOTIFICACIONES — BELL + TOGGLE ═══════════════════════════ */
.notif-bell-btn {
  position: relative;
  width: 36px; height: 36px;
  border-radius: 10px;
  border: 1px solid var(--card-border);
  background: transparent;
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer;
  transition: border-color .2s, color .2s;
  flex-shrink: 0;
}
.notif-bell-btn.active {
  color: var(--streak);
  border-color: rgba(0,230,118,.3);
}
.notif-bell-badge {
  position: absolute;
  top: -4px; right: -4px;
  width: 10px; height: 10px;
  background: var(--medical);
  border: 2px solid var(--bg);
  border-radius: 50%;
  display: none;
}
.notif-bell-badge.visible { display: block; }

/* ═══ COMPETICIÓN — BOTÓN ANULAR ════════════════════════════════ */
.comp-skip-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding: 6px 12px;
  background: transparent;
  border: 1px solid rgba(255,90,90,.3);
  border-radius: 6px;
  color: var(--medical);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.comp-skip-btn:hover {
  background: rgba(255,90,90,.06);
  border-color: var(--medical);
}
.comp-skip-badge {
  display: inline-block;
  background: rgba(255,90,90,.12);
  color: var(--medical);
  border: 1px solid rgba(255,90,90,.3);
  border-radius: 4px;
  padding: 2px 7px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .8px;
  text-transform: uppercase;
}

/* ═══ ATLETA — COMPETITION TIMELINE ═══════════════════════ */
.comp-timeline {
  position: relative;
  padding-left: 28px;
  margin-bottom: 4px;
}
.comp-timeline::before {
  content: '';
  position: absolute;
  left: 5px;
  top: 16px;
  bottom: 16px;
  width: 2px;
  background: var(--divider);
  border-radius: 1px;
}
.comp-tl-item {
  position: relative;
  margin-bottom: 12px;
}
.comp-tl-item:last-child { margin-bottom: 0; }
.comp-tl-dot {
  position: absolute;
  left: -28px;
  top: 18px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--card-border);
  background: var(--bg);
  z-index: 1;
  transition: background .2s;
}
.comp-tl-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 14px;
}

/* ═══ BRAND COLOR REFINEMENTS ════════════════════════════ */

/* Label mono más compacto */
.next-label {
  letter-spacing: 1.4px;
  font-size: 9px;
}

/* Títulos de sección en display font más tight */
.section-header h2 {
  letter-spacing: 2.5px;
}

/* dc-sub más legible */
.data-card .dc-sub {
  letter-spacing: 0.2px;
  opacity: .85;
}

/* ═══════════════════════════════════════════════════════
   AB SYSTEM CLIENT — FIELD VISUAL ALIGN PATCH v1
   Pegar al FINAL del <style>
═══════════════════════════════════════════════════════ */

:root {
  --bg: #000000;
  --card: #121214;
  --card-2: #151519;
  --card-border: #24242A;
  --divider: #17171B;
  --text-primary: #FFFFFF;
  --text-secondary: #8F8F99;
  --sport: #00E5FF;
  --streak: #00E676;
  --warn: #FFB340;
  --medical: #FF5A5A;

  --field-radius: 20px;
  --field-radius-sm: 14px;
  --field-shadow: 0 16px 40px rgba(0,0,0,.34);
}

/* BASE */
html,
body {
  background: #000;
  overflow-x: hidden;
}

body {
  color: var(--text-primary);
}

/* HEADER MÁS FIELD */
.dash-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;

  height: calc(82px + env(safe-area-inset-top, 0px));
  min-height: calc(82px + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 18px 0;

  background: rgba(0,0,0,.94);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 200;
}

.dash-header-left {
  display: flex;
  align-items: center;
  min-width: 0;
}

.client-avatar,
.client-avatar-initials {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,.35);
  box-shadow: 0 0 0 3px rgba(0,229,255,.06);
}

.client-avatar {
  object-fit: cover;
}

.client-avatar-initials {
  background: rgba(0,229,255,.14);
  color: var(--sport);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}

/* BOTONES SUPERIORES */
.dash-header-actions {
  gap: 12px;
}

.btn-icon,
.notif-bell-btn {
  width: 58px;
  height: 52px;
  border-radius: 16px;
  background: rgba(18,18,20,.88);
  border: 1px solid var(--card-border);
  color: var(--text-secondary);
}

.btn-icon:hover,
.notif-bell-btn:hover {
  border-color: rgba(0,229,255,.34);
  color: var(--sport);
  background: rgba(0,229,255,.045);
}

.btn-wa-icon {
  border-color: rgba(0,230,118,.38);
  color: var(--streak);
  background: rgba(0,230,118,.055);
}

.btn-wa-icon:hover {
  border-color: rgba(0,230,118,.7);
  color: var(--streak);
}

.btn-exit-icon:hover {
  border-color: rgba(255,90,90,.45);
  color: var(--medical);
  background: rgba(255,90,90,.055);
}

/* NAV SUPERIOR CLIENTE — MISMA ESTÉTICA FIELD */
.client-nav {
  position: sticky;
  top: calc(82px + env(safe-area-inset-top, 0px));
  z-index: 160;

  height: 64px;
  padding: 0 18px;

  background: rgba(0,0,0,.94);
  border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  display: flex;
  gap: 26px;
  align-items: stretch;
  overflow-x: auto;
  scrollbar-width: none;
}

.client-nav::-webkit-scrollbar {
  display: none;
}

.client-nav button {
  flex: 0 0 auto;
  min-width: auto;
  padding: 0 4px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-bottom: 4px solid transparent;
  color: rgba(255,255,255,.48);

  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1;
  letter-spacing: 2.8px;
  text-transform: uppercase;
  font-weight: 700;
}

.client-nav button.active {
  color: #fff;
  border-bottom-color: var(--sport);
}

.client-nav button:hover {
  color: #fff;
}

/* ESPACIO GENERAL */
.dash-main {
  max-width: 760px;
  margin: 0 auto;
  padding: calc(100px + env(safe-area-inset-top, 0px)) 18px calc(130px + env(safe-area-inset-bottom, 0px));
}

@media (max-width: 480px) {
  .dash-main {
    padding-left: 16px;
    padding-right: 16px;
  }
}

/* HEADERS DE SECCIÓN MÁS LIMPIOS */
.section-header {
  padding: 12px 0 22px;
  align-items: flex-end;
}

.section-header h2 {
  font-family: var(--font-display);
  font-size: 34px;
  line-height: .9;
  letter-spacing: 2px;
  color: #fff;
}

.section-header .sec-badge {
  font-size: 10px;
  letter-spacing: 1.8px;
  color: var(--text-secondary);
}

/* LOGO DE SECCIÓN */
.section-logo {
  height: 40px !important;
  opacity: .9 !important;
}

/* TARJETAS FIELD */
.data-card,
.summary-card,
.assessment-card,
.accordion-block,
.training-guide-summary,
.training-mini-hero,
.training-step-card,
.training-exercise-card,
.training-finish-card,
.training-session-completed-card,
.cal-request-form,
.card-metrica,
.onboarding-card,
.inactivity-card {
  background: linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.005)), var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--field-radius);
  box-shadow: none;
}

.data-card {
  padding: 20px;
  margin-bottom: 14px;
}

.summary-card {
  padding: 16px;
}

.data-card.next-session {
  border-color: rgba(0,229,255,.34);
  background:

/* ═══════════════════════════════════════════════════════
   AB SYSTEM CLIENT — BOTTOM NAV FIELD PATCH v2
   Pegar al FINAL del <style>, después del parche visual v1
═══════════════════════════════════════════════════════ */

/* El cliente deja de usar nav superior y pasa a nav inferior estilo Field */
.client-nav {
  position: fixed !important;
  top: auto !important;
  bottom: 0 !important;
  left: 0 !important;
  right: 0 !important;

  z-index: 300 !important;

  height: calc(76px + env(safe-area-inset-bottom, 0px)) !important;
  padding: 0 10px env(safe-area-inset-bottom, 0px) !important;

  background: rgba(18,18,20,.96) !important;
  border-top: 1px solid var(--divider) !important;
  border-bottom: none !important;

  backdrop-filter: blur(22px) !important;
  -webkit-backdrop-filter: blur(22px) !important;

  display: flex !important;
  align-items: stretch !important;
  gap: 4px !important;

  overflow-x: auto !important;
  overflow-y: hidden !important;
  white-space: nowrap !important;

  scrollbar-width: none !important;
}

.client-nav::-webkit-scrollbar {
  display: none !important;
}

.client-nav button {
  flex: 0 0 62px !important;
  min-width: 62px !important;
  height: 76px !important;

  padding: 8px 4px 7px !important;

  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 5px !important;

  background: transparent !important;
  border: none !important;
  border-top: 3px solid transparent !important;
  border-bottom: none !important;

  color: rgba(255,255,255,.46) !important;

  font-size: 0 !important;
  letter-spacing: 0 !important;
  line-height: 1 !important;

  transition: color .15s, border-color .15s, background .15s;
}

.client-nav button::before {
  font-family: var(--font-mono);
  font-size: 24px;
  line-height: 1;
  letter-spacing: .04em;
  color: rgba(255,255,255,.48);
}

.client-nav button::after {
  font-family: var(--font-mono);
  font-size: 9px;
  line-height: 1;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: rgba(255,255,255,.48);
}

.client-nav button.active {
  border-top-color: var(--sport) !important;
  background: linear-gradient(180deg, rgba(0,229,255,.08), transparent 55%) !important;
}

.client-nav button.active::before,
.client-nav button.active::after {
  color: var(--sport) !important;
}

/* Códigos visuales estilo Admin Field */
#navHome::before {
  content: "01";
}

#navHome::after {
  content: "INICIO";
}

#navTraining::before {
  content: "TR";
}

#navTraining::after {
  content: "ENTRENAR";
}

#navReservations::before {
  content: "RS";
}

#navReservations::after {
  content: "RESERVAS";
}

#navProgress::before {
  content: "PR";
}

#navProgress::after {
  content: "PROGRESO";
}

#navHealth::before {
  content: "SA";
}

#navHealth::after {
  content: "SALUD";
}

#navAtleta::before {
  content: "AT";
}

#navAtleta::after {
  content: "ATLETA";
}

#navProfile::before {
  content: "+";
  font-size: 30px;
}

#navProfile::after {
  content: "MÁS";
}

/* Compensar barra inferior */
.dash-main {
  padding-bottom: calc(118px + env(safe-area-inset-bottom, 0px)) !important;
}

function statusLabel(esLabel, srLabel) {
  return getLang() === 'sr' ? srLabel : esLabel;
}

/**
 * Creatina Quinasa (U/L)
 * <400 → ok | 400–800 → warning | >800 → danger
 */
function evaluarCK(v) {
  if (v == null) return { clase: null, label: '' };

  if (v < 400) {
    return {
      clase: 'status-ok',
      label: statusLabel('Óptimo', 'Optimalno')
    };
  }

  if (v <= 800) {
    return {
      clase: 'status-warning',
      label: statusLabel('Precaución', 'Oprez')
    };
  }

  return {
    clase: 'status-danger',
    label: statusLabel('Peligro', 'Rizik')
  };
}

/**
 * Cortisol (µg/dL)
 * <15 → ok | 15–22 → warning | >22 → danger
 */
function evaluarCortisol(v) {
  if (v == null) return { clase: null, label: '' };

  if (v < 15) {
    return {
      clase: 'status-ok',
      label: statusLabel('Óptimo', 'Optimalno')
    };
  }

  if (v <= 22) {
    return {
      clase: 'status-warning',
      label: statusLabel('Elevado', 'Povišeno')
    };
  }

  return {
    clase: 'status-danger',
    label: statusLabel('Peligro', 'Rizik')
  };
}

/**
 * FC Recuperación 1 min
 * caída = fc_max - fc_al_minuto
 * >30 ppm → ok | 18–30 → warning | <18 → danger
 */
function evaluarFCRecuperacion(fcAlMinuto, fcMax) {
  if (fcAlMinuto == null) {
    return { clase: null, label: '', caida: null };
  }

  const fc = Number(fcMax) || 190;
  const caida = fc - Number(fcAlMinuto);

  if (caida > 30) {
    return {
      clase: 'status-ok',
      label: `↓${caida} ppm · ${statusLabel('Óptimo', 'Optimalno')}`,
      caida
    };
  }

  if (caida >= 18) {
    return {
      clase: 'status-warning',
      label: `↓${caida} ppm · ${statusLabel('Regular', 'Solidno')}`,
      caida
    };
  }

  return {
    clase: 'status-danger',
    label: `↓${caida} ppm · ${statusLabel('Peligro', 'Rizik')}`,
    caida
  };
}

/**
 * Inyecta valor + clase de estado en una card-metrica
 */
function inyectarMetrica(cardId, displayId, valor, estado, etiqueta) {
  const card    = document.getElementById(cardId);
  const display = document.getElementById(displayId);
  if (!card || !display) return;

  display.textContent = valor != null ? valor : '--';

  // Quitar etiqueta previa
  card.querySelector('.estado-tag')?.remove();

  if (estado && etiqueta) {
    const tag = document.createElement('div');
    tag.className = 'estado-tag';
    tag.textContent = etiqueta;
    display.insertAdjacentElement('afterend', tag);
  }

/**

async function cargarMetricasCombate() {
  if (!clientData?.id) return;

  const { data, error } = await db
    .rpc('get_latest_metricas_combate', {
      p_atleta_id: clientData.id
    })
    .maybeSingle();

  if (error || !data) {
    // Sin datos aún — las cards ya muestran '--' por defecto
    return;
  }

  // FC máxima usada para calcular la recuperación
  const fcMax = Number(clientData.fc_max) || 190;

  // FC máxima de referencia opcional, solo para mostrar entre paréntesis
  const fcMaxRef = clientData.fc_max_ref ? Number(clientData.fc_max_ref) : null;

  const ck = evaluarCK(data.creatina_quinasa);
  const cortisol = evaluarCortisol(data.cortisol);
  const fcRec = evaluarFCRecuperacion(data.fc_recuperacion_1min, fcMax);

  inyectarMetrica(
    'card-ck',
    'display-ck',
    data.creatina_quinasa,
    ck.clase,
    ck.label
  );

  inyectarMetrica(
    'card-cortisol',
    'display-cortisol',
    data.cortisol != null ? Number(data.cortisol).toFixed(1) : null,
    cortisol.clase,
    cortisol.label
  );

  inyectarMetrica(
    'card-recuperacion',
    'display-fc-rec',
    data.fc_recuperacion_1min,
    fcRec.clase,
    fcRec.label
  );

  // Mostrar caída real de FC
  const fcDropEl = document.getElementById('display-fc-drop');
  if (fcDropEl) {
    fcDropEl.textContent = fcRec.caida != null
      ? `${uiText('heartDrop')}: ${fcRec.caida} ppm`
: `${uiText('heartDrop')}: -- ppm`;
  }

  // Mostrar FC máxima usada para calcular la recuperación
  const fcCalcEl = document.getElementById('display-fc-calc');
  if (fcCalcEl) {
    fcCalcEl.textContent = fcMaxRef
      ? `${uiText('maxHrUsed')}: ${fcMax} (ref. ${fcMaxRef}) ppm`
: `${uiText('maxHrUsed')}: ${fcMax} ppm`;
  }

  inyectarMetrica(
    'card-peso',
    'display-peso',
    data.peso_corporal != null ? Number(data.peso_corporal).toFixed(1) : null,
    null,
    null
  );

  // Fecha última actualización
  const fechaEl = document.getElementById('display-fecha');
  if (fechaEl && data.created_at) {
    const d = new Date(data.created_at);
    fechaEl.textContent = d.toLocaleDateString('es-ES', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }
}

function getTrainingStorageKey(sessionId) {
  if (!clientData || !clientTrainingAssignment) return null;
  const sid = sessionId || getCurrentVisibleSessionId?.() || 'general';
  return ['ab_tp', clientData.id, clientTrainingAssignment.id, sid, todayISO()].join('_');
}
function isSessionFinished(sessionId) {
  if (!sessionId) return false;
  const sid = String(sessionId);

  const dbFinished = (clientSessionLogs || []).some(log =>
    String(log.assignment_id) === String(clientTrainingAssignment?.id) &&
    String(log.session_id) === sid &&
    (
      log.is_finished === true ||
      String(log.status || '').toLowerCase() === 'finished' ||
      Boolean(log.finished_at)
    )
  );

  if (dbFinished) return true;

  const key = getTrainingStorageKey(sid);
  if (!key) return false;
  try {
    const r = localStorage.getItem(key);
    return r ? JSON.parse(r)?.is_finished === true : false;
  } catch { return false; }
}

function loadTrainingProgressLocal(sessionId) {
  const key = getTrainingStorageKey(sessionId);
  if (!key) return null;
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch { return null; }
}
function saveTrainingProgressLocal(extra, sessionId) {
  const key = getTrainingStorageKey(sessionId);
  if (!key) return;

  const sessionSteps = buildTrainingSteps(sessionId);
  const sessionBlockIds = new Set(sessionSteps.map(s => s.blockId));
  const blockIdsForSession = [...completedTrainingBlocks].filter(id => sessionBlockIds.has(id));

  const hasProgress = blockIdsForSession.length > 0;
  const hasRelevantExtra = extra && (
    extra.is_finished === true ||
    extra.finished_at ||
    extra.client_note ||
    (Array.isArray(extra.client_feedback_tags) && extra.client_feedback_tags.length)
  );

  if (!hasProgress && !hasRelevantExtra) return;

  const prev = loadTrainingProgressLocal(sessionId) || {};
  localStorage.setItem(key, JSON.stringify({
    ...prev,
    session_id: sessionId,
    completed_block_ids: blockIdsForSession,
    is_finished: extra?.is_finished ?? prev.is_finished ?? false,
    client_note: extra?.client_note ?? prev.client_note ?? '',
    client_feedback_tags: extra?.client_feedback_tags ?? prev.client_feedback_tags ?? [],
    client_feedback_summary: extra?.client_feedback_summary ?? prev.client_feedback_summary ?? '',
    finished_at: extra?.finished_at ?? prev.finished_at ?? null,
    updated_at: new Date().toISOString()
  }));
}
function getLastActiveSessionKey() {
  if (!clientData || !clientTrainingAssignment) return null;
  return ['ab_last_session', clientData.id, clientTrainingAssignment.id].join('_');
}
function saveLastActiveSession(sessionId) {
  const key = getLastActiveSessionKey();
  if (key && sessionId) localStorage.setItem(key, String(sessionId));

function getLastActiveSession() {

  if (saved && clientTrainingSessions.some(s => String(s.id) === String(saved))) return String(saved);

}

function reservationStatusValue(r) {
  return String(r?.status || '').trim().toLowerCase();
}

function isClosedReservation(r) {
  const s = reservationStatusValue(r);

  return [
    'cancelada',
    'cancelado',
    'cancelled',
    'realizada',
    'realizado',
    'completada',
    'completado',
    'completed',
    'finished',
    'done'
  ].includes(s);
}

function reservationMinutes(r) {
  const t = String(r?.time || '').slice(0, 5);
  const parts = t.split(':');

  if (parts.length < 2) return null;

  const h = Number(parts[0]);
  const m = Number(parts[1]);

  if (!Number.isFinite(h) || !Number.isFinite(m)) return null;

  return h * 60 + m;
}

function isPastTodayReservation(r, graceMinutes = 60) {
  const date = String(r?.date || '').slice(0, 10);

  if (date !== todayISO()) return false;

  const minutes = reservationMinutes(r);

  if (minutes == null) return false;

  const now = new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  return minutes + graceMinutes < nowMinutes;
}

function isUpcomingReservation(r) {
  const date = String(r?.date || '').slice(0, 10);

  if (!date) return false;
  if (isClosedReservation(r)) return false;

  const today = todayISO();

  if (date > today) return true;
  if (date < today) return false;

  return !isPastTodayReservation(r);
}

function compareReservationsByDateTime(a, b) {
  const da = String(a?.date || '').slice(0, 10) + ' ' + String(a?.time || '23:59').slice(0, 5);
  const dbb = String(b?.date || '').slice(0, 10) + ' ' + String(b?.time || '23:59').slice(0, 5);

  return da.localeCompare(dbb);
}

function getUpcomingReservations() {
  return (clientReservations || [])
    .filter(isUpcomingReservation)
    .sort(compareReservationsByDateTime);
}

function isPendingReservation(r) {

  return [
    'pendiente',
    'pending',
    'por_confirmar',
    'por confirmar'
  ].includes(s);

function isConfirmedReservation(r) {
  const s = reservationStatusValue(r);

  return [
    'reservada',
    'reservado',
    'confirmada',
    'confirmado',
    'confirmed'
  ].includes(s);
}

function getConfirmedUpcomingReservations() {

      p_phone: phone,

function getVisibleAssignmentWeek() {

    clientTrainingAssignment?.assigned_week ||

function applyScopeFilter(list) {
  const visibleWeek = getVisibleAssignmentWeek();

  if (scope === 'day') {
    const as = Number(clientTrainingAssignment?.assigned_session_number || 1);

    return list.filter(r =>
      Number(r.week_order) === visibleWeek &&
      Number(r.session_order) === as
    );
  }

  if (scope === 'week') {
    return list.filter(r =>
      Number(r.week_order) === visibleWeek
    );
  }

  if (scope === 'month') {
    const am = Number(clientTrainingAssignment?.assigned_month || 1);
    const sw = (am - 1) * 4 + 1;

    return list.filter(r =>
      Number(r.week_order) >= sw &&
      Number(r.week_order) <= sw + 3
    );
  }

  // IMPORTANTE:
  // Aunque el alcance sea full, la vista inicial del cliente debe abrir
  // la semana actual asignada por el admin, no volver a Semana 1.
  if (scope === 'full') {
    return list.filter(r =>
      Number(r.week_order) === visibleWeek
    );
  }

  return list;
}

function buildMicroBars(data,color,w,h){const gap=3,n=data.length;const bw=(w-gap*(n-1))/n;const max=Math.max(...data,1);return data.map((v,i)=>{const bh=(v/max)*h;const x=i*(bw+gap),y=h-bh;return`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}" opacity=".9"/>`;}).join('');}
function buildMicroSpline(data,color,w,h){const min=Math.min(...data),max=Math.max(...data),range=max-min||1;const pad=4;const pts=data.map((v,i)=>({x:(i/(data.length-1))*w,y:pad+((max-v)/range)*(h-pad*2)}));let d=`M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;for(let i=0;i<pts.length-1;i++){const cp=(pts[i].x+pts[i+1].x)/2;d+=` C${cp.toFixed(1)} ${pts[i].y.toFixed(1)} ${cp.toFixed(1)} ${pts[i+1].y.toFixed(1)} ${pts[i+1].x.toFixed(1)} ${pts[i+1].y.toFixed(1)}`;}const last=pts[pts.length-1];return`<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/><circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3" fill="${color}"/>`;}
function buildMicroDots(data,color,w,h){const cols=10,rows=Math.ceil(data.length/cols);const ds=Math.min((w-3*(cols-1))/cols,(h-3*(rows-1))/rows);return data.slice(0,cols*rows).map((on,idx)=>{const col=idx%cols,row=Math.floor(idx/cols);const cx=col*(ds+3)+ds/2,cy=row*(ds+3)+ds/2;return`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(ds/2).toFixed(1)}" fill="${on?color:'var(--divider)'}" opacity="${on?1:.5}"/>`;}).join('');}
function clampPercent(n){return Math.max(0,Math.min(100,Math.round(Number(n||0))));}
function getFinishedTrainingSessionIds(){
  if(!clientData || !clientTrainingProgram) return new Set();

  const finished = new Set();
  const visibleSessionIds = getVisibleSessionIdSet();

  // 1) Progreso real guardado en Supabase.
  // Cuenta solo las sesiones visibles de la semana actual,
  // pero permite que el log venga de una asignación anterior del mismo programa.
  (clientSessionLogs || [])
    .filter(log =>
      isFinishedTrainingLog(log) &&
      logBelongsToActiveProgramHistory(log) &&
      log.session_id &&
      visibleSessionIds.has(String(log.session_id))
    )
    .forEach(log => {
      finished.add(String(log.session_id));
    });

  // 2) Respaldo local del navegador para la asignación activa.
  const prefix = ['ab_tp', clientData.id, clientTrainingAssignment?.id].join('_');

  try{
    for(let i = 0; i < localStorage.length; i++){
      const key = localStorage.key(i);

      if(!key || !key.startsWith(prefix)) continue;

      const raw = localStorage.getItem(key);
      if(!raw) continue;

      const d = JSON.parse(raw);

      if(
        d?.is_finished === true &&
        d?.session_id &&
        visibleSessionIds.has(String(d.session_id))
      ){
        finished.add(String(d.session_id));
      }
    }
  }catch{}

  return finished;
}

function getTrainingProgressStats(){
  const totalSessions = clientTrainingSessions.length || 0;
  const finishedIds = getFinishedTrainingSessionIds();
  const finishedSessions = finishedIds.size;

  const percent = totalSessions > 0
    ? clampPercent((finishedSessions / totalSessions) * 100)
    : 0;

  return {
    totalSessions,
    finishedSessions,
    percent,
    finishedIds
  };
}

) +

(extraHTML || '') +

'<div class="home-ring-note ' + (isConstancia ? 'home-ring-note-constancia' : '') + '">' + note + '</div>' +
