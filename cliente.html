<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AB SYSTEM — Área Cliente</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- SECURITY: Enable Supabase RLS on all tables before publishing. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy:#020B18; --navy2:#061427; --navy3:#0D1E30; --navy4:#132236;
      --red:#E20613; --blue:#5EC5F0; --white:#F5F9FF;
      --gray:#8A9BB0; --green:#22c55e; --yellow:#f59e0b; --wa:#25D366;
      --font-title:'Bebas Neue',sans-serif;
      --font-body:'DM Sans',sans-serif;
      --font-mono:'Space Mono',monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--navy);color:var(--white);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer;border:none;outline:none;font-family:var(--font-body)}
    input,textarea{outline:none;font-family:var(--font-body)}
    .hidden{display:none!important}

    /* ─── LOADING ─── */
    #loadingOverlay{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999}
    .spinner{width:40px;height:40px;border:3px solid #1a2e44;border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #loadingOverlay p{color:var(--gray);font-size:13px}

    /* ─── LOGIN ─── */
    #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(ellipse at 60% 0%,#0d1e3080 0%,transparent 60%),var(--navy)}
    .login-box{width:100%;max-width:400px;background:var(--navy2);border:1px solid #1a2e44;border-radius:16px;padding:40px 32px 36px}
    .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
    .login-logo .logo-badge{width:44px;height:44px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:20px;color:var(--white)}
    .login-logo .logo-text{font-family:var(--font-title);font-size:22px;letter-spacing:2px}
    .login-logo .logo-text span{color:var(--red)}
    .login-title{font-family:var(--font-title);font-size:30px;letter-spacing:2px;margin-bottom:6px}
    .login-sub{font-size:13px;color:var(--gray);margin-bottom:28px}
    .field-group{margin-bottom:16px}
    .field-group label{display:block;font-size:11px;font-family:var(--font-mono);letter-spacing:1px;color:var(--gray);text-transform:uppercase;margin-bottom:6px}
    .field-group input{width:100%;background:var(--navy3);border:1px solid #1e3450;border-radius:8px;padding:12px 14px;color:var(--white);font-size:15px;transition:border-color .2s}
    .field-group input:focus{border-color:var(--blue)}
    .field-group input::placeholder{color:#3a5068}
    .btn-login{width:100%;background:var(--red);color:var(--white);border-radius:8px;padding:13px;font-size:15px;font-weight:700;letter-spacing:.5px;transition:opacity .2s,transform .1s;margin-top:4px}
    .btn-login:hover{opacity:.88}
    .btn-login:active{transform:scale(.98)}
    .btn-wa-login{width:100%;background:transparent;border:1px solid #1e3450;color:var(--gray);border-radius:8px;padding:11px;font-size:13px;margin-top:12px;transition:border-color .2s,color .2s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-wa-login:hover{border-color:var(--wa);color:var(--wa)}
    .login-error{background:#2a0608;border:1px solid var(--red);color:#f87171;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
    .login-info{background:rgba(94,197,240,.06);border:1px solid rgba(94,197,240,.2);color:var(--blue);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}

    /* ─── DASHBOARD ─── */
    #dashboardScreen{min-height:100vh}

    /* Header */
    .dash-header{background:var(--navy2);border-bottom:1px solid #1a2e44;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .dash-header-logo{display:flex;align-items:center;gap:9px}
    .dash-header-logo .logo-badge{width:32px;height:32px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:15px;color:var(--white)}
    .dash-header-logo .logo-text{font-family:var(--font-title);font-size:17px;letter-spacing:2px}
    .dash-header-logo .logo-text span{color:var(--red)}
    .dash-header-actions{display:flex;align-items:center;gap:8px}
    .btn-icon{background:transparent;border:1px solid #1e3450;color:var(--gray);border-radius:7px;padding:7px 12px;font-size:12px;display:flex;align-items:center;gap:6px;transition:border-color .2s,color .2s,background .2s}
    .btn-icon:hover{border-color:var(--blue);color:var(--blue)}
    .btn-icon.red:hover{border-color:var(--red);color:var(--red)}
    #btnHeaderWA{border-color:var(--wa);color:var(--wa);background:rgba(37,211,102,.07)}
    #btnHeaderWA:hover{color:#fff;background:var(--wa)}

    /* Tab navigation */
    .client-nav{background:var(--navy2);border-bottom:1px solid #1a2e44;position:sticky;top:56px;z-index:90;display:flex;overflow-x:auto;gap:4px;padding:8px 14px;scrollbar-width:none;-ms-overflow-style:none}
    .client-nav::-webkit-scrollbar{display:none}
    .client-nav button{flex:0 0 auto;background:transparent;color:var(--gray);border:1px solid transparent;border-radius:8px;padding:8px 14px;font-family:var(--font-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;transition:color .15s,border-color .15s,background .15s}
    .client-nav button:hover{color:var(--blue)}
    .client-nav button.active{color:var(--blue);border-color:rgba(94,197,240,.35);background:rgba(94,197,240,.07)}

    /* Main content */
    .dash-main{max-width:740px;margin:0 auto;padding:22px 16px calc(140px + env(safe-area-inset-bottom))}

    /* Sections */
    .section{background:var(--navy2);border:1px solid #1a2e44;border-radius:14px;overflow:hidden;animation:sectionFade .18s ease}
    @keyframes sectionFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .section-hidden{display:none!important}
    .section-header{padding:16px 20px;border-bottom:1px solid #1a2e44;display:flex;align-items:center;justify-content:space-between}
    .section-header h2{font-family:var(--font-title);font-size:20px;letter-spacing:2px}
    .section-header .sec-badge{font-size:10px;font-family:var(--font-mono);background:var(--navy3);border:1px solid #1e3450;color:var(--gray);padding:3px 8px;border-radius:4px}
    .section-body{padding:18px 20px}
    .empty-state{color:var(--gray);font-size:13px;font-style:italic;padding:8px 0;line-height:1.7}

    /* Data cards (reservas, pagos, salud) */
    .data-card{background:var(--navy3);border:1px solid #1e3450;border-radius:10px;padding:14px 16px;margin-bottom:10px}
    .data-card:last-child{margin-bottom:0}
    .data-card.next-session{border-color:var(--blue);background:rgba(94,197,240,.05)}
    .data-card .dc-row{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:4px}
    .data-card .dc-title{font-weight:700;font-size:14px;color:var(--white)}
    .data-card .dc-sub{font-size:12px;color:var(--gray);font-family:var(--font-mono)}
    .data-card .dc-note{font-size:12px;color:var(--gray);margin-top:6px;font-style:italic}
    .next-label{font-size:10px;font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
    .action-box{margin-top:16px;display:grid;gap:10px}
    .client-action-btn{width:100%;background:rgba(94,197,240,.07);border:1px solid rgba(94,197,240,.35);color:var(--blue);border-radius:10px;padding:12px 14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
    .client-action-btn:hover{background:rgba(94,197,240,.12)}
    .client-action-btn.wa{border-color:rgba(37,211,102,.45);color:var(--wa);background:rgba(37,211,102,.07)}

    /* Badges */
    .badge{display:inline-block;font-size:10px;font-family:var(--font-mono);padding:2px 8px;border-radius:4px;letter-spacing:.5px;font-weight:700}
    .badge-green{background:#052512;color:var(--green);border:1px solid var(--green)}
    .badge-yellow{background:#1f1400;color:var(--yellow);border:1px solid var(--yellow)}
    .badge-red{background:#2a0608;color:#f87171;border:1px solid var(--red)}
    .badge-blue{background:#031b2a;color:var(--blue);border:1px solid var(--blue)}
    .badge-gray{background:#0d1e30;color:var(--gray);border:1px solid #2a3e52}

    /* Plan grid */
    .plan-grid{display:grid;gap:14px 16px;grid-template-columns:1fr 1fr}
    .plan-item .pi-label{font-size:10px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:1px;color:var(--gray);margin-bottom:3px}
    .plan-item .pi-value{font-size:14px;color:var(--white);font-weight:500}
    .plan-item.full{grid-column:1/-1}
    .plan-divider{grid-column:1/-1;border:none;border-top:1px solid #1e3450;margin:4px 0}
    .plan-no-program{background:var(--navy3);border:1px dashed #1e3450;border-radius:10px;padding:16px;color:var(--gray);font-size:13px;font-style:italic;line-height:1.6;margin-top:4px}

    /* Progress circles */
    .progress-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
    .progress-circle-card{background:var(--navy3);border:1px solid #1e3450;border-radius:12px;padding:16px 12px;text-align:center}
    .progress-ring{width:88px;height:88px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) calc(var(--p)*1%),#17283b 0);position:relative}
    .progress-ring::before{content:'';position:absolute;width:66px;height:66px;background:var(--navy3);border-radius:50%}
    .progress-ring span{position:relative;z-index:1;font-family:var(--font-title);font-size:22px;color:var(--white)}
    .progress-circle-label{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:3px}
    .progress-circle-value{font-size:13px;color:var(--white);font-weight:700}
    .progress-circle-note{font-size:11px;color:var(--gray);margin-top:3px}

    /* Notes */
    .note-item{background:var(--navy3);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:12px 14px;font-size:14px;color:var(--white);margin-bottom:8px;line-height:1.6}
    .note-item:last-child{margin-bottom:0}

    /* Accordion */
    .accordion-block{background:var(--navy3);border:1px solid #1e3450;border-radius:12px;margin-bottom:10px;overflow:hidden}
    .accordion-block:last-child{margin-bottom:0}
    .accordion-title{width:100%;background:transparent;color:var(--white);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase}
    .accordion-title span:first-child{color:var(--blue)}
    .accordion-symbol{color:var(--gray);font-size:18px;line-height:1;flex-shrink:0}
    .accordion-content{display:none;padding:0 16px 16px;border-top:1px solid rgba(255,255,255,.06)}
    .accordion-block.open .accordion-content{display:block}
    .accordion-block.open .accordion-title{background:rgba(94,197,240,.05)}

    /* ═══════════════════════════════════════════════════════
       TRAINING GUIDE — identical to screenshot
    ═══════════════════════════════════════════════════════ */
    .training-guide-summary{background:var(--navy3);border-left:3px solid var(--red);border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:14px}
    .training-guide-title{font-family:var(--font-title);font-size:22px;letter-spacing:1px;color:var(--white);margin-bottom:3px}
    .training-guide-meta{font-family:var(--font-mono);font-size:10px;color:var(--gray);letter-spacing:.8px;margin-bottom:6px}
    .training-week-objective{font-size:13px;color:var(--gray);line-height:1.6;border-top:1px solid rgba(255,255,255,.06);padding-top:8px;margin-top:6px}
    .training-day-tabs{display:flex;gap:8px;overflow-x:auto;margin:12px 0 14px;padding-bottom:2px;scrollbar-width:none}
    .training-day-tabs::-webkit-scrollbar{display:none}
    .training-day-tab{flex:0 0 auto;background:var(--navy3);border:1px solid #1e3450;color:var(--gray);border-radius:8px;padding:8px 12px;font-family:var(--font-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
    .training-day-tab.active{color:var(--blue);border-color:rgba(94,197,240,.45);background:rgba(94,197,240,.08)}
    .training-day-panel{display:none}
    .training-day-panel.active{display:block}
    .training-session-panel{display:none}
.training-session-panel.active{display:block}
.training-week-panel{display:none}
.training-week-panel.active{display:block}
    .training-session-separator{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--blue);padding:12px 2px 4px}
    .training-step-list{display:flex;flex-direction:column;gap:8px}
    .training-step-card{background:var(--navy3);border:1px solid #1e3450;border-radius:12px;overflow:hidden;transition:border-color .2s}
    .training-step-card.open{border-color:rgba(94,197,240,.4)}
    .training-step-card.completed{border-color:rgba(34,197,94,.3)}
    .training-step-header{width:100%;background:transparent;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;transition:background .15s}
    .training-step-card.open .training-step-header{background:rgba(94,197,240,.05)}
    .training-step-card.completed .training-step-header{background:rgba(34,197,94,.04)}
    .training-step-number{flex-shrink:0;width:36px;height:36px;border-radius:8px;background:var(--navy2);border:1px solid #1e3450;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:20px;color:var(--white);transition:background .2s,color .2s,border-color .2s}
    .training-step-card.open .training-step-number{border-color:var(--blue);color:var(--blue)}
    .training-step-card.completed .training-step-number{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green);font-size:15px}
    .training-step-info{flex:1;min-width:0}
    .training-step-title{font-size:15px;font-weight:700;color:var(--white);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .training-step-meta{font-family:var(--font-mono);font-size:10px;color:var(--gray);margin-top:3px;letter-spacing:.5px}
    .training-step-status{flex-shrink:0;font-family:var(--font-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--gray);padding:3px 8px;border:1px solid #1e3450;border-radius:4px;white-space:nowrap}
    .training-step-status.done{color:var(--green);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
    .training-step-body{display:none;padding:0 16px 16px;border-top:1px solid rgba(255,255,255,.06)}
    .training-step-card.open .training-step-body{display:block}
    .training-step-objective{font-size:13px;color:var(--gray);line-height:1.6;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:12px}
    .training-exercise-card{background:var(--navy2);border:1px solid #1e3450;border-left:2px solid var(--blue);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:8px}
    .training-exercise-card:last-of-type{margin-bottom:0}
    .training-exercise-title{font-size:15px;font-weight:700;color:var(--white);margin-bottom:10px;line-height:1.3}
    .training-ex-num{font-family:var(--font-mono);font-size:11px;color:var(--blue);margin-right:4px}
    .training-exercise-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
    .training-mini-stat{background:var(--navy3);border:1px solid #1e3450;border-radius:8px;padding:8px 6px;text-align:center}
    .training-mini-label{font-family:var(--font-mono);font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:3px}
    .training-mini-value{font-family:var(--font-title);font-size:20px;color:var(--white);letter-spacing:.5px;line-height:1}
    .training-level-tag{display:inline-block;font-family:var(--font-mono);font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid #2a3e52;color:var(--gray);margin-bottom:8px}
    .training-instruction{font-size:14px;color:var(--white);line-height:1.7;margin-top:8px}
    .training-instruction strong{display:block;color:var(--blue);font-family:var(--font-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:400;margin-bottom:4px}
    .training-coach-note{font-size:13px;color:var(--gray);font-style:italic;line-height:1.6;margin-top:6px}
    .training-video-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:7px 12px;background:rgba(94,197,240,.08);border:1px solid rgba(94,197,240,.3);border-radius:8px;color:var(--blue);font-family:var(--font-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;transition:background .15s}
    .training-video-btn:hover{background:rgba(94,197,240,.16)}
    .training-complete-block-btn{width:100%;background:var(--green);color:#fff;border-radius:12px;padding:16px;font-size:16px;font-weight:700;letter-spacing:.3px;margin-top:16px;transition:opacity .2s}
    .training-complete-block-btn:hover{opacity:.88}
    .training-complete-block-btn:disabled{opacity:.5;cursor:default}
    .training-step-done-msg{text-align:center;color:var(--green);font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:12px 0 0}
    .training-finish-card{background:var(--navy3);border:1px solid rgba(34,197,94,.45);border-radius:14px;padding:28px 20px;margin-top:16px;text-align:center}
    .training-finish-card.compact{
  padding:18px 16px;
  margin-top:12px;
  text-align:left;
}

.training-finish-card.compact .training-finish-icon{
  font-size:24px;
  margin-bottom:6px;
}

.training-finish-card.compact .training-finish-title{
  font-size:22px;
  line-height:1.1;
  margin-bottom:6px;
}

.training-finish-card.compact .training-finish-sub{
  font-size:12px;
  margin-bottom:10px;
}

.training-finish-card.compact .training-notes-box{
  padding:14px;
  margin-top:10px;
}

.training-finish-card.compact .training-notes-title{
  font-size:17px;
}
    .training-finish-icon{font-size:40px;margin-bottom:10px}
    .training-finish-title{font-family:var(--font-title);font-size:28px;letter-spacing:2px;color:var(--white);margin-bottom:6px}
    .training-finish-sub{font-size:13px;color:var(--gray);line-height:1.6;margin-bottom:16px}
    .training-notes-box{background:var(--navy3);border:1px solid #1e3450;border-radius:14px;padding:20px;margin-top:12px}
    .training-notes-title{font-family:var(--font-title);font-size:20px;letter-spacing:1px;color:var(--white);margin-bottom:6px}
    .training-notes-sub{font-size:13px;color:var(--gray);margin-bottom:12px;line-height:1.6}
    .training-notes-textarea{width:100%;background:var(--navy2);border:1px solid #1e3450;border-radius:8px;padding:12px 14px;color:var(--white);font-size:14px;font-family:var(--font-body);line-height:1.6;resize:vertical;min-height:100px;margin-bottom:10px;display:block}
    .training-notes-textarea:focus{border-color:var(--blue);outline:none}
    .training-note-saved{color:var(--green);font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:8px 0}
    .training-session-completed-card{
  background:rgba(34,197,94,.06);
  border:1px solid rgba(34,197,94,.35);
  border-radius:14px;
  padding:16px;
  margin:10px 0 14px;
}

.training-session-completed-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.training-session-completed-icon{
  width:36px;
  height:36px;
  border-radius:8px;
  background:rgba(34,197,94,.12);
  border:1px solid var(--green);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  flex-shrink:0;
}

.training-session-completed-title{
  font-size:15px;
  font-weight:700;
  color:var(--white);
  line-height:1.3;
}

.training-session-completed-sub{
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--green);
  text-transform:uppercase;
  letter-spacing:.8px;
  margin-top:3px;
}
    
    /* Evaluaciones */
    .assessment-card{background:var(--navy3);border:1px solid #1e3450;border-radius:12px;margin-bottom:14px;overflow:hidden}
    .assessment-card-header{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;cursor:pointer}
    .assessment-card-title{font-family:var(--font-title);font-size:18px;letter-spacing:1px;color:var(--white);margin-bottom:3px}
    .assessment-card-meta{font-family:var(--font-mono);font-size:10px;color:var(--gray);letter-spacing:.6px}
    .assessment-card-body{display:none;padding:14px 16px}
    .assessment-card.open .assessment-card-body{display:block}
    .assessment-result-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
    .assessment-result-row:last-child{border-bottom:none}
    .assessment-ex-name{font-size:14px;font-weight:500;color:var(--white);margin-bottom:2px}
    .assessment-ex-meta{font-family:var(--font-mono);font-size:10px;color:var(--gray);letter-spacing:.5px}
    .assessment-ex-note{font-size:12px;color:var(--gray);margin-top:4px;font-style:italic}
    .assessment-result-val{font-family:var(--font-title);font-size:26px;line-height:1;color:var(--white);text-align:right;white-space:nowrap}
    .assessment-result-unit{font-family:var(--font-mono);font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;text-align:right;margin-top:2px}
    .mini-chart-wrap{background:rgba(94,197,240,.04);border:1px solid rgba(94,197,240,.12);border-radius:0 0 8px 8px;padding:10px 12px;margin-top:6px}
    .mini-chart-title{font-family:var(--font-mono);font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
    .mini-chart-labels{display:flex;justify-content:space-between;gap:4px;margin-top:4px}
    .mini-chart-label{font-family:var(--font-mono);font-size:9px;color:var(--gray);text-align:center;flex:1}

    /* Resumen */
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
    .summary-card{background:var(--navy3);border:1px solid #1e3450;border-radius:10px;padding:14px}
    .summary-card.full{grid-column:1/-1}
    .summary-label{font-family:var(--font-mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:4px}
    .summary-value{font-size:14px;color:var(--white);font-weight:500;line-height:1.4}
    .summary-value.big{font-family:var(--font-title);font-size:22px;letter-spacing:1px}
    .copy-summary-btn{width:100%;background:rgba(94,197,240,.07);border:1px solid rgba(94,197,240,.35);color:var(--blue);border-radius:10px;padding:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;margin-top:4px;transition:background .15s}
    .copy-summary-btn:hover{background:rgba(94,197,240,.14)}

    /* Responsive */
    @media(max-width:480px){
      .login-box{padding:28px 20px}
      .dash-header{padding:0 12px;height:52px}
      .dash-header-logo .logo-text{font-size:14px}
      .btn-icon .btn-label{display:none}
      .client-nav{top:52px;padding:8px 10px}
      .section-body{padding:14px}
      .section-header h2{font-size:17px}
      .plan-grid{grid-template-columns:1fr;gap:12px}
      .summary-grid{grid-template-columns:1fr}
      .dash-main{padding:16px 12px calc(160px + env(safe-area-inset-bottom))}
      .training-exercise-grid{grid-template-columns:repeat(2,1fr)}
      .training-mini-value{font-size:18px}
    }

/* Progress */

/* Mobile */

  .dash-header {

    border-radius:20px;
  }

  .client-action-btn {
    padding:14px;
  }
}

/* ══ LOCAL PROGRESS CACHE (per day) ══ */
function getTrainingStorageKey(sessionId) {
  if (!clientData || !clientTrainingAssignment) return null;

  const sid =
    sessionId ||
    getCurrentVisibleSessionId?.() ||
    'general';

  return ['ab_tp', clientData.id, clientTrainingAssignment.id, sid, todayISO()].join('_');
}

function isSessionFinished(sessionId) {
  const key = getTrainingStorageKey(sessionId);
  if (!key) return false;

  try {
    const raw = localStorage.getItem(key);
    if (!raw) return false;

    const data = JSON.parse(raw);
    return data?.is_finished === true;
  } catch {
    return false;
  }
}

function buildCompletedSessionCard(session, index) {
  const title = getSessionDisplayTitle(session, index);

  const week = clientTrainingWeeks.find(w =>
    String(w.id) === String(session.week_id)
  );

  const weekLabel = week?.week_number
    ? 'Semana ' + week.week_number
    : 'Semana';

  return (
    '<div class="training-session-completed-card">' +
      '<div class="training-session-completed-row">' +
        '<div class="training-session-completed-icon">✓</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="training-session-completed-title">Entrenamiento completado · v2</div>' +
          '<div class="training-session-completed-sub">' + title + ' · ' + weekLabel + '</div>' +
          '<div style="font-size:12px;color:var(--gray);margin-top:6px;line-height:1.5;">Tus observaciones ya fueron enviadas a Abel.</div>' +

      '<button class="client-action-btn" style="margin-top:14px;" onclick="toggleCompletedTrainingDetails()">Ver detalles del entrenamiento realizado</button>' +
    '</div>'
  );
}

function loadTrainingProgressLocal(sessionId) {
  const key = getTrainingStorageKey(sessionId);
  if (!key) return null;

  try {
    const r = localStorage.getItem(key);
    return r ? JSON.parse(r) : null;
  } catch {
    return null;
  }
}

function saveTrainingProgressLocal(extra, sessionId) {
  const key = getTrainingStorageKey(sessionId);
  if (!key) return;

  const prev = loadTrainingProgressLocal(sessionId) || {};

  localStorage.setItem(key, JSON.stringify({
    ...prev,
    session_id: sessionId || getCurrentVisibleSessionId(),
    completed_block_ids: Array.from(completedTrainingBlocks),
    is_finished: prev.is_finished || false,
    client_note: prev.client_note || '',
    client_feedback_tags: prev.client_feedback_tags || [],
    client_feedback_summary: prev.client_feedback_summary || '',
    updated_at: new Date().toISOString(),
    ...(extra || {})
  }));
}

function getLastActiveSessionKey() {
  if (!clientData || !clientTrainingAssignment) return null;
  return ['ab_last_session', clientData.id, clientTrainingAssignment.id].join('_');
}

function saveLastActiveSession(sessionId) {
  const key = getLastActiveSessionKey();
  if (!key || !sessionId) return;
  localStorage.setItem(key, String(sessionId));
}

function getLastActiveSession() {
  const key = getLastActiveSessionKey();
  if (!key) return null;
  return localStorage.getItem(key);
}

function getInitialActiveSessionId() {
  const saved = getLastActiveSession();

  if (saved && clientTrainingSessions.some(s => String(s.id) === String(saved))) {
    return String(saved);
  }

  const firstUnfinished = clientTrainingSessions.find(s => !isSessionFinished(String(s.id)));

  if (firstUnfinished) {
    return String(firstUnfinished.id);
  }

  return String(clientTrainingSessions[0]?.id || '');
}

/* ══ UTILITY ══ */
function normalizePhone(p) { return String(p).replace(/[\s\-\(\)\+]/g, ''); }
function openWA(msg) { window.open('https://wa.me/' + normalizePhone(WA_NUMBER) + '?text=' + encodeURIComponent(msg), '_blank'); }
function clientWA(text) { openWA('Hola Abel, soy ' + (clientData?.name || 'cliente') + '. ' + text); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function formatDate(d) {
  if (!d) return '—';
  try { const [y,m,day] = String(d).slice(0,10).split('-'); return day+'/'+m+'/'+y; } catch { return d; }
}
function formatTime(t) { return t ? String(t).slice(0,5) : ''; }
function formatMoney(amount, currency) {
  if (amount == null) return '—';
  const cur = (currency || 'EUR').toUpperCase();
  try { return new Intl.NumberFormat('es-ES', { style:'currency', currency: cur }).format(amount); }
  catch { return amount + ' ' + cur; }
}
function showError(msg) {

  if (!s) return '';
  const v = s.toLowerCase();
  if (['pagado','paid'].includes(v))       return '<span class="badge badge-green">'+s+'</span>';
  if (['pendiente','pending'].includes(v)) return '<span class="badge badge-yellow">'+s+'</span>';
  if (['vencido','overdue'].includes(v))   return '<span class="badge badge-red">'+s+'</span>';
  return '<span class="badge badge-gray">'+s+'</span>';
}
function genericBadge(s) {
  if (!s) return '';
  const v = s.toLowerCase();
  if (['activo','active','confirmada','confirmado','realizada','completado'].includes(v)) return '<span class="badge badge-green">'+s+'</span>';
  if (['pendiente','pending','reservada'].includes(v)) return '<span class="badge badge-yellow">'+s+'</span>';
  if (['cancelada','cancelado','vencido','inactivo'].includes(v)) return '<span class="badge badge-red">'+s+'</span>';
  return '<span class="badge badge-gray">'+s+'</span>';
}

/* ══ ASSIGNMENT SCOPE HELPERS ══ */
function getAssignmentScope() {
  const raw = String(clientTrainingAssignment?.assignment_scope || 'full')
    .trim()
    .toLowerCase();

  if (['day', 'dia', 'día', 'session', 'sesion', 'sesión'].includes(raw)) return 'day';
  if (['week', 'semana'].includes(raw)) return 'week';
  if (['month', 'mes'].includes(raw)) return 'month';
  if (['full', 'complete', 'completo', 'plan'].includes(raw)) return 'full';

  return 'full';
}
function getAssignmentScopeLabel() {
  const s = getAssignmentScope();
  if (s === 'day')   return clientTrainingAssignment?.commercial_label || 'Día asignado';
  if (s === 'week')  return clientTrainingAssignment?.commercial_label || 'Semana asignada';
  if (s === 'month') return clientTrainingAssignment?.commercial_label || 'Mes asignado';
  return clientTrainingAssignment?.commercial_label || 'Plan completo';
}

/**
 * Returns array of week_number values to load.
 * null = load all (full scope).
 */
function getAssignedWeekNumbers() {
  const scope = getAssignmentScope();
  if (scope === 'day' || scope === 'week') {
    const wn = Number(clientTrainingAssignment?.assigned_week || clientTrainingAssignment?.current_week || 1);
    return [wn];
  }
  if (scope === 'month') {
    const month = Number(clientTrainingAssignment?.assigned_month || 1);
    const start = (month - 1) * 4 + 1;
    return [start, start+1, start+2, start+3];
  }
  return null; // full = all weeks
}

function filterSessionsByScope(sessions) {
  const scope = getAssignmentScope();

  const num = Number(clientTrainingAssignment?.assigned_session_number || 1);

  return sessions.filter(s =>
    Number(s.session_number || s.order_index || 0) === num
  );
}

function getAssignedTrainingLevel() {
  const raw = clientTrainingAssignment?.assigned_level || clientTrainingProgram?.level || 'N1';
  const lvl = String(raw).trim().toUpperCase();
  return ['N1','N2','N3','N4'].includes(lvl) ? lvl : 'N1';
}
function getExerciseVariantByLevel(ex) {
  const lvl = getAssignedTrainingLevel();
  if (lvl === 'N1') return ex.variant_n1 || '';
  if (lvl === 'N2') return ex.variant_n2 || '';
  if (lvl === 'N3') return ex.variant_n3 || '';
  if (lvl === 'N4') return ex.variant_n4 || '';
  return ex.variant_n1 || '';
}

/* ══════════════════════════════════════════════════════════
   AUTH — uses Auth.js module
══════════════════════════════════════════════════════════ */
async function loginClient() {
  hideError();

  const phone = document.getElementById('inputPhone').value.trim();
  const code  = document.getElementById('inputCode').value.trim();

  if (!phone || !code) {
    showError('Completa los dos campos.');
    return;
  }

  showLoading(true);

  try {
    const { data, error } = await db.rpc('client_login_by_phone_code', {
      p_phone: phone,
      p_access_code: code
    });

    if (error) throw error;

    const found = Array.isArray(data) ? data[0] : null;

    if (!found) {
      showLoading(false);
      showError('Teléfono o código incorrecto.');
      return;
    }

    Auth.loginAsClient(found.id);

  } catch (err) {
    console.error('Login cliente error:', err);
    showLoading(false);
    showError('Error al validar acceso. Inténtalo de nuevo.');
  }
}

/* ══ BILINGUAL HELPER ══════════════════════════════════════
   pickLang(obj, base, lang)
   Busca en orden: obj[base_lang] (camelCase) → obj[base_lang] (snake_case) → obj[base_es] → obj[base]
══════════════════════════════════════════════════════════ */
function pickLang(obj, base, lang) {
  if (!obj) return '';
  const l = (lang || clientData?.preferred_lang || 'es').toLowerCase();

  // camelCase: nameEs, nameSr, titleEs, titleSr…
  const camelLang = base + l.charAt(0).toUpperCase() + l.slice(1);
  // snake_case: name_es, name_sr…
  const snakeLang = base + '_' + l;
  // fallback español camelCase y snake_case
  const camelEs   = base + 'Es';
  const snakeEs   = base + '_es';

  const val =
    obj[camelLang] ||
    obj[snakeLang] ||
    obj[camelEs]   ||
    obj[snakeEs]   ||
    obj[base]      ||
    '';

  return String(val).trim();
}

function getLang() {
  return (clientData?.preferred_lang || 'es').toLowerCase();
}

══════════════════════════════════════════════════════════ */

function getSessionDayLabel(session, index) {
  const num = Number(session.session_number || index + 1);
  // Usar solo el número de sesión, nunca el título (evita mezcla de idiomas)
  if (num === 1) return 'Día A';
  if (num === 2) return 'Día B';
  if (num === 3) return 'Día C';
  return 'Día ' + num;
}

function getSessionDisplayTitle(session, index) {
  const day = getSessionDayLabel(session, index);
  const lg = getLang();

  let title = '';

  if (lg === 'sr') {
    title = session.title_sr || session.title || '';
  } else {
    title = session.title_es || session.title || '';
  }

  title = String(title || '').trim();

  if (!title || title.toLowerCase() === day.toLowerCase()) return day;

  // Evita: Día B · Dan B...
  if (
    title.toLowerCase().startsWith('dan ') ||
    title.toLowerCase().startsWith('día ') ||
    title.toLowerCase().startsWith('dia ')
  ) {
    return title;
  }

  return day + ' · ' + title;
}

function buildTrainingSteps(sessionIdFilter) {
  const steps = [];
  const sessions = sessionIdFilter
    ? clientTrainingSessions.filter(s => String(s.id) === String(sessionIdFilter))
    : clientTrainingSessions;

  sessions.forEach(function(session, sIdx) {
    const realIdx = clientTrainingSessions.findIndex(s => String(s.id) === String(session.id));
    const blocks = clientTrainingBlocks
      .filter(b => b.session_id === session.id)
      .slice().sort((a,b) =>
  Number(a.block_order || a.order_number || a.order_index || 0) -
  Number(b.block_order || b.order_number || b.order_index || 0)
);

    blocks.forEach(function(block, bIdx) {
      const exercises = clientTrainingExercises
        .filter(e => e.block_id === block.id)
        .slice().sort((a,b) =>
  Number(a.exercise_order || a.order_number || a.order_index || 0) -
  Number(b.exercise_order || b.order_number || b.order_index || 0)
);

      steps.push({
        blockId: String(block.id),
        block, exercises,
        sessionId: String(session.id),
        session,
        sessionSeparator: bIdx === 0 ? getSessionDisplayTitle(session, realIdx >= 0 ? realIdx : sIdx) : null
      });
    });
  });
  return steps;
}

function getActiveTrainingWeek() {
  if (!clientTrainingAssignment) return null;

  const nums = getAssignedWeekNumbers();

  if (nums === null) {
    const currentWeek = Number(clientTrainingAssignment?.current_week || 1);
    return clientTrainingWeeks.find(w => Number(w.week_number) === currentWeek) || clientTrainingWeeks[0] || null;
  }

  return clientTrainingWeeks.find(w => Number(w.week_number) === nums[0]) || clientTrainingWeeks[0] || null;
}

/* client_session_logs — table used by admin */
async function loadOrCreateTrainingLog(sessionId) {
  if (!clientData || !clientTrainingAssignment || !clientTrainingProgram) return null;

  const sid = sessionId || getCurrentVisibleSessionId();
  if (!sid) return null;

  const localProgress = loadTrainingProgressLocal(sid);

  if (localProgress) {
    completedTrainingBlocks = new Set(localProgress.completed_block_ids || []);
    currentTrainingLog = { ...(currentTrainingLog || {}), ...localProgress };
  }

  const session = clientTrainingSessions.find(s => String(s.id) === String(sid));
  const week = session
    ? clientTrainingWeeks.find(w => String(w.id) === String(session.week_id))
    : getActiveTrainingWeek();

  const payload = {
    client_id: clientData.id,
    assignment_id: clientTrainingAssignment.id,
    program_id: clientTrainingProgram.id,
    week_id: week ? week.id : null,
    session_id: sid,
    training_date: todayISO()
  };

  try {
    const existing = await db.from('client_session_logs')
      .select('*')
      .eq('client_id', payload.client_id)
      .eq('assignment_id', payload.assignment_id)
      .eq('session_id', payload.session_id)
      .eq('training_date', payload.training_date)
      .maybeSingle();

    if (existing.error) {
      console.error('Log read error:', existing.error);
      return currentTrainingLog;
    }

    if (existing.data) {
      completedTrainingBlocks = new Set([
        ...(existing.data.completed_block_ids || []),
        ...(localProgress?.completed_block_ids || [])
      ]);

      currentTrainingLog = {
        ...existing.data,
        completed_block_ids: Array.from(completedTrainingBlocks),
        is_finished: existing.data.is_finished || localProgress?.is_finished || false,
        client_note: existing.data.client_note || localProgress?.client_note || '',
        client_feedback_tags: existing.data.client_feedback_tags || localProgress?.client_feedback_tags || [],
        client_feedback_summary: existing.data.client_feedback_summary || localProgress?.client_feedback_summary || ''
      };

      saveTrainingProgressLocal(currentTrainingLog, sid);
      return currentTrainingLog;
    }

    const created = await db.from('client_session_logs').insert({
      ...payload,
      completed_block_ids: Array.from(completedTrainingBlocks),
      is_finished: localProgress?.is_finished || false,
      client_note: localProgress?.client_note || '',
      client_feedback_tags: localProgress?.client_feedback_tags || [],
      client_feedback_summary: localProgress?.client_feedback_summary || '',
      started_at: new Date().toISOString()
    }).select().single();

    if (created.error) {
      console.error('Log create error:', created.error);
      return currentTrainingLog;
    }

    currentTrainingLog = created.data;
    saveTrainingProgressLocal(currentTrainingLog, sid);
    return currentTrainingLog;

  } catch (err) {
    console.error('Log general error:', err);
    return currentTrainingLog;
  }
}

async function saveTrainingProgress(extra, sessionId) {
  const sid = sessionId || getCurrentVisibleSessionId();

  saveTrainingProgressLocal(extra, sid);

  if (!currentTrainingLog?.id || String(currentTrainingLog.session_id) !== String(sid)) {
    await loadOrCreateTrainingLog(sid);
  }

  if (!currentTrainingLog?.id) {
    console.warn('No log ID — saved locally only');
    return;
  }

  const local = loadTrainingProgressLocal(sid) || {};

  try {
    const saved = await db.from('client_session_logs').update({
      completed_block_ids: Array.from(completedTrainingBlocks),
      is_finished: local.is_finished || false,
      client_note: local.client_note || null,
      client_feedback_tags: local.client_feedback_tags || extra?.client_feedback_tags || [],
      client_feedback_summary: local.client_feedback_summary || extra?.client_feedback_summary || null,
      updated_at: new Date().toISOString(),
      ...(extra || {})
    })
    .eq('id', currentTrainingLog.id)
    .select()
    .single();

    if (!saved.error) {
      currentTrainingLog = saved.data;
      saveTrainingProgressLocal(currentTrainingLog, sid);
    } else {
      console.error('Log save error:', saved.error);
    }

  } catch (err) {
    console.error('Log save error:', err);
  }
}

function buildTrainingStepHTML(step, index) {
  const blockId  = step.blockId;

  html += '<div class="training-step-card" id="step-' + blockId + '">'
    + '<button class="training-step-header" onclick="toggleTrainingStep(\'' + blockId + '\')">'
    + '<div class="training-step-number">' + blockNum + '</div>'
    + '<div class="training-step-info">'
    + '<div class="training-step-title">' + blockTitle + '</div>'
    + (metaP.length ? '<div class="training-step-meta">' + metaP.join(' · ') + '</div>' : '')
    + '</div>'
    + '<div class="training-step-status" id="status-' + blockId + '">Pendiente</div>'
    + '</button>'
    + '<div class="training-step-body">'
    + (blockObj ? '<div class="training-step-objective">' + blockObj + '</div>' : '');
  step.exercises.forEach(ex => { html += buildExerciseHTML(ex); });
  if (!step.exercises.length) html += '<p class="empty-state" style="margin-top:12px;">Este bloque todavía no tiene ejercicios registrados.</p>';
  html += '<button class="training-complete-block-btn" id="completeBtn-' + blockId + '" onclick="completeTrainingStep(\'' + blockId + '\')">Marcar bloque terminado</button>'
    + '</div></div>';
  return html;
}

function buildExerciseHTML(ex) {
  const lvl     = getAssignedTrainingLevel();
  const _lg     = getLang();

  // Variante por nivel con soporte bilingüe
  function pickVariant(ex, lvl, lang) {
    const l = (lang || 'es').toLowerCase();
    // variant_n3_sr / variant_n3_es (snake_case directo)
    if (ex['variant_' + lvl.toLowerCase() + '_' + l])
      return ex['variant_' + lvl.toLowerCase() + '_' + l];
    // variant_n3_es como fallback español
    if (ex['variant_' + lvl.toLowerCase() + '_es'])
      return ex['variant_' + lvl.toLowerCase() + '_es'];
    // variant_n3 campo base
    if (ex['variant_' + lvl.toLowerCase()])
      return ex['variant_' + lvl.toLowerCase()];
    return '';
  }

  const variant = pickVariant(ex, lvl, _lg);
  const exName  = pickLang(ex, 'name', _lg) || pickLang(ex, 'title', _lg) || 'Ejercicio';
  const exDesc  = pickLang(ex, 'description', _lg);
  const exNotes = pickLang(ex, 'coachingNotes', _lg) || pickLang(ex, 'coachNotes', _lg)
                || ex.coaching_notes || ex.coach_notes || '';

  const stats = [
    ex.sets ? { label:'Series',   value:ex.sets } : null,
    ex.reps ? { label:'Reps',     value:ex.reps } : null,
    (ex.time || ex.duration) ? { label:'Tiempo', value:(ex.time || ex.duration) } : null,
    ex.rest ? { label:'Descanso', value:ex.rest } : null
  ].filter(Boolean);

  let html = '<div class="training-exercise-card">'
    + '<div class="training-exercise-title">'
    + (ex.exercise_order ? '<span class="training-ex-num">' + ex.exercise_order + '.</span>' : '')
    + exName + '</div>';

  if (stats.length) {
    html += '<div class="training-exercise-grid">';
    stats.forEach(s => {
      html += '<div class="training-mini-stat"><span class="training-mini-label">' + s.label + '</span><div class="training-mini-value">' + s.value + '</div></div>';
    });
    html += '</div>';
  }

  html += '<div class="training-level-tag">Nivel ' + lvl + '</div>';
  if (variant) html += '<div class="training-instruction"><strong>Trabajo indicado</strong>' + variant + '</div>';
  if (exDesc)  html += '<div class="training-instruction"><strong>Cómo hacerlo</strong>' + exDesc + '</div>';
  if (exNotes) html += '<div class="training-coach-note">Coach: ' + exNotes + '</div>';
  if (ex.video_url) html += '<a href="' + ex.video_url + '" target="_blank" class="training-video-btn">&#9654; Ver referencia</a>';
  html += '</div>';
  return html;
}

function applySavedTrainingState() {

function markStepVisualAsCompleted(blockId) {
  const card = document.getElementById('step-' + blockId);
  if (!card) return;
  card.classList.remove('open');
  card.classList.add('completed');
  const numEl = card.querySelector('.training-step-number');
  if (numEl) numEl.textContent = '✓';
  const statusEl = document.getElementById('status-' + blockId);
  if (statusEl) { statusEl.textContent = 'Completado'; statusEl.classList.add('done'); }
  const btn = document.getElementById('completeBtn-' + blockId);
  if (btn) {
    const msg = document.createElement('div');
    msg.className = 'training-step-done-msg';
    msg.textContent = '✓ Bloque completado';
    btn.replaceWith(msg);
  }
}

function toggleTrainingStep(blockId) {
  const card = document.getElementById('step-' + blockId);
  if (!card) return;
  if (activeTrainingBlockKey === blockId) {
    card.classList.remove('open');
    activeTrainingBlockKey = null;
  } else {
    if (activeTrainingBlockKey) { document.getElementById('step-' + activeTrainingBlockKey)?.classList.remove('open'); }
    activeTrainingBlockKey = blockId;
    card.classList.add('open');
  }
}

function getSessionIdByBlockId(blockId) {
  const step = buildTrainingSteps().find(s => String(s.blockId) === String(blockId));
  return step ? String(step.sessionId) : null;
}

async function completeTrainingStep(blockId) {
  const sessionId = getSessionIdByBlockId(blockId);

  completedTrainingBlocks.add(blockId);

  saveTrainingProgressLocal({}, sessionId);
  markStepVisualAsCompleted(blockId);
  await saveTrainingProgress({}, sessionId);

  activeTrainingBlockKey = null;

  const sessionSteps = sessionId ? buildTrainingSteps(sessionId) : buildTrainingSteps();

  const sessionIsComplete =
    sessionSteps.length > 0 &&
    sessionSteps.every(s => completedTrainingBlocks.has(s.blockId));

  if (sessionIsComplete) {
    renderTrainingCompletionBox(false);
    return;
  }

  const next = sessionSteps.find(s => !completedTrainingBlocks.has(s.blockId));

  if (next) {
    activeTrainingBlockKey = next.blockId;
    const card = document.getElementById('step-' + next.blockId);

    if (card) {
      card.classList.add('open');
      setTimeout(() => {
        card.scrollIntoView({ behavior:'smooth', block:'start' });
      }, 180);
    }
  }
}

  return clientTrainingSessions[0]?.id || null;

function getSessionById(sessionId) {
  return clientTrainingSessions.find(s => String(s.id) === String(sessionId)) || null;
}

function getNextSessionId(currentSessionId) {
  const sessions = clientTrainingSessions.slice().sort((a, b) => {
    const wa = clientTrainingWeeks.find(w => String(w.id) === String(a.week_id));
    const wb = clientTrainingWeeks.find(w => String(w.id) === String(b.week_id));

    const weekA = Number(wa?.week_number || 0);
    const weekB = Number(wb?.week_number || 0);

    if (weekA !== weekB) return weekA - weekB;

    return Number(a.session_number || 0) - Number(b.session_number || 0);
  });

  const idx = sessions.findIndex(s => String(s.id) === String(currentSessionId));

  if (idx >= 0 && sessions[idx + 1]) {
    return String(sessions[idx + 1].id);
  }

  return null;
}

function getFirstAvailableSessionId() {
  const sessions = clientTrainingSessions.slice().sort((a, b) => {
    const wa = clientTrainingWeeks.find(w => String(w.id) === String(a.week_id));
    const wb = clientTrainingWeeks.find(w => String(w.id) === String(b.week_id));

    const weekA = Number(wa?.week_number || 0);
    const weekB = Number(wb?.week_number || 0);

    if (weekA !== weekB) return weekA - weekB;

    return Number(a.session_number || 0) - Number(b.session_number || 0);
  });

  const firstNotFinished = sessions.find(s => !isSessionFinished(String(s.id)));

  return String((firstNotFinished || sessions[0])?.id || '');
}

function getWeekIdBySessionId(sessionId) {
  const session = getSessionById(sessionId);
  return session ? String(session.week_id) : null;
}

        '<div class="training-finish-sub">' +
          (nextSessionId ? 'Pasando al siguiente día...' : 'Entrenamiento completado. Tus observaciones ya fueron enviadas a Abel.') +
        '</div>' +
      '</div>';
  }

  setTimeout(() => {
    if (!nextSessionId) {
      renderClientTraining();
      return;
    }

    saveLastActiveSession(nextSessionId);

    renderClientTraining().then(async () => {
      const nextWeekId = getWeekIdBySessionId(nextSessionId);

      if (nextWeekId) {
        showTrainingWeekPanel(nextWeekId);
      }

      await showTrainingDay(nextSessionId);
    });
  }, 3000);
}

  const sid = sessionId || getCurrentVisibleSessionId();
  const steps = sid ? buildTrainingSteps(sid) : buildTrainingSteps();

  return steps.length > 0 && steps.every(s => completedTrainingBlocks.has(s.blockId));

function buildMiniChart(pts) {
  if (!pts || pts.length < 2) return null;
  const vals = pts.map(d => d.value);
  const min = Math.min(...vals), max = Math.max(...vals), range = max - min || 1;
  const W=260, H=50, P=6;
  const mapped = pts.map((d,i) => ({
    x: P + (i/(pts.length-1))*(W-P*2),
    y: P + (H-P*2) - ((d.value-min)/range)*(H-P*2),
    date: d.date, value: d.value
  }));
  const line  = mapped.map(p => p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const area  = [mapped[0].x.toFixed(1)+','+(H-P).toFixed(1)].concat(mapped.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1))).concat([mapped[mapped.length-1].x.toFixed(1)+','+(H-P).toFixed(1)]).join(' ');
  const dots  = mapped.map(p=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="var(--blue)" stroke="var(--navy3)" stroke-width="1.5"/>').join('');
  const labs  = mapped.map(p=>'<span class="mini-chart-label">'+String(p.date||'').slice(5)+'<br>'+p.value+'</span>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" xmlns="http://www.w3.org/2000/svg" style="display:block"><polygon points="'+area+'" fill="rgba(94,197,240,0.08)"/><polyline points="'+line+'" fill="none" stroke="var(--blue)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg><div class="mini-chart-labels">'+labs+'</div>';
}

function buildExerciseHistory(exerciseName) {
  return clientAssessmentResults
    .filter(r => (r.exercise_name||'').trim().toLowerCase() === (exerciseName||'').trim().toLowerCase())
    .map(r => {
      const a = clientAssessments.find(x => x.id === r.assessment_id);
      return { date: a?.assessment_date||'', value: r.result_value, numValue: parseFloat(String(r.result_value||'').replace(',','.')) };
    })
    .filter(d => d.date)
    .sort((a,b) => String(a.date).localeCompare(String(b.date)));
}

function dLabel(d) { if(d==='higher_better')return'Mejor más alto';if(d==='lower_better')return'Mejor más bajo';return'Referencia'; }
function dColor(d) { if(d==='higher_better')return'var(--green)';if(d==='lower_better')return'#f87171';return'var(--gray)'; }

function renderAssessments() {
  const el    = document.getElementById('sectionAssessments');

  if (!clientAssessments.length) { el.innerHTML = '<p class="empty-state">Todavía no hay evaluaciones registradas.</p>'; return; }

  let html = '';
  clientAssessments.forEach(function(a) {
    const results = clientAssessmentResults.filter(r => r.assessment_id === a.id).sort((x,y) => Number(x.item_order||0) - Number(y.item_order||0));
    const sc = a.status === 'realizada' ? 'badge-green' : 'badge-gray';
    html += '<div class="assessment-card" id="ac-' + a.id + '">';
    html += '<div class="assessment-card-header" onclick="toggleAssessmentCard(\'' + a.id + '\')">';

    html += '<div class="assessment-card-meta">' + formatDate(a.assessment_date) + ' · ' + results.length + ' resultado' + (results.length!==1?'s':'') + '</div></div>';
    html += '<span class="badge ' + sc + '">' + (a.status || 'realizada') + '</span></div>';
    html += '<div class="assessment-card-body">';
    if (a.coach_notes) html += '<div style="font-size:13px;color:var(--gray);font-style:italic;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.06)">Coach: ' + a.coach_notes + '</div>';
    if (!results.length) {
      html += '<p class="empty-state">Sin resultados registrados.</p>';
    } else {
      results.forEach(function(r) {
        const isNum = r.result_value !== '' && r.result_value != null && !isNaN(parseFloat(String(r.result_value).replace(',','.')));
        const history = buildExerciseHistory(r.exercise_name);
        const numHist = history.filter(h => !isNaN(h.numValue));
        html += '<div class="assessment-result-row">';
        html += '<div style="flex:1;min-width:0"><div class="assessment-ex-name">' + (r.exercise_name||'—') + '</div>';
        html += '<div class="assessment-ex-meta">' + (r.metric_type||'') + (r.direction?' · <span style="color:'+dColor(r.direction)+'">'+dLabel(r.direction)+'</span>':'') + '</div>';
        if (r.note) html += '<div class="assessment-ex-note">✎ ' + r.note + '</div>';
        html += '</div><div style="text-align:right;flex-shrink:0"><div class="assessment-result-val">' + (r.result_value||'—') + '</div>';
        if (r.unit) html += '<div class="assessment-result-unit">' + r.unit + '</div>';
        html += '</div></div>';
        if (isNum && numHist.length >= 2) {
          const chart = buildMiniChart(numHist.map(h => ({ date:h.date, value:h.numValue })));
          if (chart) html += '<div class="mini-chart-wrap"><div class="mini-chart-title">Evolución · ' + (r.exercise_name||'') + '</div>' + chart + '</div>';
        }
      });
    }
    html += '</div></div>';
  });
  el.innerHTML = html;
}

  const badge = document.getElementById('progressCircleBadge');
  if (!el) return;
  if (!clientMetrics.length) { if(badge)badge.textContent='0'; el.innerHTML='<p class="empty-state">Todavía no hay métricas suficientes para mostrar progreso visual.</p>'; return; }
  const grouped = {};
  clientMetrics.forEach(m => { const k=String(m.type||'Métrica').trim(); if(!grouped[k])grouped[k]=[]; grouped[k].push({value:m.value,unit:m.unit,numericValue:Number(m.value||0),dateKey:String(m.date||'').slice(0,10)}); });
  const circles = Object.keys(grouped).map(type => {
    const list=grouped[type].slice().sort((a,b)=>String(b.dateKey).localeCompare(String(a.dateKey)));
    const latest=list[0],first=list[list.length-1];
    const current=Number(latest.numericValue||0),start=Number(first.numericValue||0);
    let percent=0,note='';
    const t=type.toLowerCase();
    if(t.includes('peso')){const diff=start-current;percent=Math.round(Math.min(100,Math.max(0,(diff/Math.max(Math.abs(start*.05),1))*100)));note=diff>0?'Bajó '+Math.abs(diff).toFixed(1)+' '+(latest.unit||'kg'):diff<0?'Subió '+Math.abs(diff).toFixed(1)+' '+(latest.unit||'kg'):'Sin cambio todavía';}
    else if(t.includes('asistencia')||t.includes('adherencia')||t.includes('%')){percent=Math.round(Math.min(100,Math.max(0,current)));note=percent+'% registrado';}
    else if(['fuerza','movilidad','resistencia'].some(k=>t.includes(k))){percent=Math.round(Math.min(100,Math.max(0,(current/10)*100)));note=current+'/10';}
    else{if(start>0){const d2=current-start;percent=Math.round(Math.min(100,Math.max(0,(current/start)*100)));note=d2>=0?'+'+d2.toFixed(1)+' desde inicio':d2.toFixed(1)+' desde inicio';}else{percent=Math.round(Math.min(100,Math.max(0,current)));note='Último registro';}}
    return {type,current,unit:latest.unit||'',percent,note};
  });
  if(badge)badge.textContent=circles.length;
  el.innerHTML='<div class="progress-grid">'+circles.map(c=>'<div class="progress-circle-card"><div class="progress-ring" style="--p:'+c.percent+'"><span>'+c.percent+'%</span></div><div class="progress-circle-label">'+c.type+'</div><div class="progress-circle-value">'+c.current+(c.unit?' '+c.unit:'')+'</div><div class="progress-circle-note">'+c.note+'</div></div>').join('')+'</div>';
}

function renderSummary() {
  const el = document.getElementById('sectionSummary');
  if (!el) return;
  const today = todayISO();
  const nextRes = clientReservations.find(r => String(r.date).slice(0,10) >= today && !['cancelada','cancelado'].includes((r.status||'').toLowerCase()));
  const lastAss = clientAssessments[0] || null;
  const hasPending = clientPayments.some(p => ['pendiente','vencido'].includes((p.status||'').toLowerCase()));
  const hasOverdue = clientPayments.some(p => p.status === 'vencido');
  const payStatus  = hasOverdue ? 'Vencido' : hasPending ? 'Pendiente' : 'Al día';
  const payClass   = hasOverdue ? 'badge-red' : hasPending ? 'badge-yellow' : 'badge-green';

  let rawNotes = clientData.notes, lastNote = '';
  if (rawNotes && rawNotes !== '[]' && rawNotes !== 'null') {
    if (Array.isArray(rawNotes) && rawNotes.length) lastNote = typeof rawNotes[0]==='string'?rawNotes[0]:(rawNotes[0].text||'');
    else if (typeof rawNotes === 'string') { try { const p=JSON.parse(rawNotes); if(Array.isArray(p)&&p.length)lastNote=typeof p[0]==='string'?p[0]:(p[0].text||''); }catch{} }
  }

  let html = '<div class="summary-grid">';
  html += '<div class="summary-card full"><div class="summary-label">Cliente</div><div class="summary-value big">'+(clientData.name||'—')+'</div></div>';
  html += '<div class="summary-card"><div class="summary-label">Plan</div><div class="summary-value">'+(clientData.plan||'—')+'</div></div>';
  html += '<div class="summary-card"><div class="summary-label">Estado</div><div class="summary-value">'+(clientData.status||'—')+'</div></div>';
  html += '<div class="summary-card"><div class="summary-label">Programa activo</div><div class="summary-value">'+(clientTrainingProgram?.name||clientPrograms[0]?.name||'—')+'</div></div>';
  html += '<div class="summary-card"><div class="summary-label">Alcance</div><div class="summary-value">'+(clientTrainingAssignment?getAssignmentScopeLabel():'—')+'</div></div>';
  html += '<div class="summary-card"><div class="summary-label">Próxima sesión</div><div class="summary-value">'+(nextRes?formatDate(nextRes.date)+(nextRes.time?' · '+formatTime(nextRes.time):''):'Sin reservas')+'</div></div>';
  html += '<div class="summary-card"><div class="summary-label">Pagos</div><div class="summary-value"><span class="badge '+payClass+'">'+payStatus+'</span></div></div>';
  html += '<div class="summary-card"><div class="summary-label">Tests realizados</div><div class="summary-value">'+clientAssessments.length+'</div></div>';
  html += '<div class="summary-card"><div class="summary-label">Métricas registradas</div><div class="summary-value">'+clientMetrics.length+'</div></div>';
  if (lastAss) html += '<div class="summary-card full"><div class="summary-label">Última evaluación</div><div class="summary-value">'+(lastAss.assessment_name||'Test')+' · '+formatDate(lastAss.assessment_date)+'</div></div>';
  if (lastNote) html += '<div class="summary-card full"><div class="summary-label">Última nota del coach</div><div class="summary-value" style="font-style:italic;color:var(--gray)">'+lastNote+'</div></div>';
  html += '</div>';
  html += '<button class="copy-summary-btn" onclick="copySummaryToClipboard()">Copiar resumen al portapapeles</button>';
  el.innerHTML = html;
}

function copySummaryToClipboard() {
  const today = todayISO();
  const nextRes = clientReservations.find(r => String(r.date).slice(0,10) >= today && !['cancelada','cancelado'].includes((r.status||'').toLowerCase()));
  const lastAss = clientAssessments[0] || null;
  const hasPending = clientPayments.some(p => ['pendiente','vencido'].includes((p.status||'').toLowerCase()));
  const hasOverdue = clientPayments.some(p => p.status === 'vencido');
  const payStatus  = hasOverdue ? 'Vencido' : hasPending ? 'Pendiente' : 'Al día';
  let rawNotes = clientData.notes, lastNote = '';
  if (rawNotes && rawNotes !== '[]') {
    if (Array.isArray(rawNotes) && rawNotes.length) lastNote = typeof rawNotes[0]==='string'?rawNotes[0]:(rawNotes[0].text||'');
    else if (typeof rawNotes === 'string') { try { const p=JSON.parse(rawNotes); if(Array.isArray(p)&&p.length)lastNote=typeof p[0]==='string'?p[0]:(p[0].text||''); }catch{} }
  }
  const text = [
    'Resumen AB Coach',
    'Cliente: '+(clientData.name||'—'),
    'Plan: '+(clientData.plan||'—'),
    'Entrenamiento: '+(clientTrainingProgram?.name||clientPrograms[0]?.name||'—'),
    'Alcance: '+(clientTrainingAssignment?getAssignmentScopeLabel():'—'),
    'Nivel: '+(clientTrainingAssignment?.assigned_level||'—'),
    'Próxima sesión: '+(nextRes?formatDate(nextRes.date)+(nextRes.time?' a las '+formatTime(nextRes.time):''):'Sin reservas'),
    'Última evaluación: '+(lastAss?(lastAss.assessment_name||'Test')+' · '+formatDate(lastAss.assessment_date):'—'),
    'Pagos: '+payStatus,
    lastNote?'Notas: '+lastNote:''
  ].filter(Boolean).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-summary-btn');
    if (btn) { btn.textContent='✓ Copiado'; setTimeout(()=>{btn.textContent='Copiar resumen al portapapeles';},2000); }
  }).catch(() => { alert('No se pudo copiar.'); });
}

    + '</div></div></div>'
    + '<div class="accordion-block"><button class="accordion-title" onclick="toggleAccordion(this)"><span>Resumen del proceso</span><span class="accordion-symbol">+</span></button>'
    + '<div class="accordion-content"><div class="plan-grid" style="margin-top:12px;">'
    + '<div class="plan-item"><div class="pi-label">Reservas registradas</div><div class="pi-value">'+totalRes+'</div></div>'
    + '<div class="plan-item"><div class="pi-label">Sesiones realizadas</div><div class="pi-value">'+completedRes+'</div></div>'
    + '<div class="plan-item"><div class="pi-label">Pagos pendientes</div><div class="pi-value">'+pendingPay+'</div></div>'
    + '<div class="plan-item"><div class="pi-label">Última métrica</div><div class="pi-value">'+(lastMetric?(lastMetric.type||'Métrica')+': '+lastMetric.value+(lastMetric.unit?' '+lastMetric.unit:''):'Sin métricas')+'</div></div>'
    + '</div></div></div>';
}

/* ══ NAVIGATION ══ */
function goClientSection(sectionId) {
  document.querySelectorAll('.dash-main .section').forEach(s => s.classList.add('section-hidden'));
  const target = document.getElementById(sectionId);
  if (!target) return;
  target.classList.remove('section-hidden');
  document.querySelectorAll('.client-nav button').forEach(b => b.classList.remove('active'));
  const activeBtn = Array.from(document.querySelectorAll('.client-nav button')).find(b => b.getAttribute('onclick')?.includes(sectionId));
  if (activeBtn) { activeBtn.classList.add('active'); activeBtn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' }); }
  window.scrollTo({ top:0, behavior:'smooth' });
}

function toggleAccordion(button) {
  const block = button.closest('.accordion-block');
  if (!block) return;
  const symbol = block.querySelector('.accordion-symbol');
  const isOpen = block.classList.contains('open');
  block.classList.toggle('open', !isOpen);
  if (symbol) symbol.textContent = isOpen ? '+' : '−';
}

document.getElementById('btnLogout')?.addEventListener('click', () => Auth.logout());

  document.getElementById(id)?.addEventListener('keydown', e => { if (e.key === 'Enter') loginClient(); });
});

/* ══════════════════════════════════════════════════════════
   INIT — Auth.js session check
══════════════════════════════════════════════════════════ */
(async function init() {
  const params = new URLSearchParams(location.search);
  if (params.has('auth') || params.has('logged_out')) {
    history.replaceState({}, '', location.pathname);
  }

  /* Direct-access link: cliente.html?client=UUID */
const urlClientId = params.get('client');
if (urlClientId) {
  await loadClientDashboard(urlClientId);
  return;
}

  /* Active client session */
  if (Auth.isClient()) {
    await loadClientDashboard(Auth.getClientId());
    return;
  }

  /* Admin viewing as client */
  if (Auth.isAdmin()) {
    showLoading(false);
    document.getElementById('loginScreen')?.classList.remove('hidden');
    showInfo('Eres admin. Introduce las credenciales de un cliente para verlo.');
    return;
  }

  /* No session */
  showLoading(false);
  document.getElementById('loginScreen')?.classList.remove('hidden');
})();
</script>
