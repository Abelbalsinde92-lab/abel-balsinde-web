let currentPage='dashboard', selectedClient='carlos', currentFilter='todos', tab='Resumen', reserveView='lista'

function renderNav(){
  const html=navGroups.map(g=>`<div class="side-section">${g[0]}</div>${g[1].map(i=>`<a class="nav-link ${currentPage===i[0]?'active':''}" onclick="nav('${i[0]}')"><span class="nav-ico">${i[2]}</span>${i[1]}${i[3]?`<span class="nav-badge">${i[3]}</span>`:''}</a>`).join('')}`).join('')

}

 if(currentPage==='salud') return m.innerHTML=salud()
 if(currentPage==='progreso') return m.innerHTML=progreso()
 if(currentPage==='whatsapp') return m.innerHTML=whatsappPage()
 if(currentPage==='partners') return m.innerHTML=partnersPage()
 if(currentPage==='ajustes') return m.innerHTML=ajustes()
}

 return `<section class="page active">${pageHead('Hola, Abel','Resumen operativo · '+new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),

 <div class="quick"><button onclick="nav('clientes')"><b>02</b><span>Clientes</span></button><button onclick="nav('programas')"><b>03</b><span>Crear plan</span></button><button onclick="nav('reservas')"><b>04</b><span>Reservas</span></button><button onclick="nav('whatsapp')"><b>WA</b><span>WhatsApp</span></button></div>

 <div class="panel"><div class="panel-head"><span class="panel-title">Alertas importantes</span>${badge('alerta')}</div><div class="no-pad">${alertItem('red','Ana García','Pago de Plan Performance vencido hace 5 días','Vencido el 03/05/2025')}${alertItem('amber','David Torres','Resultado médico pendiente antes de empezar','Solicitado el 29/04/2025')}${alertItem('blue','Carlos Martínez','Check-in semanal sin recibir','Pendiente desde el lunes')}</div></div></div>

function paymentsTable(rows){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Cliente</th><th>Concepto</th><th>Importe</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody>${rows.map(p=>{let c=client(p.client);return `<tr><td><div class="client-cell">${av(c)}<span class="client-name">${c.name}</span></div></td><td>${p.concept}</td><td class="money">${p.amount}€</td><td>${p.due}</td><td>${badge(p.status)}</td><td><button class="btn btn-wa btn-sm" onclick="openWA('${c.phone}','Hola ${c.name.split(' ')[0]}, te recuerdo que tienes pendiente el pago de ${p.concept}.')">WA</button></td></tr>`}).join('')}</tbody></table></div>`}

function mini(v,l,t=''){return `<div class="mini"><b class="${t}">${v}</b><span>${l}</span></div>`}
function profileTab(c){
 if(tab==='Resumen')return `<div class="two">${panel('Datos personales',`<div class="info-grid">${info('Teléfono',c.phone)}${info('Email',c.email)}${info('Ciudad',c.city)}${info('Edad',c.age+' años')}${info('Estado',badge(c.status))}${info('Plan',c.plan)}</div>`)}${panel('Última nota del coach',`<div class="notice">Semana sólida. Mantener ritmo, controlar descanso y revisar movilidad antes de subir carga.</div>`)}</div>`
 if(tab==='Plan'){let p=programs.find(x=>x.assigned===c.name)||programs[0];return panel('Plan asignado',`<div class="info-grid">${info('Nombre',p.name)}${info('Tipo',p.type)}${info('Nivel',p.level)}${info('Duración',p.duration)}${info('Días/semana',p.days)}${info('Estado',badge(p.status))}</div><div class="panel-body">${(p.blocks.length?p.blocks:[['Bloque base','Evaluación, movilidad, fuerza general','45 min']]).map(b=>`<div class="card" style="padding:.8rem;margin:.5rem 0"><b>${b[0]}</b><p class="client-meta">${b[1]}</p><span class="blue">${b[2]}</span></div>`).join('')}</div>`)}
 if(tab==='Reservas')return reservationsTable(reservations.filter(r=>r.client===c.id))

 if(tab==='Salud')return healthCard(c)
 if(tab==='Progreso')return progresoTable(c)
 if(tab==='Notas')return panel('Notas del coach',`<div class="notice">Registrar observaciones internas, ajustes técnicos y seguimiento semanal.</div><button class="btn btn-outline btn-sm">+ Nota</button>`)
 return panel('Archivos',`<div class="notice">Documentos médicos, fotos de progreso, PDFs o archivos del cliente aparecerán aquí.</div><button class="btn btn-outline btn-sm">Subir documento</button>`)
}

function progresoTable(c){return panel('Registros de progreso',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Métrica</th><th>Inicial</th><th>Actual</th><th>Cambio</th><th>Nota</th></tr></thead><tbody><tr><td>06/05</td><td>Peso</td><td>81 kg</td><td class="money">${c.metrics.weight} kg</td><td class="green">▼ 3 kg</td><td>Buena semana</td></tr><tr><td>06/05</td><td>Fuerza</td><td>5.0</td><td class="money">${c.metrics.strength}</td><td class="green">▲ 2.5</td><td>Subir carga</td></tr><tr><td>06/05</td><td>Movilidad</td><td>4.5</td><td class="money">${c.metrics.mobility}</td><td class="blue">▲ 1.5</td><td>Revisar cadera</td></tr></tbody></table></div>`)
}
function progreso(){return `<section class="page active">${pageHead('Progreso','Evolución, métricas y comparación por periodos',`<button class="btn btn-red" onclick="openModal('Registrar métrica')">+ Registrar métrica</button>`)}<div class="filters">${['Todos','Peso','Cintura','Fuerza','Resistencia','Movilidad','Asistencia','Cumplimiento'].map((f,i)=>`<button class="chip ${i===0?'active':''}">${f}</button>`).join('')}</div><div class="panel"><div class="panel-head"><span class="panel-title">Gráfico simple · Carlos Martínez</span><button class="btn btn-outline btn-sm">Enviar resumen WA</button></div><div class="panel-body"><div style="height:220px;display:flex;align-items:flex-end;gap:12px;border-left:1px solid var(--border2);border-bottom:1px solid var(--border2);padding:1rem">${[55,68,74,83,76,88].map((h,i)=>`<div style="height:${h}%;width:42px;background:${i%2?'var(--red)':'var(--blue)'};opacity:.75"></div>`).join('')}</div></div></div>${progresoTable(client('carlos'))}</section>`}
function whatsappPage(){return `<section class="page active">${pageHead('Mensajes / WhatsApp','Centro de plantillas y contacto directo')}<div class="notice">WhatsApp es el canal operativo principal. Estas plantillas generan mensajes prellenados para abrir WhatsApp directamente.</div><div class="two"><div><div class="subtitle" style="margin-bottom:.8rem">Plantillas rápidas</div>${templates.map(t=>`<div class="wa-template"><div class="wa-title">${t[1]}</div><div class="wa-msg">${t[2]}</div><div class="wa-actions"><select id="sel-${t[0]}">${clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select><button class="btn btn-wa btn-sm" onclick="sendTemplate('${t[0]}')">Abrir WA</button><button class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText('${t[2].replaceAll("'","\\'")}');toast('Mensaje copiado')">Copiar</button></div></div>`).join('')}</div><div><div class="subtitle" style="margin-bottom:.8rem">Contacto directo</div><div class="panel"><div class="no-pad">${clients.map(c=>`<div class="item" onclick="openWA('${c.phone}','Hola ${c.name.split(' ')[0]}, ')">${av(c)}<div class="item-main"><div class="item-title">${c.name}</div><div class="item-sub">${c.plan} · ${c.phone}</div></div><button class="btn btn-wa btn-sm">WA</button></div>`).join('')}</div></div>${panel('Mensaje libre',`<div class="field"><label>Cliente</label><select id="freeClient">${clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="field"><label>Mensaje</label><textarea id="freeMsg" placeholder="Escribe el mensaje aquí…"></textarea></div><button class="btn btn-wa" onclick="sendFree()">Abrir WhatsApp</button>`)}</div></div></section>`}
function partnersPage(){return `<section class="page active">${pageHead('Partners / Recomendaciones','Negocios y recomendaciones para clientes',`<button class="btn btn-red" onclick="openModal('Agregar partner')">+ Agregar partner</button>`)}<div class="two">${partners.map(p=>`<div class="card" style="padding:1rem"><div style="display:flex;justify-content:space-between;gap:1rem"><div><div class="title" style="font-size:1.5rem">${p.name}</div><div class="client-meta">${p.cat}</div></div>${badge(p.status)}</div><p class="client-meta"><b>Qué comprar:</b> ${p.buy}</p><p class="client-meta"><b>Beneficio:</b> ${p.benefit}</p><p class="client-meta"><b>Ubicación:</b> ${p.location}</p><p class="client-meta"><b>Visible en index:</b> ${p.visible}</p><div class="actions"><button class="btn btn-outline btn-sm">Editar</button><button class="btn btn-blue btn-sm">Asignar</button><button class="btn btn-wa btn-sm">Enviar WA</button></div></div>`).join('')}</div></section>`}
function ajustes(){return `<section class="page active">${pageHead('Ajustes','Perfil del coach, sistema, index público y textos legales',`<button class="btn btn-red" onclick="toast('Configuración guardada')">Guardar configuración</button>`)}<div class="two">${panel('Perfil del coach',fields([['Nombre','Abel Balsinde'],['Email','abel@abcoach.com'],['Teléfono / WhatsApp',coach.displayPhone],['Ciudad','Belgrado'],['Descripción corta','Entrenador certificado UWW Level 2. Diploma Federal. Preparación personal con bases de lucha cubana.']]))}${panel('Sistema',fields([['Moneda','EUR — Euro'],['Zona horaria','Europe/Belgrade'],['Idioma principal','Español'],['Web pública','abcoach.com'],['Notificaciones','WhatsApp + alertas internas']]))}</div><div class="two">${panel('Información pública para index',fields([['Título hero','Preparación personal con bases de lucha cubana'],['WhatsApp público',coach.displayPhone],['Redes','@abelcoach'],['Sobre Abel','Más de 20 años ligado al deporte, la lucha y la preparación física.']]))}${panel('Textos de responsabilidad',fields([['Nutrición','Orientación deportiva general. No sustituye consejo médico ni nutricional profesional.'],['Salud','La información de salud registrada es solo para adaptar el entrenamiento. No sustituye evaluación médica profesional.'],['Responsabilidad general','El cliente asume la responsabilidad de informar cualquier condición médica relevante antes de iniciar el programa.']]))}</div></section>`}
function fields(arr){return arr.map(([l,v])=>`<div class="field"><label>${l}</label>${v.length>60?`<textarea>${v}</textarea>`:`<input value="${v}">`}</div>`).join('')}
function searchClient(e){e.preventDefault();let q=$('globalSearch').value.toLowerCase();let found=clients.find(c=>[c.name,c.email,c.phone,c.plan,c.status].join(' ').toLowerCase().includes(q));if(found){selectedClient=found.id;tab='Resumen';nav('perfil')}else toast('No encontré ese cliente')}
function sendTemplate(type){let id=$('sel-'+type).value,c=client(id),msg={sesion:`Hola ${c.name.split(' ')[0]}, te recuerdo tu sesión de hoy a las 09:00. Nos vemos.`,pago:`Hola ${c.name.split(' ')[0]}, te recuerdo que tienes pendiente el pago de Plan ${c.plan}. Gracias.`,salud:`Hola ${c.name.split(' ')[0]}, antes de avanzar con el plan necesito que me envíes el resultado médico o chequeo pendiente.`,medidas:`Hola ${c.name.split(' ')[0]}, cuando puedas, envíame tu peso actualizado y las medidas acordadas para revisar el progreso.`,plan:`Hola ${c.name.split(' ')[0]}, te dejo la indicación del plan de esta semana. Revísalo y dime si tienes alguna duda.`}[type];openWA(c.phone,msg)}
function sendFree(){let c=client($('freeClient').value),msg=$('freeMsg').value.trim();if(!msg)return toast('Escribe un mensaje');openWA(c.phone,msg)}
function openModal(title){$('modalTitle').textContent=title;$('modalBody').innerHTML=`<div class="field"><label>Nombre / concepto</label><input placeholder="${title}"></div><div class="field"><label>Detalle</label><textarea placeholder="Información interna"></textarea></div>`;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}function saveModal(){closeModal();toast('Guardado correctamente')}
function openDrawer(){$('drawer').classList.add('open')}function closeDrawer(){$('drawer').classList.remove('open')}
renderNav();renderPage()
</script>
</body>
</html>
