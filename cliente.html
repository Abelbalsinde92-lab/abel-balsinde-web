function buildConstanciaSegments(done, total = 3) {
  const completed = Math.max(0, Math.min(total, Number(done || 0)));

  let html = '<div class="constancia-segments">';

  for (let i = 1; i <= total; i++) {
    html +=
      '<span class="constancia-segment ' +
      (i <= completed ? 'done' : '') +
      '"></span>';
  }

  html += '</div>';

  return html;
}

function getHealthHomeState(){
  const totalAlerts = Number(clientAlerts.length || 0);

  if(totalAlerts <= 0){
    return {
      value: 'OK',
      unit: '',
      note: uiText('noActiveIndications'),
      color: 'var(--streak)'
    };
  }

  if(totalAlerts === 1){
    return {
      value: '1',
      unit: '',
      note: uiText('pendingIndication'),
      color: 'var(--warn)'
    };
  }

  return {
    value: String(totalAlerts),
    unit: '',
    note: uiText('activeIndications'),
    color: 'var(--medical)'
  };
}

function buildHomeProgressRings(){
  const progressStats = getTrainingProgressStats();

  const finishedSessions = progressStats.finishedSessions;
  const totalSessions = progressStats.totalSessions || 0;
  const planPct = progressStats.percent;

  const historicalLogs = getFinishedTrainingLogsAllProgram();
  const historicalFinishedCount = historicalLogs.length;
  const lastFinishedDate = getLastFinishedTrainingDate();

  const healthState = getHealthHomeState();

  const barData = [
    40, 65, 55, 80, 70, 90, 60, 75, 85, 95, 50, clampPercent(planPct)
  ];

  const splineData = clientAlerts.length > 0
    ? [72, 78, 74, 80, 76, 82, 79, 85, 88, 83, 77, 81]
    : [60, 61, 60, 62, 61, 60, 61, 60, 62, 61, 60, 61];

  const advanceLabel = getLang() === 'sr'
    ? 'Napredak nedelje'
    : 'Avance semanal';

  const advanceNote = totalSessions > 0
    ? finishedSessions + ' ' + uiText('of') + ' ' + totalSessions + ' sesiones esta semana'
    : uiText('noTrainingVisible');

  const constanciaValue = '';

const constanciaNote = historicalFinishedCount > 0
  ? (
      historicalFinishedCount + ' sesiones' +
      (lastFinishedDate ? ' · ' + formatDate(lastFinishedDate) : '')
    )
  : 'Sin sesiones cerradas todavía';

  const card1 = buildHomeRing_v2(
    advanceLabel,
    planPct + '%',
    '',
    buildMicroBars(barData, 'var(--sport)', 100, 40),
    advanceNote,
    'var(--sport)',
    'section-training'
  );

  const card2 = buildHomeRing_v2(
    uiText('health'),
    healthState.value,
    healthState.unit,
    buildMicroSpline(splineData, healthState.color, 100, 40),
    healthState.note,
    healthState.color,
    'section-health'
  );

  const card3 = buildHomeRing_v2(
  uiText('consistency'),
  constanciaValue,
  '',
  '',
  constanciaNote,
  'var(--sport)',
  'section-training',
  buildConstanciaSegments(historicalFinishedCount, 3)
);

  return '<div class="home-rings-grid">' + card1 + card2 + card3 + '</div>';
}

async function uploadAvatar(file) {
  if (!file || !clientData?.id) return;

  const btn = document.getElementById('avatarUploadBtn');
  if (btn) { btn.textContent = getLang() === 'sr' ? 'Čuvanje...' : 'Guardando...'; btn.disabled = true; }

  try {
    const ext = file.name.split('.').pop().toLowerCase();
    const allowed = ['jpg', 'jpeg', 'png', 'webp'];
    if (!allowed.includes(ext)) {
      showClientNotice(getLang() === 'sr' ? 'Solo JPG, PNG o WEBP' : 'Solo JPG, PNG o WEBP', 'error');
      if (btn) { btn.textContent = getLang() === 'sr' ? 'Promeni foto' : 'Cambiar foto'; btn.disabled = false; }
      return;
    }

    const reader = new FileReader();
    reader.onload = async (e) => {
      const base64 = e.target.result;

      const { error } = await db
        .from('clients')
        .update({ avatar_url: base64 })
        .eq('id', clientData.id);

      if (error) throw error;

      clientData.avatar_url = base64;
      showClientNotice(getLang() === 'sr' ? 'Foto sačuvana' : 'Foto guardada', 'success');
      refreshAvatarEverywhere();

      if (btn) { btn.textContent = getLang() === 'sr' ? 'Promeni foto' : 'Cambiar foto'; btn.disabled = false; }
    };
    reader.readAsDataURL(file);

  } catch (err) {
    console.error('Avatar upload error:', err);
    showClientNotice(getLang() === 'sr' ? 'Error al guardar foto' : 'Error al guardar foto', 'error');
    if (btn) { btn.textContent = getLang() === 'sr' ? 'Promeni foto' : 'Cambiar foto'; btn.disabled = false; }
  }
}

function daysBetweenISO(fromISO, toISO) {
  if (!fromISO || !toISO) return null;

  const from = new Date(String(fromISO).slice(0, 10) + 'T00:00:00');
  const to = new Date(String(toISO).slice(0, 10) + 'T00:00:00');

  if (isNaN(from.getTime()) || isNaN(to.getTime())) return null;

  const diff = to.getTime() - from.getTime();

  return Math.max(0, Math.floor(diff / 86400000));
}

function getLastFinishedTrainingDate() {
  let dates = [];

  // Historial real del programa, aunque venga de asignaciones anteriores.
  getFinishedTrainingLogsAllProgram().forEach(log => {
    const d =
      log.training_date ||
      String(log.finished_at || '').slice(0, 10) ||
      String(log.completed_at || '').slice(0, 10) ||
      String(log.updated_at || '').slice(0, 10);

    if (d) dates.push(String(d).slice(0, 10));
  });

  // Respaldo local solo de la asignación activa.
  if (clientData && clientTrainingAssignment) {
    const prefix = ['ab_tp', clientData.id, clientTrainingAssignment.id].join('_');

    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);

        if (!key || !key.startsWith(prefix)) continue;

        const raw = localStorage.getItem(key);
        if (!raw) continue;

        const data = JSON.parse(raw);

        if (data?.is_finished === true) {
          const d =
            String(data.finished_at || '').slice(0, 10) ||
            String(data.updated_at || '').slice(0, 10);

          if (d) dates.push(d);
        }
      }
    } catch {}
  }

  dates = dates
    .filter(Boolean)
    .sort((a, b) => String(b).localeCompare(String(a)));

  return dates[0] || null;
}

function getSessionDayLabel(session,index){
  const num = Number(session.session_number || index + 1);

  if(num === 1) return tClient('dayA');
  if(num === 2) return tClient('dayB');
  if(num === 3) return tClient('dayC');

  return tClient('day') + ' ' + num;
}

function getSessionDisplayTitle(session,index){
  const day = getSessionDayLabel(session,index);
  const lg = getLang();

  let title = session.title || '';

  title = String(title || '').trim();

  if(!title || title.toLowerCase() === day.toLowerCase()) return day;

  if(
    title.toLowerCase().startsWith('dan ') ||
    title.toLowerCase().startsWith('día ') ||
    title.toLowerCase().startsWith('dia ')
  ){
    return title;
  }

  return day + ' · ' + title;
}

function showTrainingDay(sessionId) {
  saveLastActiveSession(sessionId);

  const trainingRoot = document.getElementById('sectionTrainingClient');

  if (trainingRoot) {
    const oldAdaptedCard = trainingRoot.querySelector('#adaptedPlanCard');

    if (oldAdaptedCard) {
      const newCardHTML = buildClientAdaptedSessionCard(sessionId);
      if (newCardHTML) {
        oldAdaptedCard.outerHTML = newCardHTML;
      }
    }
  }

  const btn = document.querySelector('.training-day-tab[data-session-id="' + sessionId + '"]');
  const scope = btn?.closest('.training-week-panel') || document;

  scope.querySelectorAll('.training-day-tab').forEach(b => {
    if (!String(b.dataset.weekId || '').length) {
      b.classList.toggle('active', String(b.dataset.sessionId) === String(sessionId));
    }
  });

  scope.querySelectorAll('.training-session-panel,.training-day-panel').forEach(p => {
    if (p.dataset.sessionId) {
      p.classList.toggle('active', String(p.dataset.sessionId) === String(sessionId));
    }
  });

  // Recargar estado visual SOLO para esta sesión, sin tocar Supabase
  reloadSessionState(sessionId);

  const area = document.getElementById('trainingCompletionArea');
  if (area) area.innerHTML = '';

  // Mostrar completion box si la sesión está terminada o todos sus bloques completos
  const sessionFinished = isSessionFinished(sessionId);
  const sessionSteps = buildTrainingSteps(sessionId);
  const allBlocksDone = sessionSteps.length > 0 &&
    sessionSteps.every(s => completedTrainingBlocks.has(s.blockId));

  if (sessionFinished) {
    renderTrainingCompletionBox(false);
  } else if (allBlocksDone) {
    renderTrainingCompletionBox(false);
  }
}

function reloadSessionState(sessionId) {
  // Limpiar estado global
  completedTrainingBlocks = new Set();
  activeTrainingBlockKey = null;
  // NO tocamos currentTrainingLog aquí, no creamos logs

  // Cargar solo desde localStorage para esta sesión concreta
  const local = loadTrainingProgressLocal(sessionId);
  if (local && Array.isArray(local.completed_block_ids)) {
    local.completed_block_ids.forEach(id => completedTrainingBlocks.add(id));
  }

  // También cargar bloques completados desde Supabase (clientSessionLogs ya cargado)
  const dbLog = (clientSessionLogs || []).find(log =>
    String(log.assignment_id) === String(clientTrainingAssignment?.id) &&
    String(log.session_id) === String(sessionId)
  );
  if (dbLog && Array.isArray(dbLog.completed_block_ids)) {
    dbLog.completed_block_ids.forEach(id => completedTrainingBlocks.add(id));
  }

  // Aplicar estado visual SOLO a los bloques de esta sesión
  applySessionTrainingState(sessionId);

  // Abrir el primer bloque pendiente de esta sesión
  if (!isSessionFinished(sessionId)) {
    const sessionSteps = buildTrainingSteps(sessionId);
    const firstPending = sessionSteps.find(s => !completedTrainingBlocks.has(s.blockId));
    if (firstPending) {
      activeTrainingBlockKey = firstPending.blockId;
      const card = document.getElementById('step-' + firstPending.blockId);
      if (card) card.classList.add('open');
    }
  }
}

function buildTrainingSteps(sessionIdFilter){
  const steps = [];
  const sessions = sessionIdFilter
    ? clientTrainingSessions.filter(s => String(s.id) === String(sessionIdFilter))
    : clientTrainingSessions;

  sessions.forEach((session,sIdx) => {
    const realIdx = clientTrainingSessions.findIndex(s => String(s.id) === String(session.id));

    const blocks = clientTrainingBlocks
      .filter(b => b.session_id === session.id)
      .slice()
      .sort((a,b) => Number(a.block_order || 0) - Number(b.block_order || 0));

    blocks.forEach((block,bIdx) => {
      const exercises = clientTrainingExercises
        .filter(e => e.block_id === block.id)
        .slice()
        .sort((a,b) => Number(a.exercise_order || 0) - Number(b.exercise_order || 0));

      steps.push({
        blockId: String(block.id),
        block,
        exercises,
        sessionId: String(session.id),
        session,
        sessionSeparator: bIdx === 0
          ? getSessionDisplayTitle(session, realIdx >= 0 ? realIdx : sIdx)
          : null
      });
    });
  });

  return steps;
}

async function loadOrCreateTrainingLog(sessionId){
  if(!clientData || !clientTrainingAssignment || !clientTrainingProgram) return null;

  const sid = sessionId || getCurrentVisibleSessionId();
  if(!sid) return null;

  const localProgress = loadTrainingProgressLocal(sid);

  if(localProgress){
    completedTrainingBlocks = new Set(localProgress.completed_block_ids || []);
    currentTrainingLog = { ...(currentTrainingLog || {}), ...localProgress };
  }

  const session = clientTrainingSessions.find(s => String(s.id) === String(sid));
  const week = session
    ? clientTrainingWeeks.find(w => String(w.id) === String(session.week_id))
    : getActiveTrainingWeek();

  const payload = {
    client_id: clientData.id,
    assignment_id: clientTrainingAssignment.id,
    program_id: clientTrainingProgram.id,
    week_id: week ? week.id : null,
    session_id: sid,
    training_date: todayISO()
  };

  if (!payload.assignment_id || !payload.client_id || !payload.session_id || !payload.training_date) {
    console.error('Missing required training log payload fields', payload);
    return null;
  }

  try{
    const existing = await db
  .from('client_session_logs')
  .select('*')
  .eq('client_id', payload.client_id)
  .eq('assignment_id', payload.assignment_id)
  .eq('session_id', payload.session_id)
  .eq('training_date', payload.training_date)
  .order('updated_at', { ascending: false, nullsFirst: false })
  .limit(1)
  .maybeSingle();

    if(existing.error){
      console.error('Log read error:', existing.error);
      return currentTrainingLog;
    }

    if(existing.data){
      completedTrainingBlocks = new Set([
        ...(existing.data.completed_block_ids || []),
        ...(localProgress?.completed_block_ids || [])
      ]);

      currentTrainingLog = {
        ...existing.data,
        completed_block_ids: Array.from(completedTrainingBlocks),
        is_finished: existing.data.is_finished || localProgress?.is_finished || false,
        client_note: existing.data.client_note || localProgress?.client_note || '',
        client_feedback_tags: existing.data.client_feedback_tags || localProgress?.client_feedback_tags || [],
        client_feedback_summary: existing.data.client_feedback_summary || localProgress?.client_feedback_summary || ''
      };

      saveTrainingProgressLocal(currentTrainingLog, sid);
      return currentTrainingLog;
    }

    const created = await db
  .from('client_session_logs')
  .upsert({
    ...payload,
    status: 'iniciada',
    completed_at: null,
    finished_at: null,
    completed_block_ids: Array.from(completedTrainingBlocks),
    is_finished: localProgress?.is_finished || false,
    client_note: localProgress?.client_note || '',
    client_feedback_tags: localProgress?.client_feedback_tags || [],
    client_feedback_summary: localProgress?.client_feedback_summary || '',
    started_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  }, {

    onConflict: 'client_id,assignment_id,session_id,training_date'
  })
  .select()
  .single();

    if(created.error){
      console.error('Log create error:', created.error);
      return currentTrainingLog;
    }

    currentTrainingLog = created.data;
    saveTrainingProgressLocal(currentTrainingLog, sid);
    return currentTrainingLog;

  }catch(err){
    console.error('Log error:', err);
    return currentTrainingLog;
  }
}

async function saveTrainingProgress(extra,sessionId){
  const sid = sessionId || getCurrentVisibleSessionId();

  saveTrainingProgressLocal(extra, sid);

  if(!currentTrainingLog?.id || String(currentTrainingLog.session_id) !== String(sid)){
    await loadOrCreateTrainingLog(sid);
  }

  if(!currentTrainingLog?.id){
    console.warn('No log ID');
    return;
  }

  const local = loadTrainingProgressLocal(sid) || {};

  try{
    const saved = await db
      .from('client_session_logs')
      .update({
        completed_block_ids: Array.from(completedTrainingBlocks),
        is_finished: local.is_finished || false,
        client_note: local.client_note || null,
        client_feedback_tags: local.client_feedback_tags || extra?.client_feedback_tags || [],
        client_feedback_summary: local.client_feedback_summary || extra?.client_feedback_summary || null,
        updated_at: new Date().toISOString(),
        ...(extra || {})
      })
      .eq('id', currentTrainingLog.id)
      .select()
      .single();

    if(!saved.error){
      currentTrainingLog = saved.data;
      saveTrainingProgressLocal(currentTrainingLog, sid);
    } else {
      console.error('Log save error:', saved.error);
    }
  }catch(err){
    console.error('Log save error:', err);
  }
}

function getSessionDifficultyInfo(sessionId) {
  const session = getSessionById(sessionId);

  if (!session) {
    return {
      key: 'medium',
      label: getLang() === 'sr' ? 'Srednje' : 'Media',
      short: getLang() === 'sr' ? 'Sesija sa umerenim opterećenjem.' : 'Sesión con carga moderada.'
    };
  }

  const difficulty = Number(session.difficulty_level || 0);
  const intensity = Number(session.intensity_level || 0);

  const score = Math.max(difficulty, intensity);

  if (score <= 2) {
    return {
      key: 'easy',
      label: getLang() === 'sr' ? 'Lako' : 'Fácil',
      short: getLang() === 'sr'
        ? 'Trening je kontrolisan. Fokus je na tehnici, ritmu i dobrom osećaju.'
        : 'Entrenamiento controlado. Prioridad: técnica, ritmo y buenas sensaciones.'
    };
  }

  if (score === 3) {
    return {
      key: 'medium',
      label: getLang() === 'sr' ? 'Srednje' : 'Media',
      short: getLang() === 'sr'
        ? 'Trening ima srednje opterećenje. Radi stabilno, bez žurbe.'
        : 'Entrenamiento de carga media. Trabaja estable, sin prisas.'
    };
  }

  if (score === 4) {
    return {
      key: 'intense',
      label: getLang() === 'sr' ? 'Intenzivno' : 'Intenso',
      short: getLang() === 'sr'
        ? 'Trening zahteva više energije. Kontroliši disanje i odmore.'
        : 'Entrenamiento exigente. Controla respiración, descansos y técnica.'
    };
  }

  return {
    key: 'very-intense',
    label: getLang() === 'sr' ? 'Vrlo intenzivno' : 'Muy intenso',
    short: getLang() === 'sr'
      ? 'Visoko opterećenje. Ako se pojavi bol ili jak umor, zaustavi se i obavesti Abela.'
      : 'Carga alta. Si aparece dolor o fatiga excesiva, detente y avisa a Abel.'
  };
}

function normalizeAdaptationText(value) {
  return String(value || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

function adaptationArray(value) {
  return Array.isArray(value) ? value : [];
}

function getAdaptationText(a) {
  return normalizeAdaptationText([
    a.adaptation_summary,
    a.coach_warning,
    a.technique_priority,
    a.breathing_priority,
    a.volume_adjustment,
    a.impact_adjustment,
    a.load_adjustment,
    a.cardio_adjustment,
    ...adaptationArray(a.reason_tags),
    ...adaptationArray(a.adaptation_focus)
  ].filter(Boolean).join(' '));
}

function getSessionOrderIndex(sessionId) {
  return clientTrainingSessions.findIndex(s =>
    String(s.id) === String(sessionId)
  );
}

function adaptationAppliesToSession(a, sessionId) {
  if (!a) return false;

  const status = String(a.status || 'activo').toLowerCase();

  const isActive =
    status === 'activo' ||
    status === 'active';

  const notNormalized =
    !a.normalized_at &&
    status !== 'normalizado' &&
    status !== 'normalized' &&
    status !== 'cerrado' &&
    status !== 'closed' &&
    status !== 'inactivo' &&
    status !== 'inactive';

  const dateOk =
    !a.applies_until ||
    String(a.applies_until).slice(0, 10) >= todayISO();

  if (!isActive || !notNormalized || !dateOk) return false;

  if (!sessionId) return true;

  if (a.session_id && String(a.session_id) === String(sessionId)) {
    return true;
  }

  if (a.apply_to_following_sessions === false) {
    return false;
  }

  // Si la adaptación viene de una semana anterior y esa sesión ya no está visible,
  // seguimos aplicándola porque está marcada como activa para sesiones siguientes.
  if (!a.session_id) return true;

  const sourceIndex = getSessionOrderIndex(a.session_id);
  const targetIndex = getSessionOrderIndex(sessionId);

  if (sourceIndex === -1) return true;
  if (targetIndex === -1) return true;

  return targetIndex >= sourceIndex;
}

function getActiveAdaptationsForSession(sessionId) {
  if (!Array.isArray(clientActiveTrainingAdaptations)) return [];

  return clientActiveTrainingAdaptations.filter(a =>
    adaptationAppliesToSession(a, sessionId)
  );
}

function mergeExerciseNotes(originalNote, extraNotes) {
  const parts = [];

  if (originalNote) parts.push(String(originalNote).trim());

  extraNotes.forEach(n => {
    const clean = String(n || '').trim();
    if (clean && !parts.includes(clean)) parts.push(clean);
  });

  return parts.join(' ');
}

function getExerciseWithActiveAdaptation(ex) {
  if (!ex) return ex;

  const sessionId = getSessionIdByBlockId(ex.block_id);
  const activeAdaptations = getActiveAdaptationsForSession(sessionId);

  if (!activeAdaptations.length) return ex;

  const exerciseText = normalizeAdaptationText([
    ex.name,
    ex.description,
    ex.client_variant,
    ex.variant_n1,
    ex.variant_n2,
    ex.variant_n3,
    ex.variant_n4,
    ex.coaching_notes
  ].filter(Boolean).join(' '));

  const adaptationText = activeAdaptations
    .map(getAdaptationText)
    .join(' ');

  const hasKneeCare =
    adaptationText.includes('rodilla') ||
    adaptationText.includes('knee');

  const noJog =
    adaptationText.includes('no_trote') ||
    adaptationText.includes('no trote') ||
    adaptationText.includes('no correr') ||
    adaptationText.includes('sin trote');

  const noImpact =
    adaptationText.includes('sin_impacto') ||
    adaptationText.includes('sin impacto') ||
    adaptationText.includes('no saltos') ||
    adaptationText.includes('no realizar saltos');

  const reduceVolume =
    adaptationText.includes('reducir') ||
    adaptationText.includes('bajar volumen') ||
    adaptationText.includes('volumen reducir');

  const keepLoad =
    adaptationText.includes('no_subir_carga') ||
    adaptationText.includes('no subir carga') ||
    adaptationText.includes('carga mantener') ||
    adaptationText.includes('mantener nivel');

  const observeBreathing =
    adaptationText.includes('respiracion') ||
    adaptationText.includes('breathing');

  const match = keywords => keywords.some(k =>
    exerciseText.includes(normalizeAdaptationText(k))
  );

  let adaptedVariant = ex.client_variant || '';
  let adaptedStatus = ex.client_exercise_status || '';
  const notes = [];

  // Cinta / trote / correr
  if (noJog && match(['cinta', 'trote', 'correr', 'carrera', 'running', 'run'])) {
    adaptedStatus = 'Adaptado';
    adaptedVariant = 'Caminar progresivo o trabajo cardiovascular suave, sin trote todavía. Mantener ritmo cómodo y controlado.';
    notes.push('Evitar trote por ahora. Priorizar técnica de apoyo, respiración y control de rodilla.');
  }

  // Remo
  if (match(['remo', 'rowing'])) {
    adaptedStatus = adaptedStatus || 'Controlado';
    notes.push('Mantener remo suave y técnico. No buscar potencia ni fatiga alta.');
  }

  // Saltos / impacto
  if (noImpact && match(['salto', 'saltos', 'jump', 'burpee', 'pliometria', 'plyo'])) {
    adaptedStatus = 'Sustituido';
    adaptedVariant = 'Versión sin salto: realizar el patrón con paso controlado, sin impacto y sin rebote.';
    notes.push('Eliminar impacto. Mantener control de rodilla, cadera y respiración.');
  }

  // Step up
  if (match(['step up', 'step-up', 'subida al cajon', 'subida al banco', 'cajon'])) {
    adaptedStatus = 'Adaptado';
    adaptedVariant = 'Step up bajo, lento y controlado. Subir sin impulso, apoyar completo el pie y bajar con control.';
    notes.push('Vigilar rodilla. No aumentar altura ni velocidad aunque el cliente se sienta capaz.');
  }

  // Pelota medicinal
  if (match(['pelota medicinal', 'medicine ball', 'balon medicinal', 'med ball'])) {
    adaptedStatus = 'Adaptado';
    adaptedVariant = 'Trabajo con pelota medicinal reducido. Mantener gesto técnico, menos volumen y sin buscar potencia máxima.';
    notes.push('Reducir volumen e intensidad. Priorizar control antes que fuerza explosiva.');
  }

  // Soga / cuerda
  if (match(['soga', 'cuerda', 'rope', 'battle rope'])) {
    adaptedStatus = 'Adaptado';
    adaptedVariant = 'Trabajo de soga con pies apoyados y postura estable. No colgarse, no tirar con impulso brusco.';
    notes.push('Mantener apoyo firme y respiración constante. Evitar tensión innecesaria en rodilla y zona lumbar.');
  }

  // Woodchop / rotaciones
  if (match(['woodchop', 'wood chop', 'rotacion', 'rotación', 'corte', 'chop'])) {
    adaptedStatus = 'Adaptado';
    adaptedVariant = 'Woodchop lento y controlado. Movimiento corto, estable y sin rotación brusca.';
    notes.push('Controlar tronco, cadera y respiración. No acelerar el gesto.');
  }

  // Piernas cargadas / rodilla
  if (
    hasKneeCare &&
    match(['sentadilla', 'squat', 'zancada', 'lunge', 'pierna', 'rodilla'])
  ) {
    adaptedStatus = adaptedStatus || 'Controlado';
    notes.push('Trabajar en rango cómodo. Si aparece molestia en rodilla, reducir recorrido o detener el ejercicio.');
  }

  // Swing / bisagra
  if (match(['swing', 'kettlebell swing', 'bisagra'])) {
    adaptedStatus = adaptedStatus || 'Controlado';
    notes.push('Mantener bisagra controlada. No buscar velocidad ni fatiga alta.');
  }

  // Solo añadir notas generales si ya hubo una adaptación específica
  if (notes.length) {
    if (keepLoad) {
      notes.push('No subir carga aunque el cliente se sienta capaz.');
    }

    if (reduceVolume) {
      notes.push('Reducir volumen si aparece fatiga temprana.');
    }

    if (observeBreathing) {
      notes.push('Observar respiración: no bloquear el aire durante el esfuerzo.');
    }
  }

  if (!notes.length && !adaptedVariant && !adaptedStatus) {
    return ex;
  }

  return {
    ...ex,
    client_variant: adaptedVariant || ex.client_variant,
    client_exercise_status: adaptedStatus || ex.client_exercise_status || 'Adaptado',
    client_coaching_note: mergeExerciseNotes(ex.client_coaching_note, notes)
  };
}

function getVideoEmbedUrl(url) {
  if (!url) return '';

  const raw = String(url).trim();

  try {
    const u = new URL(raw);

    // YouTube normal: https://www.youtube.com/watch?v=ID
    if (u.hostname.includes('youtube.com')) {
      const id = u.searchParams.get('v');

      if (id) {
        return 'https://www.youtube.com/embed/' + id;
      }

      // YouTube shorts: https://www.youtube.com/shorts/ID
      const shortsMatch = u.pathname.match(/\/shorts\/([^/?]+)/);

      if (shortsMatch?.[1]) {
        return 'https://www.youtube.com/embed/' + shortsMatch[1];
      }
    }

    // YouTube corto: https://youtu.be/ID
    if (u.hostname.includes('youtu.be')) {
      const id = u.pathname.replace('/', '');

      if (id) {
        return 'https://www.youtube.com/embed/' + id;
      }
    }

    // Vimeo: https://vimeo.com/ID
    if (u.hostname.includes('vimeo.com')) {
      const id = u.pathname.replace('/', '');

      if (id) {
        return 'https://player.vimeo.com/video/' + id;
      }
    }

    return '';
  } catch {
    return '';
  }
}

function normalizeKnowledgeText(value) {
  if (value === null || value === undefined) return '';

  if (Array.isArray(value)) {
    return value
      .map(v => String(v || '').trim())
      .filter(Boolean)
      .join(' · ');
  }

  if (typeof value === 'object') {
    try {
      return JSON.stringify(value);
    } catch {
      return '';
    }
  }

  return String(value || '').trim();
}

function hasExerciseKnowledge(ex) {
  if (!ex) return false;

  return Boolean(
    normalizeKnowledgeText(ex.knowledge_title) ||
    normalizeKnowledgeText(ex.knowledge_client_summary) ||
    normalizeKnowledgeText(ex.knowledge_main_goal) ||
    normalizeKnowledgeText(ex.knowledge_body_zone) ||
    normalizeKnowledgeText(ex.knowledge_why_it_matters) ||
    normalizeKnowledgeText(ex.knowledge_technique_cues) ||
    normalizeKnowledgeText(ex.knowledge_breathing_cues) ||
    normalizeKnowledgeText(ex.knowledge_common_errors) ||
    normalizeKnowledgeText(ex.knowledge_safety_notes) ||
    normalizeKnowledgeText(ex.knowledge_regressions) ||
    normalizeKnowledgeText(ex.knowledge_progressions) ||
    normalizeKnowledgeText(ex.knowledge_coach_notes)
  );
}

function sameNum(a, b) {
  return Number(a || 0) === Number(b || 0);
}

function cleanExerciseNameForKnowledge(value) {
  return String(value || '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

function findKnowledgeRowForExercise(ex) {
  if (!ex || !Array.isArray(clientTrainingDisplayRows) || !clientTrainingDisplayRows.length) {
    return null;
  }

  const block = clientTrainingBlocks.find(b =>
    String(b.id) === String(ex.block_id)
  );

  const session = block
    ? clientTrainingSessions.find(s => String(s.id) === String(block.session_id))
    : null;

  const week = session
    ? clientTrainingWeeks.find(w => String(w.id) === String(session.week_id))
    : null;

  const byOrder = clientTrainingDisplayRows.find(r =>
    sameNum(r.week_order, week?.week_number) &&
    sameNum(r.session_order, session?.session_number) &&
    sameNum(r.block_order, block?.block_order) &&
    sameNum(r.exercise_order, ex.exercise_order)
  );

  if (byOrder) return byOrder;

  const exName = cleanExerciseNameForKnowledge(ex.name);

  const byName = clientTrainingDisplayRows.find(r =>
    cleanExerciseNameForKnowledge(r.exercise_name) === exName
  );

  if (byName) return byName;

  const byVideo = clientTrainingDisplayRows.find(r =>
    r.video_url &&
    ex.video_url &&
    String(r.video_url).trim() === String(ex.video_url).trim()
  );

  if (byVideo) return byVideo;

  return null;
}

function enrichExerciseWithKnowledge(ex) {
  if (!ex) return ex;

  if (hasExerciseKnowledge(ex)) {
    return ex;
  }

  const k = findKnowledgeRowForExercise(ex);

  if (!k) {
    return ex;
  }

  return {
    ...ex,

    video_url: ex.video_url || k.video_url || '',

    knowledge_video_family: ex.knowledge_video_family || k.knowledge_video_family || '',
    knowledge_title: ex.knowledge_title || k.knowledge_title || '',
    knowledge_category: ex.knowledge_category || k.knowledge_category || '',
    knowledge_client_summary: ex.knowledge_client_summary || k.knowledge_client_summary || '',
    knowledge_main_goal: ex.knowledge_main_goal || k.knowledge_main_goal || '',
    knowledge_body_zone: ex.knowledge_body_zone || k.knowledge_body_zone || '',
    knowledge_why_it_matters: ex.knowledge_why_it_matters || k.knowledge_why_it_matters || '',
    knowledge_technique_cues: ex.knowledge_technique_cues || k.knowledge_technique_cues || '',
    knowledge_breathing_cues: ex.knowledge_breathing_cues || k.knowledge_breathing_cues || '',
    knowledge_common_errors: ex.knowledge_common_errors || k.knowledge_common_errors || '',
    knowledge_safety_notes: ex.knowledge_safety_notes || k.knowledge_safety_notes || '',

async function completeTrainingStep(blockId) {
  const sessionId = getSessionIdByBlockId(blockId);
  
  if (!sessionId) {
    console.error('completeTrainingStep: no sessionId for block', blockId);
    return;
  }

  // Solo añadir si pertenece a la sesión activa visible
  const visibleSessionId = getCurrentVisibleSessionId();
  if (String(sessionId) !== String(visibleSessionId)) {
    console.warn('Block no pertenece a la sesión visible, ignorando');
    return;
  }

  completedTrainingBlocks.add(blockId);
  saveTrainingProgressLocal({}, sessionId);
  markStepVisualAsCompleted(blockId);

  // Crear/actualizar log en Supabase SOLO aquí
  await loadOrCreateTrainingLog(sessionId);
  await saveTrainingProgress({}, sessionId);

  activeTrainingBlockKey = null;

  const sessionSteps = buildTrainingSteps(sessionId);
  const allBlockIds = new Set(sessionSteps.map(s => s.blockId));
  const sessionIsComplete = sessionSteps.length > 0 &&
    sessionSteps.every(s => completedTrainingBlocks.has(s.blockId));

  if (sessionIsComplete && allBlockIds.size > 0) {
    renderTrainingCompletionBox(true);
    return;
  }

  const next = sessionSteps.find(s => !completedTrainingBlocks.has(s.blockId));
  if (next) {
    activeTrainingBlockKey = next.blockId;
    const card = document.getElementById('step-' + next.blockId);
    if (card) {
      card.classList.add('open');
      setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 180);
    }
  }
}

function getSessionNameFromLog(log){
  const session = clientTrainingSessions.find(s =>

  if(!session) return uiText('training');

  const index = clientTrainingSessions.findIndex(s =>

function getWeekNameFromLog(log){

function buildMiniChart(pts){if(!pts||pts.length<2)return null;const vals=pts.map(d=>d.value),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;const W=260,H=50,P=6;const mapped=pts.map((d,i)=>({x:P+(i/(pts.length-1))*(W-P*2),y:P+(H-P*2)-((d.value-min)/range)*(H-P*2),date:d.date,value:d.value}));const line=mapped.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');const area=[mapped[0].x.toFixed(1)+','+(H-P).toFixed(1)].concat(mapped.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1))).concat([mapped[mapped.length-1].x.toFixed(1)+','+(H-P).toFixed(1)]).join(' ');const dots=mapped.map(p=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="var(--sport)" stroke="var(--card)" stroke-width="1.5"/>').join('');const labs=mapped.map(p=>'<span class="mini-chart-label">'+String(p.date||'').slice(5)+'<br>'+p.value+'</span>').join('');return'<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" xmlns="http://www.w3.org/2000/svg" style="display:block"><polygon points="'+area+'" fill="rgba(0,229,255,0.06)"/><polyline points="'+line+'" fill="none" stroke="var(--sport)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg><div class="mini-chart-labels">'+labs+'</div>';}
function buildExerciseHistory(exerciseName){return clientAssessmentResults.filter(r=>(r.exercise_name||'').trim().toLowerCase()===(exerciseName||'').trim().toLowerCase()).map(r=>{const a=clientAssessments.find(x=>x.id===r.assessment_id);return{date:a?.assessment_date||'',value:r.result_value,numValue:parseFloat(String(r.result_value||'').replace(',','.'))}}).filter(d=>d.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));}
function dLabel(d){

  if(d === 'lower_better') return uiText('lowerBetter');
  return uiText('reference');
}
function dColor(d){if(d==='higher_better')return'var(--streak)';if(d==='lower_better')return'var(--medical)';return'var(--text-secondary)';}

function normalizeAssessmentStatusClient(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

function getResultsForAssessmentClient(assessmentId) {
  return (clientAssessmentResults || [])
    .filter(r => String(r.assessment_id) === String(assessmentId))
    .sort((a, b) => Number(a.item_order || 0) - Number(b.item_order || 0));
}

function getUsefulAssessmentsForClient() {
  const list = [];

  (clientAssessments || []).forEach(a => {
    const results = getResultsForAssessmentClient(a.id);
    const status = normalizeAssessmentStatusClient(a.status);

    const hasResults = results.length > 0;
    const isInProgress =
      status.includes('progreso') ||
      status.includes('pendiente') ||
      status.includes('pending');

    /*
      Cliente limpio:
      - mostramos tests con resultados
      - mostramos tests en progreso
      - ocultamos del cliente tests vacíos repetidos
    */
    if (hasResults || isInProgress) {
      list.push({
        assessment: a,
        results,
        hasResults,
        isInProgress
      });
    }
  });

  return list.sort((a, b) => {
    const da = String(a.assessment.assessment_date || a.assessment.created_at || '');
    const dbb = String(b.assessment.assessment_date || b.assessment.created_at || '');
    return dbb.localeCompare(da);
  });
}

async function loadCalendarData() {
  if (!clientData?.id) return;

  const today = todayISO();
  const firstDay = calCurrentYear + '-' + String(calCurrentMonth + 1).padStart(2, '0') + '-01';
  const lastDay = new Date(calCurrentYear, calCurrentMonth + 1, 0);
  const lastDayStr = calCurrentYear + '-' + String(calCurrentMonth + 1).padStart(2, '0') + '-' + String(lastDay.getDate()).padStart(2, '0');

  const [slotsR, myR] = await Promise.all([
    db.from('public_slots')
      .select('*')
      .gte('date', firstDay)
      .lte('date', lastDayStr)
      .order('date', { ascending: true })
      .order('time', { ascending: true }),
    db.from('reservations')
      .select('*')
      .eq('client_id', clientData.id)
      .gte('date', firstDay)
      .lte('date', lastDayStr)
  ]);

  calPublicSlots = slotsR.data || [];
  calClientReservations = myR.data || [];
}

function getDayStatus(dateStr) {
  const myRes = calClientReservations.filter(r =>
    String(r.date).slice(0, 10) === dateStr &&
    isUpcomingReservation(r)
  );

  const publicDay = calPublicSlots.filter(s =>
    String(s.date).slice(0, 10) === dateStr
  );

  const grupalOpen = publicDay.filter(s => s.can_join);
  const grupalFull = publicDay.filter(s => !s.can_join && s.session_mode === 'grupal');

  if (myRes.length) return 'personal-own';
  if (grupalOpen.length) return 'grupal-open';
  if (grupalFull.length) return 'grupal-full';

  return 'free';
}

function buildCalendarHTML() {
  const monthNames = getLang() === 'sr'
    ? ['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar']
    : ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const dayLabels = getLang() === 'sr'
    ? ['Pon','Uto','Sre','Čet','Pet','Sub','Ned']
    : ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

  const today = new Date();
  const todayStr = todayISO();
  const firstDay = new Date(calCurrentYear, calCurrentMonth, 1);
  const daysInMonth = new Date(calCurrentYear, calCurrentMonth + 1, 0).getDate();
  let startDow = firstDay.getDay();
  startDow = startDow === 0 ? 6 : startDow - 1;

  let html =
    '<div class="cal-wrapper">' +
      '<div class="cal-header">' +
        '<button class="cal-nav-btn" onclick="calPrevMonth()">‹</button>' +
        '<div class="cal-month">' + monthNames[calCurrentMonth] + ' ' + calCurrentYear + '</div>' +
        '<button class="cal-nav-btn" onclick="calNextMonth()">›</button>' +
      '</div>' +
      '<div class="cal-grid">';

  dayLabels.forEach(d => {
    html += '<div class="cal-day-label">' + d + '</div>';
  });

  for (let i = 0; i < startDow; i++) {
    html += '<div class="cal-day empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = calCurrentYear + '-' + String(calCurrentMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const isPast = dateStr < todayStr;
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === calSelectedDate;
    const status = isPast ? 'past' : getDayStatus(dateStr);

    let cls = 'cal-day ' + (isPast ? 'past' : status);
    if (isToday && !isPast) cls += ' today';
    if (isSelected) cls += ' selected';

    const onclick = isPast || status === 'occupied' || status === 'grupal-full'
      ? ''
      : 'onclick="calSelectDay(\'' + dateStr + '\')"';

    html += '<div class="' + cls + '" ' + onclick + '>' + d;

    if (!isPast && (status === 'grupal-open' || status === 'personal-own')) {
      html += '<div class="cal-dot"></div>';
    }

    html += '</div>';
  }

  html +=
      '</div>' +
      '<div class="cal-legend">' +
        '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--streak)"></div>' + (getLang() === 'sr' ? 'Grupal disponible' : 'Grupal disponible') + '</div>' +
        '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--sport)"></div>' + (getLang() === 'sr' ? 'Mi reserva' : 'Mi reserva') + '</div>' +
        '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--text-secondary)"></div>' + (getLang() === 'sr' ? 'Libre' : 'Libre') + '</div>' +
      '</div>' +
    '</div>';

  return html;
}

function buildSlotsForDay(dateStr) {
  const grupalSlots = calPublicSlots.filter(s =>
    String(s.date).slice(0, 10) === dateStr
  );

  const mySlots = calClientReservations
    .filter(r => String(r.date).slice(0, 10) === dateStr)
    .filter(isUpcomingReservation);

async function calSubmitRequest(groupSlotId) {
  if (!calSelectedDate || !clientData?.id) {
    showClientNotice(getLang() === 'sr' ? 'Izaberi datum' : 'Selecciona una fecha', 'error');
    return;
  }

  const btn = document.getElementById('calSubmitBtn');

  if (btn) {
    btn.disabled = true;
    btn.textContent = getLang() === 'sr' ? 'Enviando...' : 'Enviando...';
  }

  const note = document.getElementById('calRequestNote')?.value?.trim() || null;

  const time = groupSlotId
    ? (calSelectedSlot?.time || null)
    : (document.getElementById('calRequestTime')?.value || null);

  const selectedType = groupSlotId
    ? 'group'
    : (document.getElementById('calRequestType')?.value || 'personal');

  const reservationType = groupSlotId
    ? 'Entrenamiento grupal'
    : selectedType === 'pareja'
      ? 'Sesión en pareja'
      : 'Sesión personal';

  const sessionMode = groupSlotId
    ? 'group'
    : 'personal';

  if (!groupSlotId && !time) {
    showClientNotice(getLang() === 'sr' ? 'Unesite vreme' : 'Indica la hora', 'error');

    if (btn) {
      btn.disabled = false;
      btn.textContent = getLang() === 'sr' ? 'Confirmar solicitud' : 'Confirmar solicitud';
    }

    return;
  }

  try {
    const payload = {
      client_id: clientData.id,
      date: calSelectedDate,
      time: time,
      type: reservationType,
      session_mode: sessionMode,
      status: 'pendiente',
      requested_by_client: true,
      client_message: note,
      group_slot_id: groupSlotId || null,
      place: calSelectedSlot?.place || 'Belgrado'
    };

    const { data, error } = await db
      .from('reservations')
      .insert(payload)
      .select()
      .single();

    if (error) throw error;

    if (groupSlotId) {
      const { error: slotError } = await db
        .from('group_slots')
        .update({
          current_capacity: (calSelectedSlot?.current_capacity || 0) + 1
        })
        .eq('id', groupSlotId);

      if (slotError) throw slotError;
    }

    clientReservations = [...clientReservations, data];
    calClientReservations = [...calClientReservations, data];
    calSelectedSlot = null;

    showClientNotice(
      getLang() === 'sr'
        ? 'Solicitud enviada. Abel confirmará pronto.'
        : 'Solicitud enviada. Abel confirmará en breve.',
      'success'
    );

    const area = document.getElementById('calRequestArea');

    if (area) {
      area.innerHTML =
        '<div class="data-card" style="border-color:rgba(0,230,118,.2);margin-top:0;">' +
          '<div class="dc-row">' +
            '<span class="dc-title">' +
              (getLang() === 'sr' ? 'Solicitud enviada' : 'Solicitud enviada') +
            '</span>' +
            '<span class="badge badge-green">' +
              (getLang() === 'sr' ? 'Pendiente' : 'Pendiente') +
            '</span>' +
          '</div>' +
          '<div class="dc-note">' +
            formatDate(calSelectedDate) +
            (time ? ' · ' + formatTime(time) : '') +
          '</div>' +
        '</div>';
    }

    renderReservationsCalendar();

  } catch (err) {
    console.error('Reservation error:', err);

    showClientNotice(
      getLang() === 'sr' ? 'Error al enviar' : 'Error al enviar la solicitud',
      'error'
    );

    if (btn) {
      btn.disabled = false;
      btn.textContent = getLang() === 'sr' ? 'Confirmar solicitud' : 'Confirmar solicitud';
    }
  }
}

function buildSimpleReservationView() {
  const today = todayISO();

  // Próxima reserva propia
  const myNext = getUpcomingReservations()[0] || null;

  // Próximos 3 días con slots grupales disponibles
  const nextSlotDays = [];
  const seen = new Set();
  const sorted = [...calPublicSlots]
    .filter(s => String(s.date) >= today && s.can_join)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));

  for (const s of sorted) {
    if (!seen.has(s.date)) {
      seen.add(s.date);
      nextSlotDays.push(s.date);
      if (nextSlotDays.length >= 3) break;
    }

  let html = '';

  // ── Mi próxima reserva ──
  if (myNext) {
    const statusColor =
      myNext.status === 'confirmada' ? 'var(--streak)' :

          '<span class="dc-sub">' +

          : ''
        ) +
      '</div>';

  // ── Próximas plazas grupales ──
  if (nextSlotDays.length) {

              (first.place ? ' · ' + first.place : '') +

function renderNotes(){
  const el = document.getElementById('sectionNotes');

  if(!el) return;

  const raw = clientData.notes;

  if(!raw || raw === '' || raw === '[]' || raw === 'null'){
    el.innerHTML =
      '<p class="empty-state">' + uiText('noCoachNotesRegistered') + '</p>';
    return;
  }

  let notes = [];

  if(Array.isArray(raw)){
    notes = raw;
  } else if(typeof raw === 'string'){
    try{
      const parsed = JSON.parse(raw);
      notes = Array.isArray(parsed) ? parsed : [raw];
    }catch{
      notes = [raw];
    }
  }

  notes = notes
    .map(n => {
      if(typeof n === 'string') return n.trim();

      if(typeof n === 'object' && n){
        return String(n.text || n.note || n.message || '').trim();
      }

      return '';
    })
    .filter(Boolean);

  if(!notes.length){
    el.innerHTML =
      '<p class="empty-state">' + uiText('noCoachNotesRegistered') + '</p>';
    return;
  }

  el.innerHTML = notes
    .map(n => '<div class="note-item">' + n + '</div>')
    .join('');
}

function copySummaryToClipboard(){
  const today = todayISO();

  const nextRes = clientReservations.find(r =>
    String(r.date).slice(0,10) >= today &&
    !['cancelada','cancelado','cancelled'].includes(String(r.status || '').toLowerCase())
  );

  const lastAss = clientAssessments[0] || null;

  const hasPending = clientPayments.some(p =>
    ['pendiente','vencido','pending','overdue'].includes(String(p.status || '').toLowerCase())
  );

  const hasOverdue = clientPayments.some(p =>
    ['vencido','overdue'].includes(String(p.status || '').toLowerCase())
  );

  const payStatus = hasOverdue
    ? (getLang() === 'sr' ? 'Kasni' : 'Vencido')
    : hasPending
      ? (getLang() === 'sr' ? 'Na čekanju' : 'Pendiente')
      : uiText('upToDate');

  let rawNotes = clientData.notes;
  let lastNote = '';

  if(rawNotes && rawNotes !== '[]'){
    if(Array.isArray(rawNotes) && rawNotes.length){
      lastNote = typeof rawNotes[0] === 'string'
        ? rawNotes[0]
        : (rawNotes[0].text || rawNotes[0].note || '');
    } else if(typeof rawNotes === 'string'){
      try{
        const parsed = JSON.parse(rawNotes);

        if(Array.isArray(parsed) && parsed.length){
          lastNote = typeof parsed[0] === 'string'
            ? parsed[0]
            : (parsed[0].text || parsed[0].note || '');
        }
      }catch{
        lastNote = rawNotes;
      }
    }
  }

  const nextSessionText = nextRes
    ? formatDate(nextRes.date) + (nextRes.time ? ' ' + uiText('at') + ' ' + formatTime(nextRes.time) : '')
    : uiText('noReservations');

  const text = [
    uiText('summaryTitle'),
    uiText('client') + ': ' + (clientData.name || '—'),
    uiText('plan') + ': ' + (clientData.plan || '—'),
    uiText('training') + ': ' + (clientTrainingProgram?.name || clientPrograms[0]?.name || '—'),
    uiText('scope') + ': ' + (clientTrainingAssignment ? getAssignmentScopeLabel() : '—'),
    uiText('levelLabel') + ': ' + (clientTrainingAssignment?.assigned_level || '—'),
    uiText('nextSession') + ': ' + nextSessionText,
    uiText('lastEvaluation') + ': ' + (
      lastAss
        ? (lastAss.assessment_name || uiText('functionalTest')) + ' · ' + formatDate(lastAss.assessment_date)
        : '—'
    ),
    uiText('payments') + ': ' + payStatus,
    lastNote ? uiText('notes') + ': ' + lastNote : ''
  ]
    .filter(Boolean)
    .join('\n');

  navigator.clipboard.writeText(text)
    .then(() => {
      const btn = document.querySelector('.copy-summary-btn');

      if(btn){
        btn.textContent = uiText('copied');

        setTimeout(() => {
          btn.textContent = uiText('copySummary');
        }, 2000);
      }
    })
    .catch(() => alert(uiText('couldNotCopy')));
}

    .replace(/^entrenamiento\s*/i, '')

  const week = clientTrainingWeeks.find(w =>

const intensityLabel = getIntensityLabel(session.intensity_level);

);

}

const timeLabel = totalMin > 0 ? '~' + Math.round(totalMin) + ' min' : null;

  return (

function getLatestClientMetric() {
  if (!Array.isArray(clientMetrics) || !clientMetrics.length) return null;

  return [...clientMetrics].sort((a, b) => {
    const da = String(a.date || a.created_at || '');
    const dbb = String(b.date || b.created_at || '');
    return dbb.localeCompare(da);
  })[0] || null;
}

function metricVal(row, keys) {
  if (!row) return '';

  for (const key of keys) {
    if (
      row[key] !== undefined &&
      row[key] !== null &&
      String(row[key]).trim() !== ''
    ) {
      return row[key];
    }
  }

  return '';
}

function metricText(row, keys, unit) {
  const v = metricVal(row, keys);
  if (v === '') return '—';
  return v + (unit ? ' ' + unit : '');
}

function openMetricEditor(targetId) {
  const cfg = BODY_METRIC_CONFIG[targetId] || BODY_METRIC_CONFIG.bodyMetricWeight;
  const overlay = ensureMetricEditorSheet();

  const latest = getLatestClientMetric();
  const currentValue = metricVal(latest, cfg.keys);
  const currentNote = metricVal(latest, ['notes', 'note', 'observaciones']);

  document.getElementById('metricEditorTarget').value = targetId;
  document.getElementById('metricEditorTitle').textContent = cfg.label;
  document.getElementById('metricEditorUnit').textContent = cfg.unit || '';

  const input = document.getElementById('metricEditorInput');
  input.step = cfg.step || '0.1';
  input.value = currentValue !== '' ? currentValue : '';

  const note = document.getElementById('metricEditorNote');
  note.value = currentNote || '';

  overlay.classList.remove('hidden');

  setTimeout(() => {
    input.focus();
    input.select?.();
  }, 80);
}

function closeMetricEditor() {
  const overlay = document.getElementById('metricEditorOverlay');
  if (overlay) overlay.classList.add('hidden');
}

function numFromMetric(row, cfg) {
  const raw = metricVal(row, cfg.keys);
  if (raw === '' || raw === null || raw === undefined) return null;

  const n = Number(raw);
  return Number.isFinite(n) ? n : null;
}

async function saveMetricEditorValue() {
  if (!clientData?.id) {
    showClientNotice('Cliente no identificado.', 'error');
    return;
  }

  const targetId = document.getElementById('metricEditorTarget')?.value || 'bodyMetricWeight';
  const cfg = BODY_METRIC_CONFIG[targetId] || BODY_METRIC_CONFIG.bodyMetricWeight;

  const input = document.getElementById('metricEditorInput');
  const rawValue = input?.value;

  if (rawValue === '' || rawValue === null || rawValue === undefined) {
    showClientNotice('Introduce un valor.', 'error');
    return;
  }

  const numericValue = Number(rawValue);

  if (!Number.isFinite(numericValue)) {
    showClientNotice('Valor no válido.', 'error');
    return;
  }

  const btn = document.getElementById('btnSaveMetricEditor');

  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Guardando...';
  }

  const latest = getLatestClientMetric() || {};
  const payload = {
    client_id: clientData.id,
    date: todayISO(),

    // Importante por las restricciones actuales de tu tabla metrics
    type: 'body_metrics',
    value: numericValue,

    notes: document.getElementById('metricEditorNote')?.value?.trim() || null,
    updated_at: new Date().toISOString()
  };

  Object.values(BODY_METRIC_CONFIG).forEach(item => {
    const columnExistsInLatest =
      latest &&
      Object.prototype.hasOwnProperty.call(latest, item.column);

    if (columnExistsInLatest || item.column === cfg.column) {
      payload[item.column] = numFromMetric(latest, item);
    }
  });

  payload[cfg.column] = numericValue;

  try {
    const { data, error } = await db
      .from('metrics')
      .insert(payload)
      .select()
      .single();

    if (error) throw error;

    clientMetrics.unshift(data);

    closeMetricEditor();

    showClientNotice('Métrica guardada.', 'success');

    renderClientData();
    renderSummary();

  } catch (err) {
    console.error('Metric editor save error:', err);

    showClientNotice(
      err?.message || 'No se pudo guardar la métrica.',
      'error'
    );

  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Guardar métrica';
    }
  }
}

function escHTML(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function getTodayCheckin() {
  const today = todayISO();

  return (clientDailyCheckins || []).find(c =>
    String(c.checkin_date || '').slice(0, 10) === today
  ) || null;
}

function checkinNumOrNull(id) {
  const el = document.getElementById(id);
  if (!el || el.value === '') return null;

  const n = Number(el.value);
  return Number.isFinite(n) ? n : null;
}

function buildEmojiScale(id, label, value, options) {
  const current = value !== null && value !== undefined && value !== ''
    ? Number(value)
    : null;

  let html =
    '<div class="emoji-scale-group">' +
      '<div class="emoji-scale-label">' + label + '</div>' +
      '<input type="hidden" class="emoji-hidden-input" id="' + id + '" value="' + (current ?? '') + '">' +
      '<div class="emoji-scale" data-target="' + id + '">';

  options.forEach(opt => {
    const active = Number(opt.value) === current ? ' active' : '';
    html +=
      '<button type="button" class="emoji-scale-btn' + active + '" ' +
        'onclick="selectEmojiScale(\'' + id + '\',' + opt.value + ', this)">' +
        '<span class="emoji-scale-num">' + opt.value + '</span>' +
        '<span class="emoji-scale-text">' + opt.text + '</span>' +
      '</button>';
  });

  html += '</div></div>';
  return html;
}

function selectEmojiScale(inputId, value, button) {
  const input = document.getElementById(inputId);
  if (input) input.value = value;

  const scale = button.closest('.emoji-scale');
  if (!scale) return;

  scale.querySelectorAll('.emoji-scale-btn').forEach(btn => {
    btn.classList.remove('active');
  });

  button.classList.add('active');
}

function showClientNotice(message, type = 'success') {
  const old = document.getElementById('clientNoticeToast');
  if (old) old.remove();

  const color =
    type === 'success'
      ? 'var(--streak)'
      : type === 'error'
        ? 'var(--medical)'
        : 'var(--sport)';

  const notice = document.createElement('div');
  notice.id = 'clientNoticeToast';
  notice.textContent = message;

  notice.style.position = 'fixed';
  notice.style.left = '16px';
  notice.style.right = '16px';
  notice.style.bottom = 'calc(26px + env(safe-area-inset-bottom))';
  notice.style.zIndex = '9999';
  notice.style.background = 'rgba(18,18,20,.96)';
  notice.style.border = '1px solid ' + color;
  notice.style.color = color;
  notice.style.borderRadius = '12px';
  notice.style.padding = '14px 16px';
  notice.style.fontFamily = 'var(--font-mono)';
  notice.style.fontSize = '11px';
  notice.style.letterSpacing = '1px';
  notice.style.textTransform = 'uppercase';
  notice.style.textAlign = 'center';
  notice.style.boxShadow = '0 12px 30px rgba(0,0,0,.45)';

  document.body.appendChild(notice);

  setTimeout(() => {
    notice.style.opacity = '0';
    notice.style.transition = 'opacity .35s ease';
    setTimeout(() => notice.remove(), 400);
  }, 2200);
}

async function saveDailyCheckin() {
  if (!clientData?.id) return;

  const btn = document.getElementById('btnSaveDailyCheckin');

  if (btn) {
    btn.disabled = true;
    btn.textContent = uiText('saving');
  }

  const payload = {
    client_id: clientData.id,
    checkin_date: todayISO(),
    sleep_hours: checkinNumOrNull('checkinSleepHours'),
    sleep_quality: checkinNumOrNull('checkinSleepQuality'),
    energy_level: checkinNumOrNull('checkinEnergy'),
    soreness_level: checkinNumOrNull('checkinSoreness'),
    comment: document.getElementById('checkinComment')?.value?.trim() || null,
    updated_at: new Date().toISOString()
  };

  try {
    const { data, error } = await db
      .from('client_daily_checkins')
      .upsert(payload, {
        onConflict: 'client_id,checkin_date'
      })
      .select()
      .single();

    if (error) throw error;

    const idx = clientDailyCheckins.findIndex(c =>
      String(c.checkin_date || '').slice(0, 10) === todayISO()
    );

    if (idx >= 0) {
      clientDailyCheckins[idx] = data;
    } else {
      clientDailyCheckins.unshift(data);
    }

    showClientNotice(uiText('checkinSaved'), 'success');
    
    if (btn) {
      btn.disabled = false;
      btn.textContent = uiText('saveCheckin');
    }
    
    setTimeout(() => {
      const card = document.getElementById('dailyCheckinCard');
      if (card) card.outerHTML = buildDailyCheckinHTML();
    }, 600);


    } catch (err) {
    console.error('Check-in save error:', err);

    if (btn) {
      btn.disabled = false;
      btn.textContent = uiText('saveCheckin');
    }

    showClientNotice(
      (err && err.message) ? err.message : uiText('checkinSaveError'),
      'error'
    );
  }
}

/* ═══ WAKE LOCK — evita que la pantalla se apague durante el timer ═══ */
let _wakeLock = null;

async function _requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    _wakeLock = await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release', () => { _wakeLock = null; });
  } catch (err) {
    // Wake lock no disponible en este momento (batería baja, pestaña oculta, etc.)
    console.warn('Wake lock:', err.message);
  }
}

function _releaseWakeLock() {
  if (_wakeLock) {
    _wakeLock.release().catch(() => {});
    _wakeLock = null;
  }
}

// Re-pedir wake lock si el usuario vuelve a la app tras haberla dejado en segundo plano
document.addEventListener('visibilitychange', async () => {
  if (_wakeLock === null && document.visibilityState === 'visible' && workoutTimer.running) {
    await _requestWakeLock();
  }
});

const VAPID_PUBLIC_KEY = 'BPcRt3OtJSJ9A3tSOwk-E-gVV0H0IfguGC5O4l1_Muq2pI4A3QBVAaAF9v1KDEmNYKfEUS8mD6sDAW37NQgD4Ys';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function getNotificationPermission() {
  if (!('Notification' in window)) return 'unsupported';
  return Notification.permission;
}

async function subscribeToNotifications() {
  if (!clientData?.id || !clientData?.access_code) {
    showClientNotice('No se pudo validar el cliente.', 'error');
    return false;
  }

  if (!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY === 'AQUI_TU_VAPID_PUBLIC_KEY') {
    showClientNotice('Falta configurar la clave pública VAPID.', 'error');
    return false;
  }

  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    showClientNotice('Tu navegador no soporta notificaciones push.', 'error');
    return false;
  }

  try {
    const permission = await Notification.requestPermission();

    if (permission !== 'granted') {
      showClientNotice('Permiso de notificaciones denegado.', 'error');
      return false;
    }

    const reg = await navigator.serviceWorker.ready;

    let sub = await reg.pushManager.getSubscription();

    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    const subJSON = sub.toJSON();

    if (!subJSON?.endpoint || !subJSON?.keys?.p256dh || !subJSON?.keys?.auth) {
      throw new Error('Suscripción push incompleta.');
    }

    const { data, error } = await db.rpc('ab_upsert_notification_subscription', {
      p_client_id: clientData.id,
      p_access_code: clientData.access_code,
      p_endpoint: subJSON.endpoint,
      p_p256dh: subJSON.keys.p256dh,
      p_auth: subJSON.keys.auth,
      p_user_agent: navigator.userAgent.slice(0, 200)
    });

    if (error) throw error;

    const result = Array.isArray(data) ? data[0] : data;

    if (result && result.ok === false) {
      throw new Error(result.error || 'No se pudo guardar la suscripción.');
    }

    showClientNotice('Notificaciones activadas.', 'success');
    updateNotifBellState(true);

    return true;

  } catch (err) {
    console.error('Push subscribe error:', err);
    showClientNotice(err?.message || 'Error al activar notificaciones.', 'error');
    return false;
  }
}

async function unsubscribeFromNotifications() {
  if (!clientData?.id || !clientData?.access_code) {
    showClientNotice('No se pudo validar el cliente.', 'error');
    return false;
  }

  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    showClientNotice('Tu navegador no soporta notificaciones push.', 'error');
    return false;
  }

  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();

    if (sub) {
      const { data, error } = await db.rpc('ab_delete_notification_subscription', {
        p_client_id: clientData.id,
        p_access_code: clientData.access_code,
        p_endpoint: sub.endpoint
      });

      if (error) throw error;

      const result = Array.isArray(data) ? data[0] : data;

      if (result && result.ok === false) {
        throw new Error(result.error || 'No se pudo eliminar la suscripción.');
      }

      await sub.unsubscribe();
    }

    showClientNotice('Notificaciones desactivadas.', 'success');
    updateNotifBellState(false);

    return true;

  } catch (err) {
    console.error('Unsubscribe error:', err);
    showClientNotice(err?.message || 'Error al desactivar notificaciones.', 'error');
    return false;
  }
}

async function checkNotifSubscriptionState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    updateNotifBellState(!!sub && Notification.permission === 'granted');
  } catch {}
}

function updateNotifBellState(active) {
  const btn = document.getElementById('notifBellBtn');
  if (!btn) return;
  btn.classList.toggle('active', active);
  btn.title = active ? 'Notificaciones activas — toca para desactivar' : 'Activar notificaciones';
}

async function toggleNotifications() {
  if (!('Notification' in window)) {
    showClientNotice('Tu navegador no soporta notificaciones.', 'error');
    return;
  }

  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    showClientNotice('Tu navegador no soporta notificaciones push.', 'error');
    return;
  }

  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();

    if (sub && Notification.permission === 'granted') {
      await unsubscribeFromNotifications();
      return;
    }

    await subscribeToNotifications();

  } catch (err) {
    console.error('Toggle notifications error:', err);
    showClientNotice(err?.message || 'Error con las notificaciones.', 'error');
  }
}

async function skipCompetition(competitionId) {
  if (!clientData?.id || !clientData?.access_code) {
    showClientNotice('No se pudo validar el cliente.', 'error');
    return;
  }

  const comp = clientCompetitionEvents.find(c => String(c.id) === String(competitionId));
  const eventName = comp?.event_name || 'Competición';

  const reason = prompt(
    'Vas a marcar que no asistirás a "' + eventName + '".\n\n' +
    'Motivo opcional para que Abel lo sepa:'
  );

  if (reason === null) return;

  try {
    const { data, error } = await db.rpc('ab_update_competition_attendance', {
      p_client_id: clientData.id,
      p_access_code: clientData.access_code,
      p_event_id: competitionId,
      p_attending: false,
      p_skip_reason: reason || null
    });

    if (error) throw error;

    const result = Array.isArray(data) ? data[0] : data;

    if (result && result.ok === false) {
      throw new Error(result.error || 'No se pudo actualizar la competición.');
    }

    const idx = clientCompetitionEvents.findIndex(c => String(c.id) === String(competitionId));

    if (idx >= 0) {
      clientCompetitionEvents[idx].attending = false;
      clientCompetitionEvents[idx].skip_reason = reason || null;
      clientCompetitionEvents[idx].skipped_at = new Date().toISOString();
    }

    showClientNotice('Competición marcada como no asistida. Abel lo verá en el panel.', 'success');
    renderAtleta();

  } catch (err) {
    console.error('Skip competition error:', err);
    showClientNotice(err?.message || 'No se pudo actualizar la competición.', 'error');
  }
}

async function restoreCompetition(competitionId) {
  if (!clientData?.id || !clientData?.access_code) {
    showClientNotice('No se pudo validar el cliente.', 'error');
    return;
  }

  try {
    const { data, error } = await db.rpc('ab_update_competition_attendance', {
      p_client_id: clientData.id,
      p_access_code: clientData.access_code,
      p_event_id: competitionId,
      p_attending: true,
      p_skip_reason: null
    });

    if (error) throw error;

    const result = Array.isArray(data) ? data[0] : data;

    if (result && result.ok === false) {
      throw new Error(result.error || 'No se pudo restaurar la competición.');
    }

    const idx = clientCompetitionEvents.findIndex(c => String(c.id) === String(competitionId));

    if (idx >= 0) {
      clientCompetitionEvents[idx].attending = true;
      clientCompetitionEvents[idx].skip_reason = null;
      clientCompetitionEvents[idx].skipped_at = null;
    }

    showClientNotice('Competición restaurada al calendario.', 'success');
    renderAtleta();

  } catch (err) {
    console.error('Restore competition error:', err);
    showClientNotice(err?.message || 'Error al restaurar.', 'error');
  }
}

<script>
/* ═══════════════════════════════════════════════════════
   CRONÓMETRO + INTERVALOS
═══════════════════════════════════════════════════════ */
function renderTimerOnly() {
  document.querySelectorAll('[data-timer-wrap]').forEach(wrap => {
    wrap.innerHTML = buildTimerHTML();
  });
}

function formatClock(seconds) {
  const s = Math.max(0, Number(seconds || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function beep(freq=880, durMs=160, vol=0.35) {
  try {
    if (!beep._ctx) { const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx)return; beep._ctx=new Ctx(); }
    if (beep._ctx.state==='suspended') beep._ctx.resume();
    const o=beep._ctx.createOscillator(), g=beep._ctx.createGain();
    o.connect(g); g.connect(beep._ctx.destination);
    o.type='sine'; o.frequency.value=freq; g.gain.value=vol;
    o.start(); o.stop(beep._ctx.currentTime+durMs/1000);
  } catch(e) {}
}
function beepWork() { beep(880,180); }
function beepRest() { beep(440,220); }
function beepDone() { beep(660,250); setTimeout(()=>beep(880,350),280); }

function setIntervalMode(enabled) {
  workoutIntervals.enabled = !!enabled;
  pauseWorkoutTimer();
  resetIntervalState();
  renderTimerOnly();
}

function resetIntervalState() {
  workoutIntervals.phase = 'idle';
  workoutIntervals.currentRound = 1;
  workoutIntervals.phaseSecsLeft = 0;
}

function applyIntervalPreset(work, rest, rounds) {
  workoutIntervals.workSec = Number(work)||40;
  workoutIntervals.restSec = Number(rest)||20;
  workoutIntervals.totalRounds = Number(rounds)||8;
  pauseWorkoutTimer();
  resetIntervalState();
  renderTimerOnly();
}

function updateIntervalField(field, value) {
  workoutIntervals[field] = Math.max(0, Number(value)||0);
}

function updateClockUI() {
  const iv = workoutIntervals;

  const clockText = iv.enabled && iv.phase !== 'idle'
    ? formatClock(iv.phaseSecsLeft)
    : formatClock(workoutTimer.seconds);

  // Actualizar TODOS los relojes del DOM (uno por bloque)
  document.querySelectorAll('.js-wt-clock').forEach(el => {
    el.textContent = clockText;
  });

  if (iv.enabled) {
    const phaseText = {work:'TRABAJO', rest:'DESCANSO', done:'COMPLETADO'}[iv.phase] || '';
    const phaseClass = 'wt-phase js-wt-phase ' + (iv.phase === 'work' ? 'work' : iv.phase === 'rest' ? 'rest' : 'done');
    const roundText = iv.phase === 'done'
      ? `Completado · ${iv.totalRounds} rondas`
      : `Ronda ${iv.currentRound} / ${iv.totalRounds}`;

    document.querySelectorAll('.js-wt-phase').forEach(el => {
      el.textContent = phaseText;
      el.className = phaseClass;
    });
    document.querySelectorAll('.js-wt-round').forEach(el => {
      el.textContent = roundText;
    });
  }
}

function startWorkoutTimer() {
  if (workoutTimer.running) return;
  _requestWakeLock();
  try { if(!beep._ctx){const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx)beep._ctx=new Ctx();} if(beep._ctx&&beep._ctx.state==='suspended')beep._ctx.resume(); } catch(e){}
  const iv = workoutIntervals;
  if (iv.enabled && (iv.phase==='idle'||iv.phase==='done')) { iv.phase='work'; iv.currentRound=1; iv.phaseSecsLeft=Number(iv.workSec)||40; beepWork(); }
  workoutTimer.running = true;
  workoutTimer.interval = setInterval(() => {
    workoutTimer.seconds += 1;
    if (iv.enabled && iv.phase!=='idle' && iv.phase!=='done') {
      iv.phaseSecsLeft -= 1;
      if (iv.phaseSecsLeft <= 0) advanceIntervalPhase();
    }
    updateClockUI();
  }, 1000);
  renderTimerOnly();
}

function advanceIntervalPhase() {
  const iv = workoutIntervals;
  if (iv.phase === 'work') {
    const last = iv.currentRound >= Number(iv.totalRounds);
    const hasRest = Number(iv.restSec) > 0;
    if (last && !hasRest) { iv.phase='done'; beepDone(); pauseWorkoutTimer(); return; }
    if (hasRest) { iv.phase='rest'; iv.phaseSecsLeft=Number(iv.restSec); beepRest(); }
    else { iv.currentRound+=1; iv.phaseSecsLeft=Number(iv.workSec)||40; beepWork(); }
    return;
  }
  if (iv.phase === 'rest') {
    if (iv.currentRound >= Number(iv.totalRounds)) { iv.phase='done'; beepDone(); pauseWorkoutTimer(); return; }
    iv.currentRound+=1; iv.phase='work'; iv.phaseSecsLeft=Number(iv.workSec)||40; beepWork();
  }
}

function pauseWorkoutTimer() {
  _requestWakeLock();
  workoutTimer.running = false;
  if (workoutTimer.interval) { clearInterval(workoutTimer.interval); workoutTimer.interval=null; }
  if (document.querySelector('.js-wt-clock')) renderTimerOnly();
}

function resetWorkoutTimerOnly() {
  _requestWakeLock();
  workoutTimer.running = false;
  if (workoutTimer.interval) { clearInterval(workoutTimer.interval); workoutTimer.interval=null; }
  workoutTimer.seconds = 0;
  resetIntervalState();
  updateClockUI();
  renderTimerOnly();
}

function buildTimerHTML() {
  const iv = workoutIntervals;
  const on = iv.enabled;
  const pcls = iv.phase==='work'?'work':iv.phase==='rest'?'rest':iv.phase==='done'?'done':'';
  const clock = on&&iv.phase!=='idle' ? formatClock(iv.phaseSecsLeft) : formatClock(workoutTimer.seconds);
  const label = {work:'TRABAJO',rest:'DESCANSO',done:'COMPLETADO',idle:'INTERVALOS'}[iv.phase]||'';

  return `<div class="wt-timer">
    <div class="wt-mode-row">
      <button type="button" class="wt-mode-pill ${!on?'on':''}" onclick="setIntervalMode(false)">Libre</button>
      <button type="button" class="wt-mode-pill ${on?'on':''}" onclick="setIntervalMode(true)">Intervalos</button>
    </div>
    ${on?`<div class="wt-phase js-wt-phase ${pcls}">${label}</div>`:''}
    <div class="wt-clock js-wt-clock">${clock}</div>
    ${on?`<div class="wt-round js-wt-round">${iv.phase==='idle'?`${iv.workSec}s · ${iv.restSec}s · ${iv.totalRounds} rondas`:iv.phase==='done'?`Completado · ${iv.totalRounds} rondas`:`Ronda ${iv.currentRound} / ${iv.totalRounds}`}</div>`:''}
    <div class="wt-timer-actions" style="margin-top:10px">
      ${workoutTimer.running
        ?`<button class="client-action-btn" style="background:transparent;border:1px solid var(--card-border);color:var(--text-secondary);" onclick="pauseWorkoutTimer()">Pausar</button>`
        :`<button class="client-action-btn" onclick="startWorkoutTimer()">${on&&iv.phase==='done'?'Nueva ronda':'Iniciar'}</button>`}
      <button class="client-action-btn" style="background:transparent;border:1px solid var(--card-border);color:var(--text-secondary);" onclick="resetWorkoutTimerOnly()">Reiniciar</button>
    </div>
    ${on?`<div class="wt-iv-config">
      <div class="wt-iv-row">
        <div class="wt-iv-field"><label>Trabajo (s)</label><input type="number" inputmode="numeric" class="wt-iv-input" value="${iv.workSec}" min="1" oninput="updateIntervalField('workSec',this.value)"></div>
        <div class="wt-iv-field"><label>Descanso (s)</label><input type="number" inputmode="numeric" class="wt-iv-input" value="${iv.restSec}" min="0" oninput="updateIntervalField('restSec',this.value)"></div>
        <div class="wt-iv-field"><label>Rondas</label><input type="number" inputmode="numeric" class="wt-iv-input" value="${iv.totalRounds}" min="1" oninput="updateIntervalField('totalRounds',this.value)"></div>
      </div>
      <div class="wt-iv-presets">
        <button type="button" class="wt-iv-preset" onclick="applyIntervalPreset(180,60,5)">Box 3'/1' x5</button>
        <button type="button" class="wt-iv-preset" onclick="applyIntervalPreset(20,10,8)">Tabata 20/10</button>
        <button type="button" class="wt-iv-preset" onclick="applyIntervalPreset(40,20,8)">HIIT 40/20</button>
        <button type="button" class="wt-iv-preset" onclick="applyIntervalPreset(60,0,10)">EMOM 1' x10</button>
      </div>
    </div>`:''}
  </div>`;
}

function renderAtleta(){
  const el=document.getElementById('sectionAtleta');
  const badge=document.getElementById('atletaBadge');

  const ap=clientAthleteProfile||{};

    .filter(c=>c.event_date>=today)
    .sort((a,b)=>a.event_date.localeCompare(b.event_date));
