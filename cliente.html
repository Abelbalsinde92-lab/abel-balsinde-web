<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AB SYSTEM — Área Cliente</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ═══════════════════════════════════════════════════════
   AB SYSTEM — DARK v2.1 + MÉTRICAS COMBATE
═══════════════════════════════════════════════════════ */

:root {
  --bg:          #000000;
  --card:        #121214;
  --card-border: #1F1F24;
  --divider:     #16161A;
  --text-primary:   #FFFFFF;
  --text-secondary: #8E8E93;
  --sport:   #00A3FF;
  --medical: #FF5A5A;
  --streak:  #00E676;
  --warn:    #FFB340;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body:    'Syne', sans-serif;
  --font-mono:    'DM Mono', monospace;
  --tab-indicator: var(--sport);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; border: none; outline: none; font-family: var(--font-body); background: transparent; }
input, textarea { outline: none; font-family: var(--font-body); }
.hidden { display: none !important; }

/* ═══ LOADING ═══════════════════════════════════════ */
#loadingOverlay {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; z-index: 999;
}
.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--divider);
  border-top-color: var(--sport);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loadingOverlay p {
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
}

/* ═══ LOGIN ══════════════════════════════════════════ */
#loginScreen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px; background: var(--bg);
}
.login-box {
  width: 100%; max-width: 380px;
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 16px; padding: 40px 32px 36px;
}
.login-logo {
  display: flex; align-items: center;
  justify-content: center; margin-bottom: 32px;
}
.brand-logo { display: block; object-fit: contain; flex-shrink: 0; }
.brand-logo-login  { width: 56px; height: 56px; border-radius: 14px; }
.brand-logo-header { width: 36px; height: 36px; border-radius: 10px; }
.logo-badge, .logo-text { display: none !important; }
.login-title {
  font-family: var(--font-display);
  color: var(--text-primary); font-size: 28px;
  letter-spacing: 3px; margin-bottom: 4px; text-align: center;
}
.login-sub {
  font-size: 12px; color: var(--text-secondary);
  font-family: var(--font-mono); letter-spacing: 0.4px;
  margin-bottom: 32px; text-align: center;
}
.field-group { margin-bottom: 14px; }
.field-group label {
  display: block; font-size: 10px; font-family: var(--font-mono);
  letter-spacing: 1.4px; color: var(--text-secondary);
  text-transform: uppercase; margin-bottom: 8px;
}
.field-group input {
  width: 100%; background: var(--bg); border: 1px solid var(--card-border);
  border-radius: 8px; padding: 12px 14px;
  color: var(--text-primary); font-size: 15px; font-family: var(--font-body);
  transition: border-color .2s;
}
.field-group input:focus { border-color: var(--sport); }
.field-group input::placeholder { color: var(--text-secondary); opacity: .5; }
.btn-login {
  width: 100%; background: var(--text-primary); color: var(--bg);
  border-radius: 8px; padding: 13px;
  font-size: 13px; font-weight: 700; font-family: var(--font-mono);
  letter-spacing: 1.2px; text-transform: uppercase; margin-top: 4px;
  transition: opacity .2s, transform .1s;
}
.btn-login:hover { opacity: .9; }
.btn-login:active { transform: scale(.98); }
.btn-wa-login {
  width: 100%; background: transparent; border: 1px solid var(--card-border);
  color: var(--text-secondary); border-radius: 8px; padding: 11px;
  font-size: 12px; font-family: var(--font-mono); letter-spacing: 0.6px;
  margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: border-color .2s, color .2s;
}
.btn-wa-login:hover { border-color: var(--streak); color: var(--streak); }
.login-error {
  background: rgba(255,90,90,.08); border: 1px solid rgba(255,90,90,.3);
  color: var(--medical); border-radius: 8px; padding: 10px 14px;
  font-size: 12px; font-family: var(--font-mono); margin-bottom: 14px;
}
.login-info {
  background: rgba(0,163,255,.08); border: 1px solid rgba(0,163,255,.25);
  color: var(--sport); border-radius: 8px; padding: 10px 14px;
  font-size: 12px; font-family: var(--font-mono); margin-bottom: 14px;
}

/* ═══ HEADER ═════════════════════════════════════════ */
#dashboardScreen { min-height: 100vh; }
.dash-header {
  background: rgba(0,0,0,.92); border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 0 20px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.dash-header-logo { display: flex; align-items: center; gap: 10px; }
.dash-header-actions { display: flex; align-items: center; gap: 8px; }
.btn-icon {
  background: transparent; border: 1px solid var(--card-border);
  color: var(--text-secondary); border-radius: 6px; padding: 7px 12px;
  font-size: 11px; font-family: var(--font-mono); letter-spacing: 0.8px;
  display: flex; align-items: center; gap: 6px;
  transition: border-color .2s, color .2s;
}
.btn-icon:hover { border-color: var(--sport); color: var(--sport); }
.btn-icon.red:hover { border-color: var(--medical); color: var(--medical); }
#btnHeaderWA { border-color: rgba(0,230,118,.2); color: var(--streak); }
#btnHeaderWA:hover { border-color: var(--streak); }

/* ═══ NAV ════════════════════════════════════════════ */
.client-nav {
  background: rgba(0,0,0,.95); border-bottom: 1px solid var(--divider);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  position: sticky; top: 60px; z-index: 90;
  display: flex; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none;
}
.client-nav::-webkit-scrollbar { display: none; }
.client-nav button {
  flex: 0 0 auto; background: transparent;
  color: var(--text-secondary); border: none;
  border-bottom: 2px solid transparent;
  padding: 14px 18px 12px; font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
  white-space: nowrap; transition: color .15s, border-color .15s;
}
.client-nav button:hover { color: var(--text-primary); }
.client-nav button.active { color: var(--text-primary); border-bottom-color: var(--tab-indicator); }

/* ═══ LAYOUT ══════════════════════════════════════════ */
.dash-main {
  max-width: 720px; margin: 0 auto;
  padding: 20px 16px calc(120px + env(safe-area-inset-bottom));
}
.section { animation: fadein .16s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.section-hidden { display: none !important; }
.section-header {
  padding: 0 0 16px; display: flex;
  align-items: center; justify-content: space-between;
}
.section-header h2 {
  font-family: var(--font-display); color: var(--text-primary);
  font-size: 22px; letter-spacing: 3px;
}
.section-header .sec-badge {
  font-size: 10px; font-family: var(--font-mono);
  color: var(--text-secondary); letter-spacing: 0.6px;
}
.empty-state {
  color: var(--text-secondary); font-size: 13px;
  font-family: var(--font-mono); letter-spacing: 0.3px; line-height: 1.8;
}

/* ═══ CARD BASE ════════════════════════════════════════ */
.data-card, .summary-card, .progress-circle-card, .assessment-card, .accordion-block {
  background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
}
.data-card { padding: 18px; margin-bottom: 10px; }
.data-card:last-child { margin-bottom: 0; }
.data-card.next-session { border-color: rgba(0,163,255,.25); }
.data-card .dc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 4px; }
.data-card .dc-title { font-weight: 700; font-size: 17px; line-height: 1.3; color: var(--text-primary); }
.data-card .dc-sub { font-size: 12px; color: var(--text-secondary); font-family: var(--font-mono); }
.data-card .dc-note { margin-top: 8px; font-size: 13px; color: var(--text-secondary); font-style: italic; }
.next-label {
  font-size: 10px; font-family: var(--font-mono);
  letter-spacing: 1.6px; text-transform: uppercase;
  font-weight: 500; color: var(--sport); margin-bottom: 10px;
}

/* ═══ BOTONES ══════════════════════════════════════════ */
.action-box { margin-top: 16px; display: grid; gap: 8px; }
.client-action-btn, .copy-summary-btn {
  width: 100%; min-height: 46px;
  background: var(--text-primary); border: none; color: var(--bg);
  border-radius: 8px; padding: 12px 16px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 1.2px; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity .15s, transform .1s;
}
.client-action-btn:hover, .copy-summary-btn:hover { opacity: .88; }
.client-action-btn:active { transform: scale(.98); }
.client-action-btn.wa {
  background: transparent; border: 1px solid rgba(0,230,118,.25); color: var(--streak);
}
.client-action-btn.wa:hover { border-color: var(--streak); background: rgba(0,230,118,.05); }

/* ═══ BADGES ═══════════════════════════════════════════ */
.badge {
  display: inline-block; font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.8px; font-weight: 500; padding: 3px 0;
}
.badge-green  { color: var(--streak); }
.badge-yellow { color: var(--warn); }
.badge-red    { color: var(--medical); }
.badge-blue   { color: var(--sport); }
.badge-gray   { color: var(--text-secondary); }
.badge-green::before,  .badge-green::after  { content: '['; }
.badge-green::after,   .badge-yellow::after { content: ']'; }
.badge-yellow::before, .badge-red::before   { content: '['; }
.badge-red::after,     .badge-blue::after   { content: ']'; }
.badge-blue::before,   .badge-gray::before  { content: '['; }
.badge-gray::after     { content: ']'; }

/* ═══ MÉTRICAS COMBATE — ESTADOS VISUALES ═══════════════
   Sistema de alertas fisiológicas para luchadores
═══════════════════════════════════════════════════════ */
#dashboard-atleta-combate {
  margin-bottom: 16px;
}

#dashboard-atleta-combate .combate-header {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--sport); margin-bottom: 12px;
}

#dashboard-atleta-combate .combate-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.card-metrica {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 16px;
  transition: border-color .25s, background .25s;
  position: relative;
  overflow: hidden;
}

.card-metrica span {
  font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--text-secondary); font-family: var(--font-mono);
  display: block; margin-bottom: 8px;
}

.card-metrica strong {
  font-family: var(--font-display);
  font-size: 32px; letter-spacing: 1px;
  color: var(--text-primary); line-height: 1; display: block;
}

.card-metrica .metrica-unit {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-secondary); letter-spacing: 0.6px;
  display: block; margin-top: 4px;
}

#display-fc-drop {
  color: var(--text-primary);
  margin-top: 6px;
}

#display-fc-calc {
  opacity: .85;
}

.estado-tag {
  display: inline-block; font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase;
  margin-top: 8px; padding: 3px 8px;
  border-radius: 4px; border: 1px solid currentColor;
  opacity: .9;
}

/* Indicador de barra lateral */
.card-metrica::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 12px 0 0 12px;
  background: var(--card-border);
  transition: background .25s;
}

/* ── Óptimo ── */
.status-ok {
  border-color: rgba(0, 230, 118, .3);
  background: rgba(0, 230, 118, .04);
}
.status-ok::before     { background: var(--streak); }
.status-ok strong      { color: var(--streak); }
.status-ok .estado-tag { color: var(--streak); }

/* ── Precaución ── */
.status-warning {
  border-color: rgba(255, 179, 64, .35);
  background: rgba(255, 179, 64, .04);
}
.status-warning::before     { background: var(--warn); }
.status-warning strong      { color: var(--warn); }
.status-warning .estado-tag { color: var(--warn); }

/* ── Peligro ── */
.status-danger {
  border-color: rgba(255, 90, 90, .35);
  background: rgba(255, 90, 90, .04);
}
.status-danger::before     { background: var(--medical); }
.status-danger strong      { color: var(--medical); }
.status-danger .estado-tag { color: var(--medical); }

/* Fecha de última actualización */
.combate-update {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-secondary); letter-spacing: 0.4px;
  margin-top: 10px; text-align: right;
}

/* ═══ HOME RINGS ════════════════════════════════════════ */
.home-rings-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 10px; margin: 18px 0;
}
.home-ring-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 16px 12px 14px; text-align: center;
  cursor: pointer; transition: border-color .2s; min-width: 0;
}
.home-ring-card:hover { border-color: rgba(255,255,255,.15); }
.home-ring-label {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px;
}
.home-ring-value {
  font-family: var(--font-display); font-size: 24px;
  letter-spacing: 0.5px; line-height: 1; margin-bottom: 2px;
}
.home-ring-note {
  font-size: 10px; color: var(--text-secondary);
  font-family: var(--font-mono); letter-spacing: 0.4px; margin-top: 6px;
}
.home-ring-card-constancia {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.home-ring-value-constancia {
  margin-top: 18px;
  margin-bottom: 22px;
  font-size: 28px;
  line-height: 1.1;
}

.home-ring-note-constancia {
  margin-top: 0;
  line-height: 1.8;
}
.home-ring-svg-wrap {
  width: 100%; height: 40px;
  display: flex; align-items: flex-end; justify-content: center;
  margin: 8px 0 4px; overflow: visible;
}
.home-ring-svg-wrap svg { width: 100%; height: 40px; overflow: visible; }
.home-ring, .home-ring-svg, .home-ring-track, .home-ring-progress, .home-ring-percent { display: none !important; }

/* ═══ PLAN GRID ═════════════════════════════════════════ */
.plan-grid { display: grid; gap: 14px 16px; grid-template-columns: 1fr 1fr; }
.plan-item .pi-label {
  font-size: 10px; font-family: var(--font-mono); text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--text-secondary); margin-bottom: 4px;
}
.plan-item .pi-value { font-size: 14px; color: var(--text-primary); font-weight: 600; }
.plan-item.full { grid-column: 1 / -1; }
.plan-divider { grid-column: 1/-1; border: none; border-top: 1px solid var(--divider); margin: 4px 0; }
.plan-no-program {
  background: var(--card); border: 1px dashed var(--card-border);
  border-radius: 10px; padding: 16px;
  color: var(--text-secondary); font-size: 13px; line-height: 1.7; margin-top: 4px;
}

/* ═══ SUMMARY GRID ══════════════════════════════════════ */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.summary-card { padding: 16px; border-radius: 12px; }
.summary-card.full { grid-column: 1/-1; }
.summary-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px;
}
.summary-value { font-size: 15px; color: var(--text-primary); font-weight: 700; }
.summary-value.big { font-family: var(--font-display); font-size: 24px; letter-spacing: 1px; }

/* ═══ QUICK CARDS ════════════════════════════════════════ */
.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.quick-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 14px; text-align: left;
  transition: border-color .15s;
}
.quick-card:hover { border-color: rgba(0,163,255,.3); }
.quick-card-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px;
}
.quick-card-title {
  font-size: 14px; font-weight: 700; color: var(--text-primary);
  display: flex; align-items: center; justify-content: space-between;
}
.quick-card-arrow { color: var(--sport); font-size: 16px; }

/* ═══ ENTRENAMIENTO ══════════════════════════════════════ */
#section-training { background: transparent; border: none; box-shadow: none; }
#section-training .section-header { background: transparent; border-bottom: none; padding: 0 0 16px; }
#sectionTrainingClient { padding: 0; }
#section-training .training-guide-summary {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 20px; margin: 0 0 14px;
}
#section-training .training-guide-title {
  font-family: var(--font-display); color: var(--text-primary);
  font-size: 28px; letter-spacing: 2px; margin-bottom: 6px;
}
#section-training .training-guide-meta {
  font-family: var(--font-mono); color: var(--text-secondary);
  font-size: 11px; letter-spacing: 1px;
}
#section-training .training-week-objective {
  border-top: 1px solid var(--divider); color: var(--text-secondary);
  font-size: 13px; line-height: 1.6; padding-top: 12px; margin-top: 12px;
}
.training-mini-hero {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 18px; margin: 0 0 14px;
}
.training-mini-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.training-mini-week {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-secondary);
  white-space: nowrap;
}
.training-mini-day { font-family: var(--font-display); font-size: 28px; line-height: 1; color: var(--text-primary); letter-spacing: 2px; }
.training-mini-meta { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); letter-spacing: 0.6px; }
.training-mini-title { color: var(--text-secondary); font-size: 13px; line-height: 1.4; }

.training-day-tabs {
  display: flex; gap: 0; overflow-x: auto; margin: 0 0 14px;
  border-bottom: 1px solid var(--divider); scrollbar-width: none;
}
.training-day-tabs::-webkit-scrollbar { display: none; }
.training-day-tab {
  flex: 0 0 auto; background: transparent; color: var(--text-secondary);
  border: none; border-bottom: 2px solid transparent;
  padding: 10px 16px 8px; font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
  white-space: nowrap; transition: color .15s, border-color .15s; margin-bottom: -1px;
}
.training-day-tab:hover { color: var(--text-primary); }
.training-day-tab.active { color: var(--text-primary); border-bottom-color: var(--sport); }

.training-day-panel, .training-session-panel, .training-week-panel { display: none; }
.training-day-panel.active, .training-session-panel.active, .training-week-panel.active { display: block; }
.training-session-separator { display: none; }

.training-step-list { display: flex; flex-direction: column; gap: 10px; }
.training-step-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; overflow: hidden; transition: border-color .2s;
}
.training-step-card.open     { border-color: rgba(0,163,255,.3); }
.training-step-card.completed{ border-color: rgba(0,230,118,.25); }
.training-step-header {
  width: 100%; background: transparent; padding: 16px;
  display: flex; align-items: center; gap: 14px;
  text-align: left; transition: background .15s;
}
.training-step-card.open .training-step-header      { background: rgba(0,163,255,.04); }

  if (v < 400)  return { clase: 'status-ok',      label: 'Óptimo' };
  if (v <= 800) return { clase: 'status-warning',  label: 'Precaución' };
  return              { clase: 'status-danger',   label: 'Peligro' };
}

/**
 * Cortisol (µg/dL)
 * <15 → ok | 15–22 → warning | >22 → danger
 */
function evaluarCortisol(v) {
  if (v == null) return { clase: null, label: '' };
  if (v < 15)  return { clase: 'status-ok',      label: 'Óptimo' };
  if (v <= 22) return { clase: 'status-warning',  label: 'Elevado' };
  return              { clase: 'status-danger',   label: 'Peligro' };
}

/**
 * FC Recuperación 1 min
 * caída = fc_max - fc_al_minuto
 * >30 ppm → ok | 18–30 → warning | <18 → danger
 * fc_max se lee de clientData.fc_max (campo en tabla clients)
 */
function evaluarFCRecuperacion(fcAlMinuto, fcMax) {
  if (fcAlMinuto == null) return { clase: null, label: '', caida: null };
  const fc    = Number(fcMax) || 190;
  const caida = fc - Number(fcAlMinuto);
  if (caida > 30)  return { clase: 'status-ok',      label: `↓${caida} ppm · Óptimo`,    caida };
  if (caida >= 18) return { clase: 'status-warning',  label: `↓${caida} ppm · Regular`,   caida };
  return              { clase: 'status-danger',   label: `↓${caida} ppm · Peligro`,  caida };
}

/**
 * Inyecta valor + clase de estado en una card-metrica
 */
function inyectarMetrica(cardId, displayId, valor, estado, etiqueta) {
  const card    = document.getElementById(cardId);
  const display = document.getElementById(displayId);
  if (!card || !display) return;

  display.textContent = valor != null ? valor : '--';

  // Quitar etiqueta previa
  card.querySelector('.estado-tag')?.remove();

  if (estado && etiqueta) {
    const tag = document.createElement('div');
    tag.className = 'estado-tag';
    tag.textContent = etiqueta;
    display.insertAdjacentElement('afterend', tag);
  }

  card.classList.remove('status-ok', 'status-warning', 'status-danger');
  if (estado) card.classList.add(estado);
}

/**
 * Carga el registro más reciente de metricas_combate
 * usando el clientData.id como atleta_id
 */
async function cargarMetricasCombate() {
  if (!clientData?.id) return;

  const { data, error } = await db
    .rpc('get_latest_metricas_combate', {
      p_atleta_id: clientData.id
    })
    .maybeSingle();

  if (error || !data) {
    // Sin datos aún — las cards ya muestran '--' por defecto
    return;
  }

  // FC máxima usada para calcular la recuperación
  const fcMax = Number(clientData.fc_max) || 190;

  // FC máxima de referencia opcional, solo para mostrar entre paréntesis
  const fcMaxRef = clientData.fc_max_ref ? Number(clientData.fc_max_ref) : null;

  const ck = evaluarCK(data.creatina_quinasa);
  const cortisol = evaluarCortisol(data.cortisol);
  const fcRec = evaluarFCRecuperacion(data.fc_recuperacion_1min, fcMax);

  inyectarMetrica(
    'card-ck',
    'display-ck',
    data.creatina_quinasa,
    ck.clase,
    ck.label
  );

  inyectarMetrica(
    'card-cortisol',
    'display-cortisol',
    data.cortisol != null ? Number(data.cortisol).toFixed(1) : null,
    cortisol.clase,
    cortisol.label
  );

  inyectarMetrica(
    'card-recuperacion',
    'display-fc-rec',
    data.fc_recuperacion_1min,
    fcRec.clase,
    fcRec.label
  );

  // Mostrar caída real de FC
  const fcDropEl = document.getElementById('display-fc-drop');
  if (fcDropEl) {
    fcDropEl.textContent = fcRec.caida != null
      ? `${uiText('heartDrop')}: ${fcRec.caida} ppm`
: `${uiText('heartDrop')}: -- ppm`;
  }

  // Mostrar FC máxima usada para calcular la recuperación
  const fcCalcEl = document.getElementById('display-fc-calc');
  if (fcCalcEl) {
    fcCalcEl.textContent = fcMaxRef
      ? `${uiText('maxHrUsed')}: ${fcMax} (ref. ${fcMaxRef}) ppm`
: `${uiText('maxHrUsed')}: ${fcMax} ppm`;
  }

  inyectarMetrica(
    'card-peso',
    'display-peso',
    data.peso_corporal != null ? Number(data.peso_corporal).toFixed(1) : null,
    null,
    null
  );

  // Fecha última actualización
  const fechaEl = document.getElementById('display-fecha');
  if (fechaEl && data.created_at) {
    const d = new Date(data.created_at);
    fechaEl.textContent = d.toLocaleDateString('es-ES', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }
}

/* ══════════════════════════════════════════════════════════
   LOCAL PROGRESS CACHE
══════════════════════════════════════════════════════════ */
function getTrainingStorageKey(sessionId) {
  if (!clientData || !clientTrainingAssignment) return null;
  const sid = sessionId || getCurrentVisibleSessionId?.() || 'general';
  return ['ab_tp', clientData.id, clientTrainingAssignment.id, sid, todayISO()].join('_');
}
function isSessionFinished(sessionId) {
  const key = getTrainingStorageKey(sessionId);
  if (!key) return false;
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r)?.is_finished === true : false; } catch { return false; }
}
function loadTrainingProgressLocal(sessionId) {
  const key = getTrainingStorageKey(sessionId);
  if (!key) return null;
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch { return null; }
}
function saveTrainingProgressLocal(extra, sessionId) {
  const key = getTrainingStorageKey(sessionId);
  if (!key) return;
  const prev = loadTrainingProgressLocal(sessionId) || {};
  localStorage.setItem(key, JSON.stringify({
    ...prev,
    session_id: sessionId || getCurrentVisibleSessionId(),
    completed_block_ids: Array.from(completedTrainingBlocks),
    is_finished: prev.is_finished || false,
    client_note: prev.client_note || '',
    client_feedback_tags: prev.client_feedback_tags || [],
    client_feedback_summary: prev.client_feedback_summary || '',
    updated_at: new Date().toISOString(),
    ...(extra || {})
  }));
}
function getLastActiveSessionKey() {
  if (!clientData || !clientTrainingAssignment) return null;
  return ['ab_last_session', clientData.id, clientTrainingAssignment.id].join('_');
}
function saveLastActiveSession(sessionId) {
  const key = getLastActiveSessionKey();
  if (key && sessionId) localStorage.setItem(key, String(sessionId));
}
function getLastActiveSession() {
  const key = getLastActiveSessionKey();
  return key ? localStorage.getItem(key) : null;
}
function getInitialActiveSessionId() {
  const saved = getLastActiveSession();
  if (saved && clientTrainingSessions.some(s => String(s.id) === String(saved))) return String(saved);
  const firstUnfinished = clientTrainingSessions.find(s => !isSessionFinished(String(s.id)));
  if (firstUnfinished) return String(firstUnfinished.id);
  return String(clientTrainingSessions[0]?.id || '');
}

async function loginClient() {
  hideError();
  const phone=document.getElementById('inputPhone').value.trim();
  const code=document.getElementById('inputCode').value.trim();
  if (!phone||!code){showError('Completa los dos campos.');return;}
  showLoading(true);
  try {
    const {data,error}=await db.rpc('client_login_by_phone_code',{p_phone:phone,p_access_code:code});

  }
}

/* ══════════════════════════════════════════════════════════
   DATA LOADING — incluye fc_max de tabla clients
══════════════════════════════════════════════════════════ */
async function loadClientDashboard(clientId) {
  showLoading(true);

  try {
    const { data: client, error: cErr } = await db
      .from('clients')
      .select('*')
      .eq('id', clientId)
      .single();

    if (cErr || !client) {
      Auth.logout();
      return;
    }

    clientData = client;

    AB_LANG = (clientData.preferred_lang || 'es').toLowerCase();
    document.documentElement.lang = AB_LANG === 'sr' ? 'sr' : 'es';

    const [
      resR,
      payR,
      metR,
      halR,
      proR,
      assignR,
      assR,
      logsR
    ] = await Promise.all([
      db.from('reservations').select('*').eq('client_id', clientId).order('date', { ascending: true }),
      db.from('payments').select('*').eq('client_id', clientId).order('due_date', { ascending: false }),
      db.from('metrics').select('*').eq('client_id', clientId).order('date', { ascending: false }),
      db.from('health_alerts').select('*').eq('client_id', clientId).order('date', { ascending: false }),
      db.from('programs').select('*').eq('client_id', clientId).order('created_at', { ascending: false }),
      db.from('client_program_assignments').select('*').eq('client_id', clientId).eq('status', 'activo').order('created_at', { ascending: false }).limit(1),
      db.from('client_assessments').select('*').eq('client_id', clientId).order('assessment_date', { ascending: false }),
      db.from('client_session_logs').select('*').eq('client_id', clientId).order('training_date', { ascending: false }),
    ]);

    clientReservations = resR.data || [];
    clientPayments = payR.data || [];
    clientMetrics = metR.data || [];
    clientAlerts = halR.data || [];
    clientPrograms = proR.data || [];
    clientTrainingAssignment = assignR.data?.[0] || null;
    clientAssessments = assR.data || [];
    clientSessionLogs = logsR.data || [];

    clientAssessmentResults = [];

    if (clientAssessments.length) {
      const ids = clientAssessments.map(a => a.id);

      const rr = await db
        .from('client_assessment_results')
        .select('*')
        .in('assessment_id', ids)
        .order('item_order', { ascending: true });

      clientAssessmentResults = rr.data || [];
    }

    clientTrainingProgram = null;
    clientTrainingWeeks = [];
    clientTrainingSessions = [];
    clientTrainingBlocks = [];
    clientTrainingExercises = [];

    const pid = clientTrainingAssignment?.program_id || null;

    if (pid) {
      const visibleR = await db
        .from('client_training_plan_visible')
        .select('*')
        .eq('client_id', clientId)
        .eq('program_id', pid)
        .order('week_order', { ascending: true })
        .order('session_order', { ascending: true })
        .order('block_order', { ascending: true })
        .order('exercise_order', { ascending: true });

      window.__AB_DEBUG_CLIENT__ = {
        visibleRows: visibleR.data?.length || 0,
        visibleError: visibleR.error || null,
        assignment: clientTrainingAssignment || null
      };

      if (!visibleR.error) {
        let rows = visibleR.data || [];

        const scope = getAssignmentScope();

        if (scope === 'day') {
          const aw = Number(clientTrainingAssignment?.assigned_week || clientTrainingAssignment?.current_week || 1);
          const as = Number(clientTrainingAssignment?.assigned_session_number || 1);

          rows = rows.filter(r =>
            Number(r.week_order) === aw &&
            Number(r.session_order) === as
          );
        }

        if (scope === 'week') {
          const aw = Number(clientTrainingAssignment?.assigned_week || clientTrainingAssignment?.current_week || 1);

          rows = rows.filter(r =>
            Number(r.week_order) === aw
          );
        }

        if (scope === 'month') {
          const am = Number(clientTrainingAssignment?.assigned_month || 1);
          const sw = (am - 1) * 4 + 1;

          rows = rows.filter(r =>
            Number(r.week_order) >= sw &&
            Number(r.week_order) <= sw + 3
          );
        }

        if (rows.length) {
          const first = rows[0];

          clientTrainingProgram = {
            id: first.program_id,
            name: first.program_name || '',
            description: first.program_description || '',
            objective: first.program_objective || '',
            type: first.program_type || '',
            level: first.program_level || ''
          };

          const weeksMap = new Map();
          const sessionsMap = new Map();
          const blocksMap = new Map();

          rows.forEach(r => {
            if (!weeksMap.has(r.week_id)) {
              weeksMap.set(r.week_id, {
                id: r.week_id,
                week_number: r.week_order,
                name: r.week_name || '',
                description: r.week_description || '',
                objective: r.week_objective || '',
                focus: r.week_focus || ''
              });
            }

            if (!sessionsMap.has(r.session_id)) {
              sessionsMap.set(r.session_id, {
                id: r.session_id,
                week_id: r.week_id,
                session_number: r.session_order,
                title: r.session_title || '',
                description: r.session_description || '',
                objective: r.session_objective || '',
                intensity: r.session_intensity || ''
              });
            }

            if (!blocksMap.has(r.block_id)) {
              blocksMap.set(r.block_id, {
                id: r.block_id,
                session_id: r.session_id,
                block_order: r.block_order,
                title: r.block_title || '',
                description: r.block_description || '',
                objective: r.block_objective || '',
                type: r.block_type || '',
                duration: r.block_duration || ''
              });
            }

            clientTrainingExercises.push({
              id: r.exercise_id,
              block_id: r.block_id,
              exercise_order: r.exercise_order,

              name: r.exercise_name || '',
              description: r.exercise_description || '',

              sets: r.sets || '',
              reps: r.reps || '',
              time: r.time || r.duration || '',
              rest: r.rest || '',

              variant_n1: r.variant_n1 || '',
              variant_n2: r.variant_n2 || '',
              variant_n3: r.variant_n3 || '',
              variant_n4: r.variant_n4 || '',

              coaching_notes: r.coaching_notes || '',
              video_url: r.video_url || ''
            });
          });

          clientTrainingWeeks = Array.from(weeksMap.values()).sort((a, b) =>
            Number(a.week_number || 0) - Number(b.week_number || 0)
          );

          clientTrainingSessions = Array.from(sessionsMap.values()).sort((a, b) => {
            const wa = clientTrainingWeeks.find(w => String(w.id) === String(a.week_id));
            const wb = clientTrainingWeeks.find(w => String(w.id) === String(b.week_id));

            const wA = Number(wa?.week_number || 0);
            const wB = Number(wb?.week_number || 0);

            if (wA !== wB) return wA - wB;

            return Number(a.session_number || 0) - Number(b.session_number || 0);
          });

          clientTrainingBlocks = Array.from(blocksMap.values()).sort((a, b) => {
            const sa = clientTrainingSessions.find(s => String(s.id) === String(a.session_id));
            const sb = clientTrainingSessions.find(s => String(s.id) === String(b.session_id));

            const wa = clientTrainingWeeks.find(w => String(w.id) === String(sa?.week_id));
            const wb = clientTrainingWeeks.find(w => String(w.id) === String(sb?.week_id));

            const wA = Number(wa?.week_number || 0);
            const wB = Number(wb?.week_number || 0);

            if (wA !== wB) return wA - wB;

            const sA = Number(sa?.session_number || 0);
            const sB = Number(sb?.session_number || 0);

            if (sA !== sB) return sA - sB;

            return Number(a.block_order || 0) - Number(b.block_order || 0);
          });
        }
      }
    }

    await renderDashboard();

    document.getElementById('loginScreen')?.classList.add('hidden');
    document.getElementById('dashboardScreen')?.classList.remove('hidden');

    showLoading(false);

  } catch (err) {
    showLoading(false);

    console.error('Load error:', err);

    document.getElementById('loginScreen')?.classList.remove('hidden');
    document.getElementById('dashboardScreen')?.classList.add('hidden');

    showError('Error de conexión. Inténtalo de nuevo.');
  }
}

function buildMicroBars(data,color,w,h){const gap=3,n=data.length;const bw=(w-gap*(n-1))/n;const max=Math.max(...data,1);return data.map((v,i)=>{const bh=(v/max)*h;const x=i*(bw+gap),y=h-bh;return`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}" opacity=".9"/>`;}).join('');}
function buildMicroSpline(data,color,w,h){const min=Math.min(...data),max=Math.max(...data),range=max-min||1;const pad=4;const pts=data.map((v,i)=>({x:(i/(data.length-1))*w,y:pad+((max-v)/range)*(h-pad*2)}));let d=`M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;for(let i=0;i<pts.length-1;i++){const cp=(pts[i].x+pts[i+1].x)/2;d+=` C${cp.toFixed(1)} ${pts[i].y.toFixed(1)} ${cp.toFixed(1)} ${pts[i+1].y.toFixed(1)} ${pts[i+1].x.toFixed(1)} ${pts[i+1].y.toFixed(1)}`;}const last=pts[pts.length-1];return`<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/><circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3" fill="${color}"/>`;}
function buildMicroDots(data,color,w,h){const cols=10,rows=Math.ceil(data.length/cols);const ds=Math.min((w-3*(cols-1))/cols,(h-3*(rows-1))/rows);return data.slice(0,cols*rows).map((on,idx)=>{const col=idx%cols,row=Math.floor(idx/cols);const cx=col*(ds+3)+ds/2,cy=row*(ds+3)+ds/2;return`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(ds/2).toFixed(1)}" fill="${on?color:'var(--divider)'}" opacity="${on?1:.5}"/>`;}).join('');}
function clampPercent(n){return Math.max(0,Math.min(100,Math.round(Number(n||0))));}
function getFinishedTrainingSessionIds(){
  if(!clientData || !clientTrainingAssignment) return new Set();

  const finished = new Set();

  // 1) Progreso guardado en Supabase
  (clientSessionLogs || [])
    .filter(log =>
      String(log.assignment_id) === String(clientTrainingAssignment.id) &&
      log.is_finished === true &&
      log.session_id
    )
    .forEach(log => {
      finished.add(String(log.session_id));
    });

  // 2) Respaldo local del navegador
  const prefix = ['ab_tp', clientData.id, clientTrainingAssignment.id].join('_');

  try{
    for(let i = 0; i < localStorage.length; i++){
      const key = localStorage.key(i);

      if(!key || !key.startsWith(prefix)) continue;

      const raw = localStorage.getItem(key);
      if(!raw) continue;

      const d = JSON.parse(raw);

      if(d?.is_finished === true && d?.session_id){
        finished.add(String(d.session_id));
      }
    }
  }catch{}

  return finished;
}

function getTrainingProgressStats(){
  const totalSessions = clientTrainingSessions.length || 0;
  const finishedIds = getFinishedTrainingSessionIds();
  const finishedSessions = finishedIds.size;

  const percent = totalSessions > 0
    ? clampPercent((finishedSessions / totalSessions) * 100)
    : 0;

  return {
    totalSessions,
    finishedSessions,
    percent,
    finishedIds
  };
}

}

function getConstanciaState(finishedSessions, totalSessions){
  const total = Number(totalSessions || 0);
  const finished = Number(finishedSessions || 0);

  if(total <= 0){
    return {
      value: '0%',
      note: uiText('startYourStreak'),
      dotsPercent: 0
    };
  }

  const percent = clampPercent((finished / total) * 100);

  if(finished <= 0){
    return {
      value: '0%',
      note: uiText('firstPendingTraining'),
      dotsPercent: 0
    };
  }

  if(finished === 1 && total > 1){
    return {
      value: '🔥',
      note: uiText('firstStepCompleted'),
      dotsPercent: 0
    };
  }

  if(finished === 2 && total > 2){
    return {
      value: '🔥🔥',
      note: uiText('goodStreak'),
      dotsPercent: 0
    };
  }

  if(percent >= 100){
    return {
      value: '🔥🔥🔥',
      note: uiText('weekCompleted'),
      dotsPercent: 0
    };
  }

  return {
    value: '🔥🔥',
    note: finished + ' ' + uiText('of') + ' ' + total + ' ' + uiText('sessions'),
    dotsPercent: 0
  };
}

function getHealthHomeState(){
  const totalAlerts = Number(clientAlerts.length || 0);

  if(totalAlerts <= 0){
    return {
      value: 'OK',
      unit: '',
      note: uiText('noActiveIndications'),
      color: 'var(--streak)'
    };
  }

  if(totalAlerts === 1){
    return {
      value: '1',
      unit: '',
      note: uiText('pendingIndication'),
      color: 'var(--warn)'
    };
  }

  return {
    value: String(totalAlerts),
    unit: '',
    note: uiText('activeIndications'),
    color: 'var(--medical)'
  };
}

function buildHomeProgressRings(){
  const progressStats = getTrainingProgressStats();

const finishedSessions = progressStats.finishedSessions;
const totalSessions = progressStats.totalSessions || 1;
const planPct = progressStats.percent;
  const constancia = getConstanciaState(finishedSessions, totalSessions);
  const healthState = getHealthHomeState();

  const barData = [
    40, 65, 55, 80, 70, 90, 60, 75, 85, 95, 50, clampPercent(planPct)
  ];

  const splineData = clientAlerts.length > 0
    ? [72, 78, 74, 80, 76, 82, 79, 85, 88, 83, 77, 81]
    : [60, 61, 60, 62, 61, 60, 61, 60, 62, 61, 60, 61];

  const card1 = buildHomeRing_v2(
  uiText('advance'),
  planPct + '%',
  '',
  buildMicroBars(barData, 'var(--sport)', 100, 40),
  finishedSessions + ' ' + uiText('of') + ' ' + totalSessions + ' ' + uiText('sessions'),
  'var(--sport)',
  'section-training'
);

  const card2 = buildHomeRing_v2(
  uiText('health'),
  healthState.value,
  healthState.unit,
  buildMicroSpline(splineData, healthState.color, 100, 40),
  healthState.note,
  healthState.color,
  'section-health'
);

  const card3 = buildHomeRing_v2(
  uiText('consistency'),
  constancia.value,
  '',
  '',
  constancia.note,
  'var(--streak)',
  'section-training'
);

  return '<div class="home-rings-grid">' + card1 + card2 + card3 + '</div>';
}

function getSessionDayLabel(session,index){
  const num = Number(session.session_number || index + 1);

  if(num === 1) return tClient('dayA');
  if(num === 2) return tClient('dayB');
  if(num === 3) return tClient('dayC');

  return tClient('day') + ' ' + num;
}

function getSessionDisplayTitle(session,index){
  const day = getSessionDayLabel(session,index);
  const lg = getLang();

  let title = session.title || '';

  title = String(title || '').trim();

  if(!title || title.toLowerCase() === day.toLowerCase()) return day;

  if(
    title.toLowerCase().startsWith('dan ') ||
    title.toLowerCase().startsWith('día ') ||
    title.toLowerCase().startsWith('dia ')
  ){
    return title;
  }

  return day + ' · ' + title;
}

  saveLastActiveSession(sessionId);

function buildTrainingSteps(sessionIdFilter){
  const steps = [];
  const sessions = sessionIdFilter
    ? clientTrainingSessions.filter(s => String(s.id) === String(sessionIdFilter))
    : clientTrainingSessions;

  sessions.forEach((session,sIdx) => {
    const realIdx = clientTrainingSessions.findIndex(s => String(s.id) === String(session.id));

    const blocks = clientTrainingBlocks
      .filter(b => b.session_id === session.id)
      .slice()
      .sort((a,b) => Number(a.block_order || 0) - Number(b.block_order || 0));

    blocks.forEach((block,bIdx) => {
      const exercises = clientTrainingExercises
        .filter(e => e.block_id === block.id)
        .slice()
        .sort((a,b) => Number(a.exercise_order || 0) - Number(b.exercise_order || 0));

      steps.push({
        blockId: String(block.id),
        block,
        exercises,
        sessionId: String(session.id),
        session,
        sessionSeparator: bIdx === 0
          ? getSessionDisplayTitle(session, realIdx >= 0 ? realIdx : sIdx)
          : null
      });
    });
  });

  return steps;
}

function getActiveTrainingWeek(){
  if(!clientTrainingAssignment) return null;

  const currentWeek = Number(clientTrainingAssignment?.current_week || 1);

  return clientTrainingWeeks.find(w => Number(w.week_number) === currentWeek) ||
         clientTrainingWeeks[0] ||
         null;
}

async function loadOrCreateTrainingLog(sessionId){
  if(!clientData || !clientTrainingAssignment || !clientTrainingProgram) return null;

  const sid = sessionId || getCurrentVisibleSessionId();
  if(!sid) return null;

  const localProgress = loadTrainingProgressLocal(sid);

  if(localProgress){
    completedTrainingBlocks = new Set(localProgress.completed_block_ids || []);
    currentTrainingLog = { ...(currentTrainingLog || {}), ...localProgress };
  }

  const session = clientTrainingSessions.find(s => String(s.id) === String(sid));
  const week = session
    ? clientTrainingWeeks.find(w => String(w.id) === String(session.week_id))
    : getActiveTrainingWeek();

  const payload = {
    client_id: clientData.id,
    assignment_id: clientTrainingAssignment.id,
    program_id: clientTrainingProgram.id,
    week_id: week ? week.id : null,
    session_id: sid,
    training_date: todayISO()
  };

  try{
    const existing = await db
      .from('client_session_logs')
      .select('*')
      .eq('client_id', payload.client_id)
      .eq('assignment_id', payload.assignment_id)
      .eq('session_id', payload.session_id)
      .eq('training_date', payload.training_date)
      .maybeSingle();

    if(existing.error){
      console.error('Log read error:', existing.error);
      return currentTrainingLog;
    }

    if(existing.data){
      completedTrainingBlocks = new Set([
        ...(existing.data.completed_block_ids || []),
        ...(localProgress?.completed_block_ids || [])
      ]);

      currentTrainingLog = {
        ...existing.data,
        completed_block_ids: Array.from(completedTrainingBlocks),
        is_finished: existing.data.is_finished || localProgress?.is_finished || false,
        client_note: existing.data.client_note || localProgress?.client_note || '',
        client_feedback_tags: existing.data.client_feedback_tags || localProgress?.client_feedback_tags || [],
        client_feedback_summary: existing.data.client_feedback_summary || localProgress?.client_feedback_summary || ''
      };

      saveTrainingProgressLocal(currentTrainingLog, sid);
      return currentTrainingLog;
    }

    const created = await db
      .from('client_session_logs')
      .insert({
        ...payload,
        completed_block_ids: Array.from(completedTrainingBlocks),
        is_finished: localProgress?.is_finished || false,
        client_note: localProgress?.client_note || '',
        client_feedback_tags: localProgress?.client_feedback_tags || [],
        client_feedback_summary: localProgress?.client_feedback_summary || '',
        started_at: new Date().toISOString()
      })
      .select()
      .single();

    if(created.error){
      console.error('Log create error:', created.error);
      return currentTrainingLog;
    }

    currentTrainingLog = created.data;
    saveTrainingProgressLocal(currentTrainingLog, sid);
    return currentTrainingLog;

  }catch(err){
    console.error('Log error:', err);
    return currentTrainingLog;
  }
}

async function saveTrainingProgress(extra,sessionId){
  const sid = sessionId || getCurrentVisibleSessionId();

  saveTrainingProgressLocal(extra, sid);

  if(!currentTrainingLog?.id || String(currentTrainingLog.session_id) !== String(sid)){
    await loadOrCreateTrainingLog(sid);
  }

  if(!currentTrainingLog?.id){
    console.warn('No log ID');
    return;
  }

  const local = loadTrainingProgressLocal(sid) || {};

  try{
    const saved = await db
      .from('client_session_logs')
      .update({
        completed_block_ids: Array.from(completedTrainingBlocks),
        is_finished: local.is_finished || false,
        client_note: local.client_note || null,
        client_feedback_tags: local.client_feedback_tags || extra?.client_feedback_tags || [],
        client_feedback_summary: local.client_feedback_summary || extra?.client_feedback_summary || null,
        updated_at: new Date().toISOString(),
        ...(extra || {})
      })
      .eq('id', currentTrainingLog.id)
      .select()
      .single();

    if(!saved.error){
      currentTrainingLog = saved.data;
      saveTrainingProgressLocal(currentTrainingLog, sid);
    } else {
      console.error('Log save error:', saved.error);
    }
  }catch(err){
    console.error('Log save error:', err);
  }
}

            : ''
        ) +
      '</div>'
    );
  }

  let html = '';

  if(clientTrainingSessions.length > 1){
    const sessionsByWeek = new Map();

    clientTrainingSessions.forEach(s => {
      const wid = String(s.week_id);
      if(!sessionsByWeek.has(wid)) sessionsByWeek.set(wid, []);
      sessionsByWeek.get(wid).push(s);
    });

    const weeks = Array.from(sessionsByWeek.entries());

    if(weeks.length === 1){
      const sessions = weeks[0][1];
      const initialSessionId = getFirstAvailableSessionId();

      html += '<div class="training-day-tabs">';

          '<button class="training-day-tab' + (sid === String(initialSessionId) ? ' active' : '') + '" data-session-id="' + sid + '" onclick="showTrainingDay(\'' + sid + '\')">' +

            steps.forEach((step,j) => {

            html += '</div>';
          }

          html += '</div>';

  const blockType = pickLang(block,'type',_lg) || block.type || '';

function buildMiniChart(pts){if(!pts||pts.length<2)return null;const vals=pts.map(d=>d.value),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;const W=260,H=50,P=6;const mapped=pts.map((d,i)=>({x:P+(i/(pts.length-1))*(W-P*2),y:P+(H-P*2)-((d.value-min)/range)*(H-P*2),date:d.date,value:d.value}));const line=mapped.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');const area=[mapped[0].x.toFixed(1)+','+(H-P).toFixed(1)].concat(mapped.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1))).concat([mapped[mapped.length-1].x.toFixed(1)+','+(H-P).toFixed(1)]).join(' ');const dots=mapped.map(p=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="var(--sport)" stroke="var(--card)" stroke-width="1.5"/>').join('');const labs=mapped.map(p=>'<span class="mini-chart-label">'+String(p.date||'').slice(5)+'<br>'+p.value+'</span>').join('');return'<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" xmlns="http://www.w3.org/2000/svg" style="display:block"><polygon points="'+area+'" fill="rgba(0,163,255,0.06)"/><polyline points="'+line+'" fill="none" stroke="var(--sport)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg><div class="mini-chart-labels">'+labs+'</div>';}

function renderHealthAlerts(){

  if(badge) {
    badge.textContent = clientAlerts.length;

    html += buildCombatMetricsHTML();
  } else {
    html += buildGeneralHealthHTML();
  }

  html +=
    '<div style="margin:18px 0 12px;font-family:var(--font-mono);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-secondary);">' +
      'Indicaciones de salud' +
    '</div>';

  if(clientAlerts.length){
    html += clientAlerts.map(a => {
      const statusText = String(a.status || '').toLowerCase();

      let badgeClass = 'badge-gray';
      let statusLabel = a.status || 'Seguimiento';

      if(['pendiente','pending'].includes(statusText)){
        badgeClass = 'badge-yellow';
      }

      if(['alerta','critica','crítica','vencido'].includes(statusText)){
        badgeClass = 'badge-red';
      }

      if(['revisado','ok','apto','resuelto'].includes(statusText)){
        badgeClass = 'badge-green';
      }

      return (
        '<div class="data-card">' +
          '<div class="dc-row">' +
            '<span class="badge ' + badgeClass + '">' + statusLabel + '</span>' +
            '<span class="dc-sub" style="font-family:var(--font-mono);">' + formatDate(a.date) + '</span>' +
          '</div>' +

          (a.detail
            ? '<div style="margin-top:10px;font-size:14px;color:var(--text-primary);line-height:1.7;">' + a.detail + '</div>'
            : '<div class="dc-note">Sin detalle registrado.</div>'
          ) +
        '</div>'
      );
    }).join('');
  } else {
    html +=
      '<div class="data-card">' +
        '<div class="dc-row">' +
          '<span class="dc-title">Sin indicaciones activas</span>' +
          '<span class="badge badge-green">OK</span>' +
        '</div>' +
        '<div class="dc-note">' +
          'No hay alertas o indicaciones de salud registradas para este cliente.' +
        '</div>' +
      '</div>';
  }

  el.innerHTML = html;

  if(showCombatMetrics){
    cargarMetricasCombate();
  }

document.getElementById('btnLogout')?.addEventListener('click',()=>Auth.logout());
['inputPhone','inputCode'].forEach(id=>{document.getElementById(id)?.addEventListener('keydown',e=>{if(e.key==='Enter')loginClient();});});

/* ══ INIT ══ */
(async function init(){
  const params=new URLSearchParams(location.search);
  if(params.has('auth')||params.has('logged_out'))history.replaceState({},'',location.pathname);
  const urlClientId=params.get('client');
  if(urlClientId){await loadClientDashboard(urlClientId);return;}
  if(Auth.isClient()){await loadClientDashboard(Auth.getClientId());return;}
  if(Auth.isAdmin()){showLoading(false);document.getElementById('loginScreen')?.classList.remove('hidden');showInfo('Eres admin. Introduce las credenciales de un cliente para verlo.');return;}
  showLoading(false);document.getElementById('loginScreen')?.classList.remove('hidden');
})();
</script>
