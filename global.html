.metrics{display:flex;background:var(--card-2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}.metric{flex:1;min-width:0;padding:11px 9px 10px;border-right:1px solid var(--border);border-top:2px solid transparent}.metric:last-child{border-right:0}.metric.c{border-top-color:var(--cyan)}.metric.g{border-top-color:var(--green)}.metric.r{border-top-color:var(--red)}.metric.a{border-top-color:var(--amber)}.metric-n{display:block;font:1.5rem/1 var(--fd)}.metric-l{display:block;margin-top:4px;font:500 .43rem var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.overlay{display:none;position:fixed;z-index:200;inset:0;background:rgba(0,0,0,.74);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}.overlay.on{display:flex}.sheet{width:100%;max-width:580px;max-height:92dvh;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-bottom:0;border-radius:var(--r) var(--r) 0 0;padding:18px 20px calc(20px + var(--safe-b));position:relative}.handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 15px}.sheet-title{font:1.45rem var(--fd);letter-spacing:.04em;margin-bottom:15px;padding-right:42px}.close{position:absolute;right:10px;top:10px;width:46px;height:46px;color:var(--muted);font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-actions{display:flex;gap:8px;margin-top:16px}.form-actions .btn{flex:1}.hint{font:.56rem/1.55 var(--fm);color:var(--muted);margin-top:5px}
.toast{position:fixed;z-index:300;left:16px;right:16px;bottom:calc(var(--bottom) + var(--safe-b) + 12px);padding:13px 16px;border:1px solid rgba(0,200,232,.35);background:var(--card);border-radius:10px;text-align:center;font-size:.84rem;font-weight:700;opacity:0;transform:translateY(20px);transition:.2s;pointer-events:none}.toast.on{opacity:1;transform:none}.toast.err{color:var(--red);border-color:rgba(255,90,90,.4)}
@media(min-width:760px){.wrap{max-width:920px;margin:0 auto}.screen{padding:22px}.coach-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.coach-grid .card{margin-bottom:0}.sheet{border-radius:var(--r);margin-bottom:32px}.overlay{align-items:center}}
</style>
</head>

<script>
'use strict';
const SUPA_URL='https://icjuuptbcnkpwgsoyiuj.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljanV1cHRiY25rcHdnc295aXVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTIzMjQsImV4cCI6MjA5MzcyODMyNH0.L__PcG-5HUkV5hpnsujrWi8mkL1o1lCKRf-mrSeO5V8';
const db=supabase.createClient(SUPA_URL,SUPA_KEY);
const state={token:'',expiresAt:'',ownerId:'',coaches:[],clients:[],programs:[],assignments:[],sessionLogs:[],alerts:[],checkins:[]};
let currentScreen='hoy', coachFilter='all', toastTimer=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function jsq(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n')}
function camel(o){if(!o||typeof o!=='object'||Array.isArray(o))return o;const x={};for(const[k,v]of Object.entries(o))x[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())]=v;return x}
function arr(v){return(Array.isArray(v)?v:[]).map(camel)}
function initials(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?'}
function dateOnly(v){return String(v||'').slice(0,10)}
function formatDate(v){const s=dateOnly(v);if(!s)return'—';const[y,m,d]=s.split('-');return y&&m&&d?`${d}/${m}/${y}`:s}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()||7)-1));return todayFrom(d)}
function todayFrom(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function showToast(msg,type='ok'){const t=$('toast');t.textContent=msg;t.className='toast on'+(type==='err'?' err':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2600)}
function errorMessage(e){const m=String(e?.message||e||'Error');const map={OWNER_ACCESS_REQUIRED:'Acceso exclusivo para owner.',GLOBAL_SESSION_REQUIRED:'La sesión ha caducado.',USERNAME_ALREADY_EXISTS:'Ese usuario ya existe.',INVALID_USERNAME:'Usuario inválido: usa 3–40 letras, números, punto, guion o guion bajo.',PASSWORD_MIN_8:'La contraseña debe tener al menos 8 caracteres.',OWNER_CANNOT_DISABLE_SELF:'No puedes desactivar ni degradar tu propia cuenta owner.',TARGET_COACH_NOT_ACTIVE:'El coach de destino no está activo.'};return map[m]||m}
function rpc(name,args){return db.rpc(name,args).then(r=>{if(r.error)throw r.error;return r.data})}
function saveSession(coach){state.token=coach.session_token||'';state.expiresAt=coach.expires_at||'';state.ownerId=coach.coach_id||coach.id||'';const vals={ab_global_session_token:state.token,ab_global_session_expires_at:state.expiresAt,ab_global_owner_id:state.ownerId,ab_global_owner_name:coach.name||'Owner'};for(const[k,v]of Object.entries(vals)){localStorage.setItem(k,String(v||''));sessionStorage.setItem(k,String(v||''))}}
function readSession(){state.token=sessionStorage.getItem('ab_global_session_token')||localStorage.getItem('ab_global_session_token')||'';state.expiresAt=sessionStorage.getItem('ab_global_session_expires_at')||localStorage.getItem('ab_global_session_expires_at')||'';state.ownerId=sessionStorage.getItem('ab_global_owner_id')||localStorage.getItem('ab_global_owner_id')||'';if(state.expiresAt&&new Date(state.expiresAt).getTime()<=Date.now()){clearSession();return false}return !!state.token}
function clearSession(){['ab_global_session_token','ab_global_session_expires_at','ab_global_owner_id','ab_global_owner_name'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});state.token='';state.expiresAt='';state.ownerId=''}
async function pageInit(){bindOnce();$('loading').classList.add('hidden');if(!readSession()){showLogin();return}showApp();try{await loadAllData()}catch(e){console.error(e);clearSession();showLogin(errorMessage(e))}}
function bindOnce(){$('login-button').addEventListener('click',attemptLogin);['login-user','login-pass'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')attemptLogin()}));$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})}
function showLogin(msg=''){$('app').classList.add('hidden');$('loading').classList.add('hidden');$('login').classList.remove('hidden');const e=$('login-error');e.textContent=msg;e.classList.toggle('hidden',!msg)}
function showApp(){$('login').classList.add('hidden');$('loading').classList.add('hidden');$('app').classList.remove('hidden')}
async function attemptLogin(){const user=$('login-user').value.trim(),pass=$('login-pass').value,e=$('login-error');e.classList.add('hidden');if(!user||!pass){showLogin('Introduce usuario y contraseña.');return}$('login').classList.add('hidden');$('loading').classList.remove('hidden');try{const data=await rpc('ab_coach_login',{p_username:user,p_password:pass,p_user_agent:navigator.userAgent||'AB Global'});const coach=Array.isArray(data)?data[0]:data;if(!coach?.session_token)throw new Error('Login sin sesión.');if(String(coach.role||'').toLowerCase()!=='owner'){try{await rpc('ab_coach_logout',{p_session_token:coach.session_token})}catch(_){}throw new Error('OWNER_ACCESS_REQUIRED')}saveSession(coach);showApp();await loadAllData()}catch(err){console.error(err);clearSession();showLogin(errorMessage(err))}}
async function logoutGlobal(){if(!confirm('¿Cerrar sesión Global?'))return;const token=state.token;clearSession();try{if(token)await rpc('ab_coach_logout',{p_session_token:token})}catch(_){}location.replace(location.pathname)}
function showScreen(id){currentScreen=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('screen-'+id)?.classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));const map={'coach-detail':'coaches'};$('tab-'+(map[id]||id))?.classList.add('on');document.querySelector('.wrap')?.scrollTo(0,0);renderScreen(id)}
function renderScreen(id){if(id==='hoy')renderToday();if(id==='coaches')renderCoaches();if(id==='clientes')renderClients();if(id==='programas')renderPrograms();if(id==='alertas')renderAlerts()}
function openModal(title,html){$('modal-title').textContent=title;$('modal-body').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on');$('modal-body').innerHTML=''}
async function loadAllData(){const data=await rpc('ab_global_owner_get_dashboard',{p_session_token:state.token,p_log_limit:300,p_alert_limit:200});state.ownerId=data?.owner_id||state.ownerId;state.coaches=arr(data?.coaches);state.clients=arr(data?.clients);state.programs=arr(data?.programs);state.assignments=arr(data?.assignments);state.sessionLogs=arr(data?.session_logs);state.alerts=arr(data?.alerts);state.checkins=arr(data?.checkins);renderBadge();renderScreen(currentScreen);window.AB_GLOBAL_STATE={ownerId:state.ownerId,coaches:state.coaches.length,clients:state.clients.length,programs:state.programs.length,loadedAt:new Date().toISOString()}}
async function refreshData(){showToast('Actualizando…');try{await loadAllData();showToast('Datos actualizados ✓')}catch(e){showToast(errorMessage(e),'err')}}
function coachStatus(c){return String(c.status||(c.isActive===false?'suspended':'active')).toLowerCase()}
function statusBadge(s){return s==='active'?'<span class="badge green">Activo</span>':s==='suspended'?'<span class="badge amber">Suspendido</span>':'<span class="badge red">Archivado</span>'}
function activeCoaches(){return state.coaches.filter(c=>coachStatus(c)==='active')}
function renderBadge(){const n=state.alerts.filter(a=>!a.resueltaAt&&!a.resolvedAt&&String(a.estado||a.status||'pendiente').toLowerCase()==='pendiente').length;const b=$('alert-badge');b.textContent=n||'';b.classList.toggle('on',n>0)}
function clientsOf(coachId){return state.clients.filter(c=>String(c.coachId||'')===String(coachId))}
function logsOfClients(clients){const ids=new Set(clients.map(c=>String(c.id)));return state.sessionLogs.filter(l=>ids.has(String(l.clientId||'')))}
function renderToday(){const ws=weekStart(),today=todayISO(),activeClients=state.clients.filter(c=>String(c.status||'activo').toLowerCase()==='activo').length,pending=state.alerts.filter(a=>!a.resueltaAt&&!a.resolvedAt&&String(a.estado||a.status||'pendiente').toLowerCase()==='pendiente').length,todayLogs=state.sessionLogs.filter(l=>dateOnly(l.trainingDate||l.createdAt)===today).length,weekLogs=state.sessionLogs.filter(l=>dateOnly(l.trainingDate||l.createdAt)>=ws).length;$('today-metrics').innerHTML=`<div class="metrics"><div class="metric c"><span class="metric-n">${todayLogs}</span><span class="metric-l">Hoy</span></div><div class="metric g"><span class="metric-n">${weekLogs}</span><span class="metric-l">Semana</span></div><div class="metric r"><span class="metric-n">${pending}</span><span class="metric-l">Alertas</span></div><div class="metric a"><span class="metric-n">${activeClients}</span><span class="metric-l">Clientes</span></div></div>`;const cards=state.coaches.filter(c=>coachStatus(c)!=='archived').map(c=>{const clients=clientsOf(c.id),logs=logsOfClients(clients),week=logs.filter(l=>dateOnly(l.trainingDate||l.createdAt)>=ws).length,last=logs[0];return `<div class="card"><div class="card-body"><div style="display:flex;align-items:center;gap:11px"><div class="avatar">${initials(c.name)}</div><div class="grow" style="min-width:0"><div class="name truncate">${esc(c.name)}</div><div class="meta">${c.role==='owner'?'Owner':'Coach'} · ${clients.length} clientes</div></div><div style="text-align:right"><div style="font:1.45rem var(--fd);color:${week?'var(--green)':'var(--muted)'}">${week}</div><div class="meta">sesiones sem.</div></div></div>${last?`<div class="meta" style="margin-top:8px">Última sesión: ${formatDate(last.trainingDate||last.createdAt)}</div>`:''}</div><div class="card-actions"><button class="btn blue" onclick="openCoachDetail('${jsq(c.id)}')">Ver detalle</button></div></div>`}).join('');const checkins=state.checkins.length?`<div class="card"><div class="card-body">${state.checkins.map(ci=>{const c=state.clients.find(x=>String(x.id)===String(ci.clientId));return `<div class="row"><span class="key">${esc(c?.name||'—')}</span><span class="val">SUE ${esc(ci.sleepQuality??'—')}/5 · ENE ${esc(ci.energyLevel??'—')}/5 · MOL ${esc(ci.sorenessLevel??'—')}/5</span></div>`}).join('')}</div></div>`:'<div class="card"><div class="empty">Sin check-ins hoy</div></div>';$('today-content').innerHTML=`<div class="section-head"><span class="section-label">Actividad por coach</span></div>${cards||'<div class="empty"><strong>Sin coaches</strong></div>'}<div class="section-head"><span class="section-label">Check-ins hoy</span></div>${checkins}`}
function setCoachFilter(v){coachFilter=v;document.querySelectorAll('[data-coach-filter]').forEach(x=>x.classList.toggle('on',x.dataset.coachFilter===v));renderCoaches()}
function renderCoaches(){let rows=[...state.coaches];if(coachFilter!=='all')rows=rows.filter(c=>coachStatus(c)===coachFilter);$('coaches-content').innerHTML=rows.length?rows.map(c=>{const clients=clientsOf(c.id),logs=logsOfClients(clients),week=logs.filter(l=>dateOnly(l.trainingDate||l.createdAt)>=weekStart()).length,plans=state.assignments.filter(a=>clients.some(x=>String(x.id)===String(a.clientId))).length,s=coachStatus(c);return `<article class="card"><div class="card-body"><div style="display:flex;gap:12px;align-items:center;margin-bottom:13px"><div class="avatar lg">${initials(c.name)}</div><div class="grow" style="min-width:0"><div class="name truncate">${esc(c.name)}</div><div class="meta" style="color:${c.role==='owner'?'var(--cyan)':'var(--amber)'}">${c.role==='owner'?'OWNER':'COACH'} · @${esc(c.username||'')}</div><div class="meta">${esc(c.email||c.phone||'Sin contacto')}</div></div>${statusBadge(s)}</div><div class="metrics" style="margin:0"><div class="metric c"><span class="metric-n">${clients.length}</span><span class="metric-l">Clientes</span></div><div class="metric g"><span class="metric-n">${week}</span><span class="metric-l">Ses. sem.</span></div><div class="metric a"><span class="metric-n">${plans}</span><span class="metric-l">Planes</span></div></div></div><div class="card-actions"><button class="btn blue" onclick="openCoachDetail('${jsq(c.id)}')">Clientes</button><button class="btn secondary" onclick="openEditCoach('${jsq(c.id)}')">Editar</button><button class="btn secondary" onclick="openResetPassword('${jsq(c.id)}')">Contraseña</button></div></article>`}).join(''):'<div class="empty"><strong>Sin resultados</strong>No hay coaches en este estado.</div>'}
function openCreateCoach(){openModal('Nuevo coach',`<div class="field"><label class="label">Nombre completo</label><input id="nc-name" class="input" autocomplete="name"></div><div class="grid2"><div class="field"><label class="label">Usuario</label><input id="nc-user" class="input" autocapitalize="off" autocomplete="off"></div><div class="field"><label class="label">Contraseña temporal</label><input id="nc-pass" class="input" type="password" autocomplete="new-password"></div></div><div class="grid2"><div class="field"><label class="label">Correo</label><input id="nc-email" class="input" type="email"></div><div class="field"><label class="label">Teléfono</label><input id="nc-phone" class="input" inputmode="tel"></div></div><div class="grid2"><div class="field"><label class="label">Rol</label><select id="nc-role" class="select"><option value="coach">Coach</option><option value="owner">Owner</option></select></div><div class="field"><label class="label">Estado</label><select id="nc-status" class="select"><option value="active">Activo</option><option value="suspended">Suspendido</option></select></div></div><div class="hint">La contraseña debe tener al menos 8 caracteres. El coach usará estas credenciales en Coach Panel.</div><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button id="create-coach-btn" class="btn primary" onclick="createCoach()">Crear coach</button></div>`)}
async function createCoach(){const btn=$('create-coach-btn'),payload={p_session_token:state.token,p_name:$('nc-name').value.trim(),p_username:$('nc-user').value.trim(),p_password:$('nc-pass').value,p_email:$('nc-email').value.trim()||null,p_phone:$('nc-phone').value.trim()||null,p_role:$('nc-role').value,p_status:$('nc-status').value};if(!payload.p_name||!payload.p_username||!payload.p_password){showToast('Completa nombre, usuario y contraseña.','err');return}btn.disabled=true;btn.textContent='Creando…';try{await rpc('ab_global_owner_create_coach',payload);closeModal();await loadAllData();showScreen('coaches');showToast('Coach creado ✓')}catch(e){showToast(errorMessage(e),'err');btn.disabled=false;btn.textContent='Crear coach'}}
function openEditCoach(id){const c=state.coaches.find(x=>String(x.id)===String(id));if(!c)return;openModal(`Editar · ${c.name}`,`<div class="field"><label class="label">Nombre</label><input id="ec-name" class="input" value="${esc(c.name||'')}"></div><div class="field"><label class="label">Usuario</label><input id="ec-user" class="input" value="${esc(c.username||'')}" autocapitalize="off"></div><div class="grid2"><div class="field"><label class="label">Correo</label><input id="ec-email" class="input" type="email" value="${esc(c.email||'')}"></div><div class="field"><label class="label">Teléfono</label><input id="ec-phone" class="input" value="${esc(c.phone||'')}"></div></div><div class="grid2"><div class="field"><label class="label">Rol</label><select id="ec-role" class="select"><option value="coach" ${c.role==='coach'?'selected':''}>Coach</option><option value="owner" ${c.role==='owner'?'selected':''}>Owner</option></select></div><div class="field"><label class="label">Estado</label><select id="ec-status" class="select"><option value="active" ${coachStatus(c)==='active'?'selected':''}>Activo</option><option value="suspended" ${coachStatus(c)==='suspended'?'selected':''}>Suspendido</option><option value="archived" ${coachStatus(c)==='archived'?'selected':''}>Archivado</option></select></div></div><div class="hint">Suspender bloquea el acceso conservando clientes e historial. Archivar retira la cuenta de la operación diaria.</div><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button id="edit-coach-btn" class="btn primary" onclick="saveCoach('${jsq(id)}')">Guardar</button></div>`)}
async function saveCoach(id){const btn=$('edit-coach-btn');btn.disabled=true;try{await rpc('ab_global_owner_update_coach',{p_session_token:state.token,p_coach_id:id,p_name:$('ec-name').value.trim(),p_username:$('ec-user').value.trim(),p_email:$('ec-email').value.trim()||null,p_phone:$('ec-phone').value.trim()||null,p_role:$('ec-role').value,p_status:$('ec-status').value});closeModal();await loadAllData();renderScreen(currentScreen);showToast('Coach actualizado ✓')}catch(e){showToast(errorMessage(e),'err');btn.disabled=false}}
function openResetPassword(id){const c=state.coaches.find(x=>String(x.id)===String(id));if(!c)return;openModal(`Nueva contraseña · ${c.name}`,`<div class="field"><label class="label">Nueva contraseña</label><input id="rp-pass" class="input" type="password" autocomplete="new-password"></div><div class="field"><label class="label">Repetir contraseña</label><input id="rp-pass2" class="input" type="password" autocomplete="new-password"></div><div class="hint">Al guardar se cerrarán las sesiones anteriores del coach cuando el backend pueda invalidarlas.</div><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button id="reset-pass-btn" class="btn primary" onclick="resetCoachPassword('${jsq(id)}')">Restablecer</button></div>`)}
async function resetCoachPassword(id){const p=$('rp-pass').value,p2=$('rp-pass2').value;if(p.length<8){showToast('Mínimo 8 caracteres.','err');return}if(p!==p2){showToast('Las contraseñas no coinciden.','err');return}const b=$('reset-pass-btn');b.disabled=true;try{await rpc('ab_global_owner_reset_coach_password',{p_session_token:state.token,p_coach_id:id,p_new_password:p});closeModal();showToast('Contraseña actualizada ✓')}catch(e){showToast(errorMessage(e),'err');b.disabled=false}}
function openCoachDetail(id){const c=state.coaches.find(x=>String(x.id)===String(id));if(!c)return;const clients=clientsOf(id),logs=logsOfClients(clients),others=activeCoaches().filter(x=>String(x.id)!==String(id));$('coach-detail-content').innerHTML=`<div class="eyebrow">Cuenta y cartera</div><div class="title">${esc(c.name)}</div><div class="card"><div class="card-body"><div style="display:flex;align-items:center;gap:12px"><div class="avatar lg">${initials(c.name)}</div><div class="grow" style="min-width:0"><div class="name truncate">${esc(c.name)}</div><div class="meta">${esc(c.role)} · @${esc(c.username||'')}</div><div class="meta">${clients.length} clientes · ${statusBadge(coachStatus(c))}</div></div></div></div><div class="card-actions"><button class="btn secondary" onclick="openEditCoach('${jsq(id)}')">Editar cuenta</button><button class="btn secondary" onclick="openResetPassword('${jsq(id)}')">Contraseña</button></div></div><div class="section-head"><span class="section-label">Clientes asignados</span></div>${clients.length?clients.map(cl=>{const a=state.assignments.find(x=>String(x.clientId)===String(cl.id)),p=a?state.programs.find(x=>String(x.id)===String(a.programId)):null,last=logs.find(x=>String(x.clientId)===String(cl.id));return `<div class="card"><div class="card-body"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${initials(cl.name)}</div><div class="grow" style="min-width:0"><div class="name truncate">${esc(cl.name)}</div><div class="meta" style="color:var(--cyan)">${esc(p?.name||p?.nameEs||'Sin plan')}</div><div class="meta">Última sesión: ${formatDate(last?.trainingDate||last?.createdAt)}</div></div></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px"><button class="btn secondary" onclick="openEditClient('${jsq(cl.id)}')">Acceso</button>${others.length?`<select class="select" style="width:auto;min-width:150px" onchange="reassignClient('${jsq(cl.id)}',this.value,this)"><option value="">Reasignar a…</option>${others.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select>`:''}</div></div></div>`}).join(''):'<div class="card"><div class="empty">Sin clientes asignados.</div></div>'}<div class="section-head"><span class="section-label">Últimas sesiones</span></div>${logs.slice(0,10).map(l=>{const cl=state.clients.find(x=>String(x.id)===String(l.clientId));return `<div class="card"><div class="card-body" style="display:flex;align-items:center;justify-content:space-between"><div><div class="name">${esc(cl?.name||'—')}</div><div class="meta">${formatDate(l.trainingDate||l.createdAt)}</div></div><span class="badge green">${esc(l.status||'realizada')}</span></div></div>`}).join('')||'<div class="card"><div class="empty">Sin sesiones registradas.</div></div>'}`;showScreen('coach-detail')}
async function reassignClient(clientId,newCoachId,select){if(!newCoachId)return;const cl=state.clients.find(x=>String(x.id)===String(clientId)),co=state.coaches.find(x=>String(x.id)===String(newCoachId));if(!confirm(`¿Reasignar ${cl?.name||'cliente'} a ${co?.name||'este coach'}?`)){select.value='';return}try{await rpc('ab_global_owner_reassign_client',{p_session_token:state.token,p_client_id:clientId,p_new_coach_id:newCoachId});await loadAllData();openCoachDetail(newCoachId);showToast('Cliente reasignado ✓')}catch(e){showToast(errorMessage(e),'err');select.value=''}}
function renderClients(){const q=($('client-search')?.value||'').trim().toLowerCase();let rows=[...state.clients];if(q)rows=rows.filter(c=>[c.name,c.phone,c.email,c.accessCode].join(' ').toLowerCase().includes(q));rows.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));$('clients-content').innerHTML=rows.length?rows.map(c=>{const coach=state.coaches.find(x=>String(x.id)===String(c.coachId)),a=state.assignments.find(x=>String(x.clientId)===String(c.id)),p=a?state.programs.find(x=>String(x.id)===String(a.programId)):null;return `<div class="card"><div class="card-body"><div style="display:flex;align-items:center;gap:10px"><div class="avatar">${initials(c.name)}</div><div class="grow" style="min-width:0"><div class="name truncate">${esc(c.name)}</div><div class="meta">${esc(coach?.name||'Sin coach')} · ${esc(p?.name||p?.nameEs||'Sin plan')}</div></div><span class="badge ${String(c.status||'activo').toLowerCase()==='activo'?'green':'amber'}">${esc(c.status||'activo')}</span></div></div><div class="card-actions"><button class="btn secondary" onclick="openEditClient('${jsq(c.id)}')">Editar acceso</button></div></div>`}).join(''):'<div class="empty"><strong>Sin resultados</strong></div>'}
function openEditClient(id){const c=state.clients.find(x=>String(x.id)===String(id));if(!c)return;openModal(`Acceso · ${c.name}`,`<div class="field"><label class="label">Teléfono de login</label><input id="client-phone" class="input" value="${esc(c.phone||'')}" inputmode="tel"></div><div class="field"><label class="label">Código de acceso</label><input id="client-code" class="input" value="${esc(c.accessCode||'')}" autocapitalize="characters"></div><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button id="client-save-btn" class="btn primary" onclick="saveClientAccess('${jsq(id)}')">Guardar</button></div>`)}
async function saveClientAccess(id){const b=$('client-save-btn');b.disabled=true;try{await rpc('ab_global_owner_update_client_access',{p_session_token:state.token,p_client_id:id,p_phone:$('client-phone').value.trim()||null,p_access_code:$('client-code').value.trim().toUpperCase()||null});closeModal();await loadAllData();renderScreen(currentScreen);showToast('Acceso actualizado ✓')}catch(e){showToast(errorMessage(e),'err');b.disabled=false}}
function renderPrograms(){$('programs-content').innerHTML=state.programs.length?state.programs.map(p=>{const n=state.assignments.filter(a=>String(a.programId)===String(p.id)).length;return `<div class="card"><div class="card-body"><div class="name">${esc(p.name||p.nameEs||'Programa')}</div><div class="meta">${n} asignaciones activas</div><div class="row" style="margin-top:8px"><span class="key">Estado</span><span class="badge ${String(p.status||'activo').toLowerCase()==='activo'?'green':'amber'}">${esc(p.status||'activo')}</span></div>${p.description?`<div style="font-size:.79rem;color:var(--muted);line-height:1.55;margin-top:8px">${esc(p.description)}</div>`:''}</div></div>`}).join(''):'<div class="empty"><strong>Sin programas</strong></div>'}
function renderAlerts(){const pending=state.alerts.filter(a=>!a.resueltaAt&&!a.resolvedAt&&String(a.estado||a.status||'pendiente').toLowerCase()==='pendiente'),resolved=state.alerts.filter(a=>a.resueltaAt||a.resolvedAt||['resuelta','resolved'].includes(String(a.estado||a.status||'').toLowerCase()));$('alert-metrics').innerHTML=`<div class="metrics"><div class="metric r"><span class="metric-n">${pending.length}</span><span class="metric-l">Pendientes</span></div><div class="metric g"><span class="metric-n">${resolved.length}</span><span class="metric-l">Resueltas</span></div><div class="metric c"><span class="metric-n">${state.alerts.length}</span><span class="metric-l">Total</span></div></div>`;const rows=[...pending,...resolved].slice(0,100);$('alerts-content').innerHTML=rows.length?rows.map(a=>{const isPending=pending.includes(a),level=String(a.nivel||a.level||'info').toLowerCase(),color=['critica','alerta','critical'].includes(level)?'var(--red)':level==='revisar'?'var(--amber)':'var(--cyan)';return `<div class="card" style="border-left:3px solid ${color}"><div class="card-body"><div style="display:flex;gap:10px;align-items:flex-start"><div class="name grow">${esc(a.titulo||a.title||'Alerta')}</div><span class="badge ${isPending?'red':'green'}">${isPending?'Pendiente':'Resuelta'}</span></div><div style="font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:7px">${esc(a.mensaje||a.message||'')}</div><div class="meta" style="margin-top:6px">${esc(a.clientName||'')} · ${formatDate(a.createdAt)}</div></div>${isPending?`<div class="card-actions"><button class="btn green" onclick="resolveAlert('${jsq(a.id)}')">Resolver</button></div>`:''}</div>`}).join(''):'<div class="empty"><strong>Sin alertas</strong>Todo bajo control.</div>'}
async function resolveAlert(id){try{await rpc('ab_global_owner_resolve_alert',{p_session_token:state.token,p_alert_id:id,p_note:''});await loadAllData();renderAlerts();showToast('Alerta resuelta ✓')}catch(e){showToast(errorMessage(e),'err')}}
pageInit();
</script>
</body>
</html>
